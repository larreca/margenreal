<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Mapa de objeciones</text><g font-family="Arial"><rect x="80" y="180" width="300" height="310" rx="28" fill="#eef0fb"/><text x="120" y="240" font-size="24" font-weight="700" fill="#101858">FRASE VISIBLE</text><text x="120" y="300" font-size="18" fill="#34364a">“Está caro”</text><text x="120" y="340" font-size="18" fill="#34364a">“No conozco la marca”</text><text x="120" y="380" font-size="18" fill="#34364a">“Lo vi en TikTok”</text><rect x="450" y="180" width="300" height="310" rx="28" fill="#fff8e9"/><text x="490" y="240" font-size="24" font-weight="700" fill="#101858">CAUSA REAL</text><text x="490" y="300" font-size="18" fill="#34364a">Presupuesto</text><text x="490" y="340" font-size="18" fill="#34364a">Riesgo / confianza</text><text x="490" y="380" font-size="18" fill="#34364a">Prueba social</text><rect x="820" y="180" width="300" height="310" rx="28" fill="#eef8f4"/><text x="860" y="240" font-size="24" font-weight="700" fill="#101858">RESPUESTA</text><text x="860" y="300" font-size="18" fill="#34364a">Aclarar</text><text x="860" y="340" font-size="18" fill="#34364a">Comparar</text><text x="860" y="380" font-size="18" fill="#34364a">Reducir incertidumbre</text><text x="80" y="660" font-size="20" font-weight="700" fill="#ed3489">Responder la frase sin descubrir la causa suele producir la solución equivocada.</text></g></svg>