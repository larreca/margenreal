<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">“Está caro” · tres rutas</text><g font-family="Arial"><rect x="90" y="180" width="300" height="350" rx="28" fill="#eef0fb"/><text x="130" y="240" font-size="24" font-weight="700" fill="#101858">PRESUPUESTO</text><text x="130" y="300" font-size="18" fill="#34364a">No entra en caja.</text><text x="130" y="350" font-size="17" fill="#686b80">Priorizar / down-sell.</text><rect x="450" y="180" width="300" height="350" rx="28" fill="#eef8f4"/><text x="490" y="240" font-size="24" font-weight="700" fill="#101858">COMPARACIÓN</text><text x="490" y="300" font-size="18" fill="#34364a">Lo vio más barato.</text><text x="490" y="350" font-size="17" fill="#686b80">Mismo SKU, tamaño y final.</text><rect x="810" y="180" width="300" height="350" rx="28" fill="#fff8e9"/><text x="850" y="240" font-size="24" font-weight="700" fill="#101858">VALOR</text><text x="850" y="300" font-size="18" fill="#34364a">No entiende diferencia.</text><text x="850" y="350" font-size="17" fill="#686b80">Explicar función / uso.</text><text x="90" y="665" font-size="20" font-weight="700" fill="#ed3489">Una sola frase puede necesitar tres respuestas completamente distintas.</text></g></svg>