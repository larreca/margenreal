<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Dashboard B2B de objeciones</text><g font-family="Arial"><rect x="80" y="180" width="300" height="180" rx="26" fill="#eef0fb"/><text x="120" y="235" font-size="23" font-weight="700" fill="#101858">TASA OBJECIÓN</text><text x="120" y="285" font-size="17" fill="#34364a">¿Dónde hay fricción?</text><rect x="450" y="180" width="300" height="180" rx="26" fill="#eef8f4"/><text x="490" y="235" font-size="23" font-weight="700" fill="#101858">CONV. POST</text><text x="490" y="285" font-size="17" fill="#34364a">¿La respuesta ayuda?</text><rect x="820" y="180" width="300" height="180" rx="26" fill="#fff8e9"/><text x="860" y="235" font-size="23" font-weight="700" fill="#101858">DESCUENTO</text><text x="860" y="285" font-size="17" fill="#34364a">¿Dependemos de rebaja?</text><rect x="265" y="430" width="300" height="180" rx="26" fill="#fff1f7"/><text x="305" y="485" font-size="23" font-weight="700" fill="#101858">MOTIVO PÉRDIDA</text><text x="305" y="535" font-size="17" fill="#34364a">¿Qué no resolvemos?</text><rect x="635" y="430" width="300" height="180" rx="26" fill="#faf1ff"/><text x="675" y="485" font-size="23" font-weight="700" fill="#101858">RECOMPRA</text><text x="675" y="535" font-size="17" fill="#34364a">¿La confianza se sostuvo?</text><text x="80" y="710" font-size="20" font-weight="700" fill="#ed3489">No busques cero objeciones: busca mejores respuestas y mejores decisiones.</text></g></svg>