<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#fff"/>
<text x="70" y="78" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Mapa de objeciones B2B K-Beauty</text>
<text x="70" y="118" font-family="Arial" font-size="18" fill="#686b80">Cada objeción necesita una respuesta distinta y una métrica distinta</text>
<g font-family="Arial">
<rect x="70" y="175" width="330" height="170" rx="25" fill="#fff1f7"/>
<text x="100" y="220" font-size="23" font-weight="700" fill="#101858">PRECIO</text>
<text x="100" y="260" font-size="18" fill="#33364b">“Está caro” · “Lo vi más barato”</text>
<text x="100" y="305" font-size="16" fill="#686b80">Diagnóstico: valor / comparación / presupuesto</text>

<rect x="435" y="175" width="330" height="170" rx="25" fill="#eef0fb"/>
<text x="465" y="220" font-size="23" font-weight="700" fill="#101858">CONFIANZA</text>
<text x="465" y="260" font-size="18" fill="#33364b">“No conozco la marca”</text>
<text x="465" y="305" font-size="16" fill="#686b80">Diagnóstico: riesgo / evidencia / reputación</text>

<rect x="800" y="175" width="330" height="170" rx="25" fill="#eef8f4"/>
<text x="830" y="220" font-size="23" font-weight="700" fill="#101858">VIRALIDAD</text>
<text x="830" y="260" font-size="18" fill="#33364b">“TikTok dice que este es mejor”</text>
<text x="830" y="305" font-size="16" fill="#686b80">Diagnóstico: prueba social / expectativa</text>

<rect x="70" y="380" width="330" height="170" rx="25" fill="#fff7e9"/>
<text x="100" y="425" font-size="23" font-weight="700" fill="#101858">RAPIDEZ</text>
<text x="100" y="465" font-size="18" fill="#33364b">“¿Cuándo voy a ver resultado?”</text>
<text x="100" y="510" font-size="16" fill="#686b80">Diagnóstico: expectativa / paciencia / adherencia</text>

<rect x="435" y="380" width="330" height="170" rx="25" fill="#eef8ff"/>
<text x="465" y="425" font-size="23" font-weight="700" fill="#101858">REACCIÓN</text>
<text x="465" y="465" font-size="18" fill="#33364b">“Me da miedo que me irrite”</text>
<text x="465" y="510" font-size="16" fill="#686b80">Diagnóstico: tolerancia / antecedente / seguridad</text>

<rect x="800" y="380" width="330" height="170" rx="25" fill="#f3efff"/>
<text x="830" y="425" font-size="23" font-weight="700" fill="#101858">SIMPLICIDAD</text>
<text x="830" y="465" font-size="18" fill="#33364b">“No quiero 10 pasos”</text>
<text x="830" y="510" font-size="16" fill="#686b80">Diagnóstico: tiempo / hábito / sobrecarga</text>

<rect x="230" y="610" width="740" height="95" rx="22" fill="#101858"/>
<text x="275" y="650" font-size="22" font-weight="700" fill="#fff">MIDE: objeción → respuesta → resultado</text>
<text x="275" y="682" font-size="17" fill="#fff">conversión post-objeción · descuento usado · motivo perdido · recompra</text>
</g></svg>