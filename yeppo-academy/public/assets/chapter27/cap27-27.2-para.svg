<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#fff"/>
<text x="70" y="78" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Método P.A.R.A. para responder objeciones</text>
<text x="70" y="118" font-family="Arial" font-size="18" fill="#686b80">Adaptación Yeppo de principios de escucha, exploración y respuesta consultiva</text>
<g font-family="Arial">
<rect x="80" y="190" width="240" height="410" rx="28" fill="#eef0fb"/>
<text x="115" y="245" font-size="30" font-weight="700" fill="#745fd8">P</text>
<text x="155" y="245" font-size="23" font-weight="700" fill="#101858">PAUSA</text>
<text x="115" y="300" font-size="18" fill="#33364b">No interrumpas.</text><text x="115" y="335" font-size="18" fill="#33364b">No te defiendas.</text><text x="115" y="370" font-size="18" fill="#33364b">Deja terminar.</text>
<text x="115" y="500" font-size="16" fill="#686b80">“Entiendo.”</text>

<rect x="350" y="190" width="240" height="410" rx="28" fill="#fff1f7"/>
<text x="385" y="245" font-size="30" font-weight="700" fill="#ed3489">A</text>
<text x="425" y="245" font-size="23" font-weight="700" fill="#101858">ACLARA</text>
<text x="385" y="300" font-size="18" fill="#33364b">Pregunta qué</text><text x="385" y="335" font-size="18" fill="#33364b">significa realmente</text><text x="385" y="370" font-size="18" fill="#33364b">la objeción.</text>
<text x="385" y="500" font-size="16" fill="#686b80">“¿Comparado con qué?”</text>

<rect x="620" y="190" width="240" height="410" rx="28" fill="#eef8f4"/>
<text x="655" y="245" font-size="30" font-weight="700" fill="#27a679">R</text>
<text x="695" y="245" font-size="23" font-weight="700" fill="#101858">RESPONDE</text>
<text x="655" y="300" font-size="18" fill="#33364b">Da evidencia,</text><text x="655" y="335" font-size="18" fill="#33364b">opciones o límites.</text><text x="655" y="370" font-size="18" fill="#33364b">Sin discutir.</text>
<text x="655" y="500" font-size="16" fill="#686b80">“La diferencia es…”</text>

<rect x="890" y="190" width="240" height="410" rx="28" fill="#fff7e9"/>
<text x="925" y="245" font-size="30" font-weight="700" fill="#d99b2b">A</text>
<text x="965" y="245" font-size="23" font-weight="700" fill="#101858">ASEGURA</text>
<text x="925" y="300" font-size="18" fill="#33364b">Comprueba si</text><text x="925" y="335" font-size="18" fill="#33364b">la duda quedó</text><text x="925" y="370" font-size="18" fill="#33364b">resuelta.</text>
<text x="925" y="500" font-size="16" fill="#686b80">“¿Eso responde tu duda?”</text>

<text x="80" y="690" font-size="20" font-weight="700" fill="#101858">P.A.R.A. no es un guion rígido.</text>
<text x="80" y="730" font-size="18" fill="#33364b">Es una disciplina: entender antes de responder y confirmar antes de cerrar.</text>
</g></svg>