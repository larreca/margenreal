<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#fff"/>
<text x="70" y="78" font-family="Arial" font-size="36" font-weight="700" fill="#101858">La objeción visible no siempre es la objeción real</text>
<text x="70" y="118" font-family="Arial" font-size="18" fill="#686b80">Escucha las palabras; investiga la preocupación detrás</text>
<rect x="130" y="190" width="940" height="150" rx="28" fill="#eef0fb"/>
<text x="175" y="245" font-family="Arial" font-size="25" font-weight="700" fill="#101858">LO QUE DICE</text>
<text x="175" y="295" font-family="Arial" font-size="21" fill="#33364b">“Está caro” · “No conozco la marca” · “Vi otro viral” · “Me da miedo reaccionar”</text>
<path d="M600 340 L600 410" stroke="#745fd8" stroke-width="8"/>
<polygon points="600,430 580,400 620,400" fill="#745fd8"/>
<rect x="130" y="430" width="940" height="260" rx="28" fill="#fff1f7"/>
<text x="175" y="480" font-family="Arial" font-size="25" font-weight="700" fill="#101858">LO QUE PUEDE SIGNIFICAR</text>
<text x="175" y="530" font-family="Arial" font-size="20" fill="#33364b">• No veo suficiente valor para justificar el precio.</text>
<text x="175" y="570" font-family="Arial" font-size="20" fill="#33364b">• No confío todavía en la marca o en quien me vende.</text>
<text x="175" y="610" font-family="Arial" font-size="20" fill="#33364b">• Quiero reducir riesgo antes de probar.</text>
<text x="175" y="650" font-family="Arial" font-size="20" fill="#33364b">• Quiero una solución más simple o más rápida.</text>
<text x="130" y="755" font-family="Arial" font-size="19" font-weight="700" fill="#ed3489">Responder rápido a la frase equivocada puede empeorar la objeción.</text>
</svg>