<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="visual-title visual-desc"><title id="visual-title">Errores críticos de seguridad y venta</title><desc id="visual-desc">Una urgencia ignorada, un diagnóstico fuera de alcance o un claim falso pueden invalidar una evaluación aunque el promedio sea alto.</desc><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#241b2d}.muted{font-family:Arial,Helvetica,sans-serif;fill:#5e5367}.white{font-family:Arial,Helvetica,sans-serif;fill:#fff}.serif{font-family:Georgia,serif;fill:#241b2d}</style><rect x="0" y="0" width="1200" height="760" rx="0" fill="#f9f4f9" stroke="none" stroke-width="2"/><rect x="42" y="35" width="1116" height="690" rx="30" fill="#fff" stroke="#eadde9" stroke-width="2"/><rect x="72" y="70" width="208" height="38" rx="19" fill="#f4dbea" stroke="none" stroke-width="2"/><text x="90" y="97" class="t" font-size="18" font-weight="700">YEPPO / 50.6</text><text x="74" y="166" class="serif" font-size="40">Una alerta cambia la decisión</text><text x="74" y="204" class="muted" font-size="21">Los errores críticos requieren corregir el criterio y repetir el caso.</text><rect x="74" y="240" width="512" height="184" rx="24" fill="#fff1de" stroke="none" stroke-width="2"/><rect x="94" y="260" width="50" height="50" rx="16" fill="#9a642c" stroke="none" stroke-width="2"/><text x="110" y="294" class="white" font-size="24" font-weight="700">1</text><text x="162" y="290" class="t" font-size="25" font-weight="700">Detectar</text><text x="100" y="338" class="t" font-size="21">Urgencia, lesión cambiante,</text><text x="100" y="368" class="t" font-size="21">claim falso o dato no verificado.</text><rect x="618" y="240" width="512" height="184" rx="24" fill="#f9ece8" stroke="none" stroke-width="2"/><rect x="638" y="260" width="50" height="50" rx="16" fill="#b2655b" stroke="none" stroke-width="2"/><text x="654" y="294" class="white" font-size="24" font-weight="700">2</text><text x="706" y="290" class="t" font-size="25" font-weight="700">Detener</text><text x="644" y="338" class="t" font-size="21">No continuar con venta</text><text x="644" y="368" class="t" font-size="21">o promesa insegura.</text><rect x="74" y="448" width="512" height="184" rx="24" fill="#edf2fc" stroke="none" stroke-width="2"/><rect x="94" y="468" width="50" height="50" rx="16" fill="#565a9b" stroke="none" stroke-width="2"/><text x="110" y="502" class="white" font-size="24" font-weight="700">3</text><text x="162" y="498" class="t" font-size="25" font-weight="700">Derivar o verificar</text><text x="100" y="546" class="t" font-size="21">Orientar a atención profesional</text><text x="100" y="576" class="t" font-size="21">o revisar fuente y documentación.</text><rect x="618" y="448" width="512" height="184" rx="24" fill="#eaf4ef" stroke="none" stroke-width="2"/><rect x="638" y="468" width="50" height="50" rx="16" fill="#417b68" stroke="none" stroke-width="2"/><text x="654" y="502" class="white" font-size="24" font-weight="700">4</text><text x="706" y="498" class="t" font-size="25" font-weight="700">Repetir la evaluación</text><text x="644" y="546" class="t" font-size="21">Corregir la decisión crítica</text><text x="644" y="576" class="t" font-size="21">antes de aprobar el bloque.</text><rect x="74" y="666" width="1056" height="38" rx="14" fill="#2b1d34" stroke="none" stroke-width="2"/><text x="94" y="692" class="white" font-size="18" font-weight="700">En el cuestionario final, fallar la pregunta de urgencias impide aprobar.</text></svg>