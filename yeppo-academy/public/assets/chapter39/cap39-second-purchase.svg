<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">De primera compra a recurrencia</text><g font-family="Arial"><rect x="90" y="190" width="200" height="320" rx="24" fill="#eef0fb"/><text x="120" y="245" font-size="21" font-weight="700" fill="#101858">1ª COMPRA</text><rect x="310" y="190" width="200" height="320" rx="24" fill="#eef8f4"/><text x="350" y="245" font-size="21" font-weight="700" fill="#101858">ADOPCIÓN</text><rect x="530" y="190" width="200" height="320" rx="24" fill="#fff8e9"/><text x="585" y="245" font-size="21" font-weight="700" fill="#101858">SEÑAL</text><rect x="750" y="190" width="200" height="320" rx="24" fill="#fff1f7"/><text x="790" y="245" font-size="21" font-weight="700" fill="#101858">NECESIDAD</text><rect x="970" y="190" width="150" height="320" rx="24" fill="#faf1ff"/><text x="990" y="245" font-size="20" font-weight="700" fill="#101858">2ª COMPRA</text><text x="90" y="655" font-size="20" font-weight="700" fill="#ed3489">La segunda compra debe sentirse lógica, no comprada.</text></g></svg>