<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Entrevista de 5 minutos para orientar el tipo de piel</text><text x="70" y="120" font-family="Arial" font-size="18" fill="#686b80">No reemplaza medición instrumental ni diagnóstico dermatológico</text>
<g font-family="Arial">
<rect x="80" y="185" width="1040" height="88" rx="22" fill="#eef0fb"/><text x="110" y="220" font-size="19" font-weight="700" fill="#101858">1 · DESPUÉS DE LIMPIAR</text><text x="110" y="250" font-size="18" fill="#33364b">¿Queda cómoda, tirante, áspera o vuelve el brillo rápidamente?</text>
<rect x="80" y="290" width="1040" height="88" rx="22" fill="#fff1f7"/><text x="110" y="325" font-size="19" font-weight="700" fill="#101858">2 · DURANTE EL DÍA</text><text x="110" y="355" font-size="18" fill="#33364b">¿Dónde aparece brillo: toda la cara, solo zona T o casi nunca?</text>
<rect x="80" y="395" width="1040" height="88" rx="22" fill="#f3efff"/><text x="110" y="430" font-size="19" font-weight="700" fill="#101858">3 · CON HIDRATANTE</text><text x="110" y="460" font-size="18" fill="#33364b">¿Prefiere gel ligero, loción o crema porque otras texturas resultan incómodas?</text>
<rect x="80" y="500" width="1040" height="88" rx="22" fill="#eef8f4"/><text x="110" y="535" font-size="19" font-weight="700" fill="#101858">4 · CAMBIOS</text><text x="110" y="565" font-size="18" fill="#33364b">¿Cambia mucho con invierno, verano, ciclo hormonal, medicamentos o rutina?</text>
<rect x="80" y="605" width="1040" height="88" rx="22" fill="#fff7e9"/><text x="110" y="640" font-size="19" font-weight="700" fill="#101858">5 · SEPARA REACTIVIDAD</text><text x="110" y="670" font-size="18" fill="#33364b">Ardor, picor o reacción se registran aparte; no conviertas “sensible” en respuesta automática.</text>
<text x="80" y="755" font-size="18" font-weight="700" fill="#ed3489">Resultado: orientación cosmética provisional → validar con experiencia de uso y ajustar.</text>
</g></svg>