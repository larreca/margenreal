<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<rect width="1200" height="800" fill="#fff"/>
<text x="70" y="80" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Tipo ≠ estado ≠ preocupación</text>
<text x="70" y="120" font-family="Arial" font-size="18" fill="#686b80">Tres ejes distintos para recomendar mejor</text>
<g transform="translate(70 190)"><rect width="330" height="440" rx="28" fill="#eef0fb"/><text x="35" y="60" font-family="Arial" font-size="27" font-weight="700" fill="#101858">TIPO</text><text x="35" y="105" font-family="Arial" font-size="18" fill="#33364b">Patrón relativamente estable</text><text x="35" y="145" font-family="Arial" font-size="20" fill="#33364b">• seca</text><text x="35" y="185" font-family="Arial" font-size="20" fill="#33364b">• grasa</text><text x="35" y="225" font-family="Arial" font-size="20" fill="#33364b">• mixta</text><text x="35" y="265" font-family="Arial" font-size="20" fill="#33364b">• normal</text><text x="35" y="335" font-family="Arial" font-size="16" fill="#686b80">Principalmente útil para</text><text x="35" y="365" font-family="Arial" font-size="16" fill="#686b80">textura, limpieza e hidratación.</text></g>
<g transform="translate(435 190)"><rect width="330" height="440" rx="28" fill="#fff1f7"/><text x="35" y="60" font-family="Arial" font-size="27" font-weight="700" fill="#101858">ESTADO</text><text x="35" y="105" font-family="Arial" font-size="18" fill="#33364b">Puede cambiar más rápido</text><text x="35" y="145" font-family="Arial" font-size="20" fill="#33364b">• deshidratada</text><text x="35" y="185" font-family="Arial" font-size="20" fill="#33364b">• sensibilizada</text><text x="35" y="225" font-family="Arial" font-size="20" fill="#33364b">• alterada por clima</text><text x="35" y="265" font-family="Arial" font-size="20" fill="#33364b">• post-exfoliación</text><text x="35" y="335" font-family="Arial" font-size="16" fill="#686b80">Una piel grasa puede estar</text><text x="35" y="365" font-family="Arial" font-size="16" fill="#686b80">deshidratada o sensibilizada.</text></g>
<g transform="translate(800 190)"><rect width="330" height="440" rx="28" fill="#f3efff"/><text x="35" y="60" font-family="Arial" font-size="27" font-weight="700" fill="#101858">PREOCUPACIÓN</text><text x="35" y="105" font-family="Arial" font-size="18" fill="#33364b">Lo que la persona quiere abordar</text><text x="35" y="145" font-family="Arial" font-size="20" fill="#33364b">• manchas</text><text x="35" y="185" font-family="Arial" font-size="20" fill="#33364b">• poros</text><text x="35" y="225" font-family="Arial" font-size="20" fill="#33364b">• imperfecciones</text><text x="35" y="265" font-family="Arial" font-size="20" fill="#33364b">• líneas</text><text x="35" y="335" font-family="Arial" font-size="16" fill="#686b80">La preocupación no define</text><text x="35" y="365" font-family="Arial" font-size="16" fill="#686b80">por sí sola el tipo de piel.</text></g>
<path d="M400 410 H435" stroke="#ed3489" stroke-width="5"/><path d="M765 410 H800" stroke="#745fd8" stroke-width="5"/>
<text x="70" y="715" font-family="Arial" font-size="19" font-weight="700" fill="#101858">Recomendación = tipo + estado + preocupación + rutina actual + tolerancia + preferencia de textura.</text>
</svg>