<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<rect width="1200" height="800" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Qué puede observar un vendedor y cuándo detenerse</text><text x="70" y="118" font-family="Arial" font-size="18" fill="#686b80">Infografía Yeppo Academy · límites de una conversación cosmética</text>
<rect x="70" y="180" width="500" height="500" rx="28" fill="#eef8f4"/><text x="110" y="230" font-family="Arial" font-size="26" font-weight="700" fill="#157b53">SÍ PUEDE</text>
<text x="110" y="285" font-family="Arial" font-size="20" fill="#33364b">• preguntar cómo se siente la piel</text><text x="110" y="330" font-family="Arial" font-size="20" fill="#33364b">• hablar de tipo y estado cosmético</text><text x="110" y="375" font-family="Arial" font-size="20" fill="#33364b">• observar brillo, sequedad o textura</text><text x="110" y="420" font-family="Arial" font-size="20" fill="#33364b">• explicar funciones cosméticas</text><text x="110" y="465" font-family="Arial" font-size="20" fill="#33364b">• proponer rutina simple</text><text x="110" y="510" font-family="Arial" font-size="20" fill="#33364b">• preguntar por tolerancia previa</text><text x="110" y="555" font-family="Arial" font-size="20" fill="#33364b">• recomendar fotoprotección</text>
<rect x="630" y="180" width="500" height="500" rx="28" fill="#fff0f1"/><text x="670" y="230" font-family="Arial" font-size="26" font-weight="700" fill="#b42318">NO DEBE</text>
<text x="670" y="285" font-family="Arial" font-size="20" fill="#33364b">• diagnosticar dermatitis, rosácea, acné</text><text x="670" y="330" font-family="Arial" font-size="20" fill="#33364b">• prometer curar una enfermedad</text><text x="670" y="375" font-family="Arial" font-size="20" fill="#33364b">• interpretar lesiones sospechosas</text><text x="670" y="420" font-family="Arial" font-size="20" fill="#33364b">• sustituir una indicación médica</text><text x="670" y="465" font-family="Arial" font-size="20" fill="#33364b">• insistir ante dolor o reacción intensa</text><text x="670" y="510" font-family="Arial" font-size="20" fill="#33364b">• llamar “purga” a cualquier reacción</text><text x="670" y="555" font-family="Arial" font-size="20" fill="#33364b">• minimizar signos de alarma</text>
<text x="70" y="740" font-family="Arial" font-size="18" font-weight="700" fill="#101858">Regla: educación cosmética dentro de límites claros; señales preocupantes se derivan a un profesional.</text>
</svg>