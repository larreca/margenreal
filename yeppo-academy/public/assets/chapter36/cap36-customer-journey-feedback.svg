<text x="84" y="222">1. Descubre</text><text x="489" y="222">2. Compara</text><text x="897" y="222">3. Prueba</text>
<text x="84" y="487">4. Compra</text><text x="489" y="487">5. Recibe</text><text x="897" y="487">6. Usa y consulta</text></g>
<g font-size="19" fill="#30465C">
<text x="84" y="269">«¿Qué problema resuelve?»</text><text x="84" y="309">Redes / búsqueda</text>
<text x="489" y="269">«¿Me sirve a mí?»</text><text x="489" y="309">PDP / reseñas</text>
<text x="897" y="269">«¿Qué textura tiene?»</text><text x="897" y="309">Asesoría en tienda</text>
<text x="84" y="534">«¿Cuánto y cuándo llega?»</text><text x="84" y="574">Checkout / retiro</text>
<text x="489" y="534">«¿Dónde está mi pedido?»</text><text x="489" y="574">Logística / SAC</text>
<text x="897" y="534">«¿Cómo lo integro?»</text><text x="897" y="574">Ayuda / retención</text>
</g>
<rect x="61" y="680" width="1157" height="83" rx="18" fill="#223251"/>
<text x="87" y="715" font-size="22" font-weight="700" fill="white">Cada contacto requiere pregunta, fricción, responsable y KPI.</text>
<text x="87" y="747" font-size="19" fill="#FFFFFF">El mapa es una hipótesis que se contrasta con investigación y datos reales.</text>
<text x="61" y="799" font-size="16" fill="#607087">Referencia conceptual: Shopify Digital Customer Journey (julio 2026) · Caso simulado.</text></g></svg>