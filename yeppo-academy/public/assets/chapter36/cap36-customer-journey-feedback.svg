<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">Un viaje del cliente omnicanal que puede regresar a etapas anteriores</title>
<desc id="desc">Ejemplo didáctico sin datos reales: redes sociales, comparación en página de producto, asesoría en tienda, compra online, entrega y primer uso; flechas bidireccionales muestran cambios de canal. Cada punto relaciona la pregunta del cliente con la responsabilidad operativa.</desc>
<rect width="1280" height="820" fill="#FAF8F6"/>
<g font-family="Arial,sans-serif">
<text x="60" y="82" font-size="39" font-weight="700" fill="#1B2945">El cliente no recorre un embudo rígido</text>
<text x="60" y="125" font-size="21" fill="#546279">Puede comparar, volver atrás y cambiar de canal antes o después de comprar.</text>
<g fill="none" stroke="#B16D8C" stroke-width="6" stroke-linecap="round">
