<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Postcompra antes de la recompra</text><g font-family="Arial"><rect x="80" y="180" width="200" height="320" rx="26" fill="#eef0fb"/><text x="110" y="240" font-size="22" font-weight="700" fill="#101858">CONFIRMAR</text><text x="110" y="300" font-size="16" fill="#34364a">Pedido</text><rect x="300" y="180" width="200" height="320" rx="26" fill="#eef8f4"/><text x="345" y="240" font-size="22" font-weight="700" fill="#101858">INFORMAR</text><text x="345" y="300" font-size="16" fill="#34364a">Tracking</text><rect x="520" y="180" width="200" height="320" rx="26" fill="#fff8e9"/><text x="565" y="240" font-size="22" font-weight="700" fill="#101858">ENTREGAR</text><text x="565" y="300" font-size="16" fill="#34364a">Expectativa</text><rect x="740" y="180" width="200" height="320" rx="26" fill="#fff1f7"/><text x="795" y="240" font-size="22" font-weight="700" fill="#101858">ENSEÑAR</text><text x="790" y="300" font-size="16" fill="#34364a">Cómo usar</text><rect x="960" y="180" width="160" height="320" rx="26" fill="#faf1ff"/><text x="980" y="240" font-size="20" font-weight="700" fill="#101858">ACOMPAÑAR</text><text x="990" y="300" font-size="16" fill="#34364a">Soporte</text><text x="80" y="655" font-size="20" font-weight="700" fill="#ed3489">Primero confirmar la decisión; después vender otra cosa.</text></g></svg>