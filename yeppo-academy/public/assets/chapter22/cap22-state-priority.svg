<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Tres datos que cambian la decisión</text><g font-family="Arial"><rect x="90" y="180" width="300" height="330" rx="28" fill="#eef0fb"/><text x="130" y="240" font-size="24" font-weight="700" fill="#101858">PRIORIDAD</text><text x="130" y="300" font-size="18" fill="#34364a">¿Qué quiere mejorar?</text><text x="130" y="345" font-size="17" fill="#686b80">Define objetivo.</text><rect x="450" y="180" width="300" height="330" rx="28" fill="#eef8f4"/><text x="490" y="240" font-size="24" font-weight="700" fill="#101858">TIPO</text><text x="490" y="300" font-size="18" fill="#34364a">Grasa · seca · mixta</text><text x="490" y="345" font-size="17" fill="#686b80">Orienta textura.</text><rect x="810" y="180" width="300" height="330" rx="28" fill="#fff1f7"/><text x="850" y="240" font-size="24" font-weight="700" fill="#101858">ESTADO</text><text x="850" y="300" font-size="18" fill="#34364a">Irritada · estable</text><text x="850" y="345" font-size="17" fill="#686b80">Cambia intensidad.</text><text x="90" y="650" font-size="20" font-weight="700" fill="#ed3489">La etiqueta “piel grasa” nunca debe reemplazar la pregunta “¿cómo está hoy?”.</text></g></svg>