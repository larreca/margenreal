<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Entrevista comercial: 7 preguntas que reducen error</text><text x="70" y="120" font-family="Arial" font-size="18" fill="#686b80">Breve, clara y orientada a decisión</text><g font-family="Arial"><rect x="80" y="175" width="500" height="72" rx="18" fill="#eef0fb"/><text x="110" y="219" font-size="18" font-weight="700" fill="#101858">1 · ¿Qué quieres mejorar primero?</text><rect x="620" y="175" width="500" height="72" rx="18" fill="#fff1f7"/><text x="650" y="219" font-size="18" font-weight="700" fill="#101858">2 · ¿Cómo se siente tu piel hoy?</text><rect x="80" y="270" width="500" height="72" rx="18" fill="#eef8f4"/><text x="110" y="314" font-size="18" font-weight="700" fill="#101858">3 · ¿Qué usas actualmente?</text><rect x="620" y="270" width="500" height="72" rx="18" fill="#fff7e9"/><text x="650" y="314" font-size="18" font-weight="700" fill="#101858">4 · ¿Qué te ha irritado antes?</text><rect x="80" y="365" width="500" height="72" rx="18" fill="#f3efff"/><text x="110" y="409" font-size="18" font-weight="700" fill="#101858">5 · ¿Qué textura prefieres?</text><rect x="620" y="365" width="500" height="72" rx="18" fill="#eef8ff"/><text x="650" y="409" font-size="18" font-weight="700" fill="#101858">6 · ¿Qué presupuesto manejas?</text><rect x="250" y="485" width="700" height="86" rx="20" fill="#101858"/><text x="285" y="537" font-size="20" font-weight="700" fill="#fff">7 · ¿Quieres rutina corta o estás acostumbrado/a a varios pasos?</text><text x="80" y="660" font-size="20" font-weight="700" fill="#ed3489">Pregunta lo necesario para recomendar. No conviertas la venta en interrogatorio.</text></g></svg>