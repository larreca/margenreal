<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="75" font-family="Arial" font-size="33" font-weight="700" fill="#101858">Algoritmo Yeppo · 7 filtros</text><g font-family="Arial"><rect x="80" y="145" width="1040" height="70" rx="18" fill="#fff1f7"/><text x="115" y="189" font-size="19" font-weight="700" fill="#101858">1 SEGURIDAD</text><text x="350" y="189" font-size="17" fill="#34364a">¿Está dentro del alcance cosmético?</text><rect x="120" y="235" width="960" height="70" rx="18" fill="#eef0fb"/><text x="155" y="279" font-size="19" font-weight="700" fill="#101858">2 PRIORIDAD</text><text x="350" y="279" font-size="17" fill="#34364a">¿Qué quiere mejorar primero?</text><rect x="160" y="325" width="880" height="70" rx="18" fill="#eef8f4"/><text x="195" y="369" font-size="19" font-weight="700" fill="#101858">3 ESTADO</text><text x="350" y="369" font-size="17" fill="#34364a">Tipo + estado + tolerancia</text><rect x="200" y="415" width="800" height="70" rx="18" fill="#fff8e9"/><text x="235" y="459" font-size="19" font-weight="700" fill="#101858">4 RUTINA</text><text x="350" y="459" font-size="17" fill="#34364a">Activos, frecuencia, duplicaciones</text><rect x="240" y="505" width="720" height="70" rx="18" fill="#faf1ff"/><text x="275" y="549" font-size="19" font-weight="700" fill="#101858">5 RESTRICCIONES</text><text x="470" y="549" font-size="17" fill="#34364a">Textura · hábito · presupuesto · stock</text><rect x="280" y="595" width="640" height="70" rx="18" fill="#eef0fb"/><text x="315" y="639" font-size="19" font-weight="700" fill="#101858">6 SHORTLIST</text><text x="500" y="639" font-size="17" fill="#34364a">0–3 opciones defendibles</text><rect x="320" y="685" width="560" height="70" rx="18" fill="#eef8f4"/><text x="355" y="729" font-size="19" font-weight="700" fill="#101858">7 USO + SEGUIMIENTO</text></g></svg>