<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Salida de recomendación</text><g font-family="Arial"><rect x="120" y="155" width="960" height="520" rx="32" fill="#f8f7fc"/><text x="165" y="215" font-size="23" font-weight="700" fill="#101858">PRODUCTO / OPCIÓN</text><text x="165" y="275" font-size="18" fill="#34364a">1 · POR QUÉ → objetivo que resuelve</text><text x="165" y="325" font-size="18" fill="#34364a">2 · DÓNDE → lugar en la rutina</text><text x="165" y="375" font-size="18" fill="#34364a">3 · FRECUENCIA → inicio e incremento</text><text x="165" y="425" font-size="18" fill="#34364a">4 · MANTENER → hidratación / SPF / base</text><text x="165" y="475" font-size="18" fill="#34364a">5 · PAUSA → señal que obliga a revisar</text><text x="165" y="525" font-size="18" fill="#34364a">6 · SEGUIMIENTO → cuándo reevaluar</text><rect x="165" y="575" width="870" height="65" rx="18" fill="#eef8f4"/><text x="205" y="617" font-size="18" font-weight="700" fill="#101858">La salida debe poder ejecutarse sin volver a preguntar “¿cómo lo uso?”.</text></g></svg>