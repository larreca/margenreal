<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Bundles B2B: base + héroe + opcional</text><g font-family="Arial"><rect x="90" y="180" width="300" height="330" rx="28" fill="#eef0fb"/><text x="130" y="240" font-size="24" font-weight="700" fill="#101858">BASE 3</text><text x="130" y="295" font-size="18" fill="#34364a">Cleanser</text><text x="130" y="335" font-size="18" fill="#34364a">Moisturizer</text><text x="130" y="375" font-size="18" fill="#34364a">SPF</text><rect x="450" y="180" width="300" height="330" rx="28" fill="#fff1f7"/><text x="490" y="240" font-size="24" font-weight="700" fill="#101858">HÉROE</text><text x="490" y="295" font-size="18" fill="#34364a">BHA</text><text x="490" y="335" font-size="18" fill="#34364a">TXA / niacinamida</text><text x="490" y="375" font-size="18" fill="#34364a">Retinol</text><rect x="810" y="180" width="300" height="330" rx="28" fill="#eef8f4"/><text x="850" y="240" font-size="24" font-weight="700" fill="#101858">OPCIONAL</text><text x="850" y="295" font-size="18" fill="#34364a">Toner</text><text x="850" y="335" font-size="18" fill="#34364a">Mask</text><text x="850" y="375" font-size="18" fill="#34364a">Booster</text><text x="90" y="650" font-size="20" font-weight="700" fill="#ed3489">Cada SKU debe tener un rol explicable y una razón de recompra.</text></g></svg>