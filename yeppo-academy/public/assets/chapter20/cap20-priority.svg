<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Una prioridad primero</text><g font-family="Arial"><rect x="390" y="150" width="420" height="90" rx="24" fill="#eef0fb"/><text x="455" y="205" font-size="23" font-weight="700" fill="#101858">¿QUÉ QUIERES MEJORAR PRIMERO?</text><rect x="80" y="330" width="240" height="170" rx="24" fill="#fff1f7"/><text x="120" y="385" font-size="22" font-weight="700" fill="#101858">BROTES</text><text x="110" y="430" font-size="17" fill="#34364a">BHA / pauta acne</text><rect x="360" y="330" width="240" height="170" rx="24" fill="#fff8e9"/><text x="400" y="385" font-size="22" font-weight="700" fill="#101858">MANCHAS</text><text x="390" y="430" font-size="17" fill="#34364a">TXA / niacinamida</text><rect x="640" y="330" width="240" height="170" rx="24" fill="#eef8f4"/><text x="685" y="385" font-size="22" font-weight="700" fill="#101858">LÍNEAS</text><text x="680" y="430" font-size="17" fill="#34364a">retinoide + SPF</text><rect x="920" y="330" width="200" height="170" rx="24" fill="#faf1ff"/><text x="950" y="385" font-size="22" font-weight="700" fill="#101858">ROJEZ</text><text x="945" y="430" font-size="17" fill="#34364a">simplificar</text><text x="80" y="650" font-size="20" font-weight="700" fill="#ed3489">La secundaria entra después de tolerancia, no el primer día.</text></g></svg>