<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">AM protege · PM trata</text><g font-family="Arial"><rect x="80" y="165" width="500" height="430" rx="28" fill="#fff8e9"/><text x="120" y="225" font-size="27" font-weight="700" fill="#101858">MAÑANA</text><text x="120" y="285" font-size="19" fill="#34364a">1 · Limpiar si hace falta</text><text x="120" y="335" font-size="19" fill="#34364a">2 · Tratamiento opcional</text><text x="120" y="385" font-size="19" fill="#34364a">3 · Hidratar según necesidad</text><text x="120" y="435" font-size="19" fill="#34364a">4 · SPF al final</text><rect x="620" y="165" width="500" height="430" rx="28" fill="#eef0fb"/><text x="660" y="225" font-size="27" font-weight="700" fill="#101858">NOCHE</text><text x="660" y="285" font-size="19" fill="#34364a">1 · Limpiar</text><text x="660" y="335" font-size="19" fill="#34364a">2 · Tratamiento principal</text><text x="660" y="385" font-size="19" fill="#34364a">3 · Hidratar</text><text x="660" y="435" font-size="19" fill="#34364a">4 · Opcionales sólo si aportan</text><text x="80" y="700" font-size="19" font-weight="700" fill="#ed3489">No necesitas duplicar todos los productos AM y PM.</text></g></svg>