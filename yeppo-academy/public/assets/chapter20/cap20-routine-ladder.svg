<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Rutinas: mínimo viable antes de sofisticar</text><text x="70" y="120" font-family="Arial" font-size="18" fill="#686b80">Una rutina que se usa gana a una rutina perfecta que se abandona</text><g font-family="Arial"><rect x="100" y="535" width="1000" height="110" rx="24" fill="#eef0fb"/><text x="140" y="580" font-size="23" font-weight="700" fill="#101858">NIVEL 1 · BASE</text><text x="140" y="620" font-size="18" fill="#33364b">limpieza según necesidad · hidratación · SPF de día</text><rect x="180" y="395" width="840" height="110" rx="24" fill="#fff1f7"/><text x="220" y="440" font-size="23" font-weight="700" fill="#101858">NIVEL 2 · OBJETIVO</text><text x="220" y="480" font-size="18" fill="#33364b">+ un tratamiento principal bien tolerado</text><rect x="260" y="255" width="680" height="110" rx="24" fill="#eef8f4"/><text x="300" y="300" font-size="23" font-weight="700" fill="#101858">NIVEL 3 · OPTIMIZACIÓN</text><text x="300" y="340" font-size="18" fill="#33364b">texturas, segundo objetivo, conveniencia</text><rect x="340" y="115" width="520" height="110" rx="24" fill="#fff7e9"/><text x="380" y="160" font-size="23" font-weight="700" fill="#101858">NIVEL 4 · AVANZADA</text><text x="380" y="200" font-size="18" fill="#33364b">solo si entiende y sostiene la rutina</text><text x="100" y="725" font-size="18" font-weight="700" fill="#ed3489">Cada paso nuevo debe resolver un problema real, no completar una lista de diez pasos.</text></g></svg>