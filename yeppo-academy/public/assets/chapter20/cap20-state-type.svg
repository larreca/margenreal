<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Tipo de piel ≠ estado actual</text><g font-family="Arial"><rect x="100" y="180" width="450" height="350" rx="28" fill="#eef0fb"/><text x="140" y="235" font-size="25" font-weight="700" fill="#101858">TIPO</text><text x="140" y="290" font-size="18" fill="#34364a">Grasa · seca · mixta</text><text x="140" y="335" font-size="18" fill="#34364a">Orienta textura</text><text x="140" y="380" font-size="18" fill="#34364a">Relativamente estable</text><rect x="650" y="180" width="450" height="350" rx="28" fill="#fff1f7"/><text x="690" y="235" font-size="25" font-weight="700" fill="#101858">ESTADO</text><text x="690" y="290" font-size="18" fill="#34364a">Reactiva · deshidratada</text><text x="690" y="335" font-size="18" fill="#34364a">Irritada · estable</text><text x="690" y="380" font-size="18" fill="#34364a">Cambia intensidad y frecuencia</text><rect x="200" y="610" width="800" height="90" rx="24" fill="#eef8f4"/><text x="245" y="665" font-size="20" font-weight="700" fill="#101858">Rutina correcta = textura compatible + intensidad tolerable.</text></g></svg>