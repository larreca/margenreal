<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1057" viewBox="0 0 560 1057" role="img" aria-labelledby="t d"><title id="t">Tester seguro: 4 decisiones</title><desc id="d">No compartir aplicador. Revisar estado y trazabilidad, usar método higiénico, suspender ante alteración o piel lesionada.</desc><rect x="0" y="0" width="560" height="1057" rx="0" fill="#fff"/><text x="28" y="59" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#162251">Tester seguro: 4 decisiones</text><text x="28" y="96" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#4b5870">CAPÍTULO 32 · EJERCICIO DIDÁCTICO</text><rect x="28" y="128" width="504" height="190" rx="20" fill="#eaf0fa"/><text x="52" y="170" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#162251">REVISAR</text><text x="52" y="216" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#c52c71">1</text><text x="52" y="268" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">Etiqueta, lote, olor</text><text x="52" y="297" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">y estado del envase</text><rect x="28" y="333" width="504" height="190" rx="20" fill="#f9e9f0"/><text x="52" y="375" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#162251">DISPENSAR</text><text x="52" y="421" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#c52c71">2</text><text x="52" y="473" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">Sin tocar piel;</text><text x="52" y="502" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">aplicador nuevo</text><rect x="28" y="538" width="504" height="190" rx="20" fill="#e8f5ef"/><text x="52" y="580" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#162251">OBSERVAR</text><text x="52" y="626" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#c52c71">3</text><text x="52" y="678" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">Evitar piel irritada</text><text x="52" y="707" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">o lesionada</text><rect x="28" y="743" width="504" height="190" rx="20" fill="#fff2df"/><text x="52" y="785" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#162251">RETIRAR</text><text x="52" y="831" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#c52c71">4</text><text x="52" y="883" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">Alterado o sin</text><text x="52" y="912" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">control de apertura</text><rect x="28" y="949" width="504" height="96" rx="20" fill="#e8f5ef"/><text x="48" y="989" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#162251">Un aplicador de un solo uso no</text><text x="48" y="1016" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#162251">garantiza riesgo cero.</text></svg>