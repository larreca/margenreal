<svg xmlns="http://www.w3.org/2000/svg" width="560" height="960" viewBox="0 0 560 960" role="img" aria-labelledby="t d"><title id="t">Cumplimiento ≠ causalidad</title><desc id="d">Cumplimiento visual sube de 80 a 95 por ciento, una mejora de 15 puntos porcentuales. Ticket sube 5 por ciento con promoción simultánea.</desc><rect x="0" y="0" width="560" height="960" rx="0" fill="#fff"/><text x="28" y="59" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#162251">Cumplimiento ≠ causalidad</text><text x="28" y="96" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#4b5870">CAPÍTULO 32 · EJERCICIO DIDÁCTICO</text><rect x="28" y="127" width="504" height="193" rx="20" fill="#eaf0fa"/><text x="52" y="169" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#162251">ANTES</text><text x="52" y="215" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#c52c71">80 %</text><text x="52" y="267" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">16 de 20 posiciones</text><rect x="28" y="337" width="504" height="193" rx="20" fill="#e8f5ef"/><text x="52" y="379" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#162251">DESPUÉS</text><text x="52" y="425" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#c52c71">95 %</text><text x="52" y="477" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">19 de 20 posiciones</text><rect x="28" y="547" width="504" height="285" rx="20" fill="#fff2df"/><text x="52" y="589" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#162251">CAMBIO</text><text x="52" y="635" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#c52c71">+5 %</text><text x="52" y="687" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">+15 puntos porcentuales</text><text x="52" y="716" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">Ticket $20 mil → $21 mil</text><text x="52" y="745" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">Promo simultánea: no atribuir</text><rect x="28" y="855" width="504" height="96" rx="20" fill="#e8f5ef"/><text x="48" y="895" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#162251">Compara con un control.</text></svg>