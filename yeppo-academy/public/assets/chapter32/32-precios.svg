<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="t d"><title id="t">El fleje y la caja deben coincidir</title><desc id="d">Ejemplo de protector cosmético de 50 ml: precio final 15.990 pesos y PPUM 31.980 pesos por 100 ml; caja 17.990 pesos es una discrepancia.</desc><rect x="0" y="0" width="1200" height="690" rx="0" fill="#fff"/><text x="52" y="73" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" fill="#162251">El fleje y la caja deben coincidir</text><text x="52" y="114" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#4b5870">CAPÍTULO 32 · EJERCICIO DIDÁCTICO</text><rect x="52" y="163" width="520" height="348" rx="20" fill="#f9e9f0"/><text x="78" y="205" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#162251">FLEJE · 50 ML</text><text x="78" y="263" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" fill="#c52c71">$15.990</text><text x="78" y="319" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">Precio al público: $15.990</text><text x="78" y="353" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">PPUM: $31.980 / 100 ml</text><text x="78" y="387" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">Cálculo: 15.990 ÷ 50 × 100</text><rect x="601" y="163" width="547" height="348" rx="20" fill="#fff2df"/><text x="627" y="205" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#162251">CAJA / POS</text><text x="627" y="263" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" fill="#c52c71">$17.990</text><text x="627" y="319" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">Marca $17.990: hay conflicto</text><text x="627" y="353" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">No cobrar más que lo exhibido</text><text x="627" y="387" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">Corrige fleje y sistema</text><rect x="52" y="572" width="1096" height="82" rx="20" fill="#e8f5ef"/><text x="78" y="624" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#162251">Mismo SKU, tamaño, precio final y PPUM visible.</text></svg>