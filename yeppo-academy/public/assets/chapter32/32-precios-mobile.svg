<svg xmlns="http://www.w3.org/2000/svg" width="560" height="939" viewBox="0 0 560 939" role="img" aria-labelledby="t d"><title id="t">El fleje y la caja deben coincidir</title><desc id="d">Ejemplo de protector cosmético de 50 ml: precio final 15.990 pesos y PPUM 31.980 pesos por 100 ml; caja 17.990 pesos es una discrepancia.</desc><rect x="0" y="0" width="560" height="939" rx="0" fill="#fff"/><text x="28" y="59" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#162251">El fleje y la caja deben coincidir</text><text x="28" y="96" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#4b5870">CAPÍTULO 32 · EJERCICIO DIDÁCTICO</text><rect x="28" y="129" width="504" height="334" rx="20" fill="#f9e9f0"/><text x="52" y="171" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#162251">FLEJE · 50 ML</text><text x="52" y="217" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#c52c71">$15.990</text><text x="52" y="269" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">Precio: $15.990</text><text x="52" y="298" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">PPUM: $31.980 / 100 ml</text><text x="52" y="327" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">15.990 ÷ 50 × 100</text><rect x="28" y="484" width="504" height="322" rx="20" fill="#fff2df"/><text x="52" y="526" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#162251">CAJA / POS</text><text x="52" y="572" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#c52c71">$17.990</text><text x="52" y="624" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">Marca $17.990</text><text x="52" y="653" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">No cobrar precio mayor</text><text x="52" y="682" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">Corrige etiqueta y caja</text><rect x="28" y="831" width="504" height="96" rx="20" fill="#e8f5ef"/><text x="48" y="871" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#162251">Revisa SKU, precio y PPUM.</text></svg>