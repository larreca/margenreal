<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Planograma → Realogram → Compliance</text><g font-family="Arial"><rect x="90" y="180" width="300" height="360" rx="28" fill="#eef0fb"/><text x="135" y="240" font-size="24" font-weight="700" fill="#101858">PLANOGRAMA</text><text x="135" y="300" font-size="17" fill="#34364a">Diseño esperado</text><rect x="450" y="180" width="300" height="360" rx="28" fill="#eef8f4"/><text x="495" y="240" font-size="24" font-weight="700" fill="#101858">REALOGRAM</text><text x="495" y="300" font-size="17" fill="#34364a">Foto de realidad</text><rect x="810" y="180" width="300" height="360" rx="28" fill="#fff8e9"/><text x="850" y="240" font-size="24" font-weight="700" fill="#101858">COMPLIANCE</text><text x="850" y="300" font-size="17" fill="#34364a">Brecha y corrección</text><text x="90" y="665" font-size="20" font-weight="700" fill="#ed3489">El diseño sólo vale si puede ejecutarse y mantenerse.</text></g></svg>