<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc"><title id="title">Recorrido conceptual por zonas para una tienda K-Beauty</title><desc id="desc">Esquema de tienda ficticia: entrada libre, orientación por necesidad, pared protagonista, demostración supervisada y caja. No representa planta ni dimensiones de ninguna sucursal Yeppo.</desc><rect width="1280" height="820" fill="#FBF9F6"/><g font-family="Arial,sans-serif"><text x="62" y="86" font-size="41" font-weight="700" fill="#182846">Recorrido de tienda: cada zona tiene un trabajo</text><text x="62" y="127" font-size="22" fill="#556176">Mapa pedagógico de distribución, no plano de sucursales Yeppo.</text><rect x="75" y="176" width="790" height="540" rx="26" fill="#F7EDE8" stroke="#8E7E87" stroke-width="5"/><rect x="111" y="210" width="328" height="130" rx="14" fill="#D9E9F4"/><text x="136" y="259" font-size="25" font-weight="700" fill="#172946">Pared protagonista</text><text x="136" y="297" font-size="20" fill="#172946">Lanzamientos relevantes</text><rect x="490" y="211" width="336" height="128" rx="14" fill="#E5F1DD"/><text x="513" y="258" font-size="25" font-weight="700" fill="#172946">Misiones de compra</text><text x="513" y="295" font-size="20" fill="#172946">Limpieza · Hidratación · SPF</text><rect x="111" y="385" width="320" height="141" rx="14" fill="#FAE3E9"/><text x="136" y="437" font-size="25" font-weight="700" fill="#172946">Testers controlados</text><text x="136" y="476" font-size="20" fill="#172946">Higiene · Asesoría · Registro</text><rect x="500" y="385" width="326" height="141" rx="14" fill="#E5E5F5"/><text x="530" y="437" font-size="25" font-weight="700" fill="#172946">Caja + complementos</text><text x="530" y="476" font-size="20" fill="#172946">Precio claro · Última decisión</text><rect x="334" y="647" width="292" height="69" rx="12" fill="#FFFFFF" stroke="#8E7E87" stroke-width="3"/><text x="358" y="690" font-size="24" font-weight="700" fill="#172946">ENTRADA LIBRE</text><path d="M478 635 V572 H670 V526" fill="none" stroke="#B15E8B" stroke-width="8" stroke-linejoin="round" stroke-dasharray="15 12"/><path d="M670 526 l-13 18 h26 z" fill="#B15E8B"/><rect x="904" y="176" width="308" height="390" rx="21" fill="#1F2D4D"/><g fill="#FFFFFF"><text x="930" y="225" font-size="26" font-weight="700">Cinco controles</text><text x="930" y="286" font-size="19">1. Acceso despejado</text><text x="930" y="340" font-size="19">2. Precio identificable</text><text x="930" y="394" font-size="19">3. Zonas por necesidad</text><text x="930" y="448" font-size="19">4. Tester supervisado</text><text x="930" y="502" font-size="19">5. Reposición diaria</text></g><text x="902" y="635" font-size="19" fill="#536377">No valida rutas de evacuación,</text><text x="902" y="664" font-size="19" fill="#536377">medidas ni accesibilidad legal.</text><text x="75" y="776" font-size="19" fill="#536377">Evidencia requerida en un local real: mediciones, fotos autorizadas y revisión operativa.</text></g></svg>