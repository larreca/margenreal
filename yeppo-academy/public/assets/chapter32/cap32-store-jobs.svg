<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Qué trabajo cumple cada zona</text><g font-family="Arial"><rect x="70" y="180" width="160" height="290" rx="24" fill="#eef0fb"/><text x="100" y="235" font-size="21" font-weight="700" fill="#101858">ATRAER</text><rect x="250" y="180" width="160" height="290" rx="24" fill="#eef8f4"/><text x="280" y="235" font-size="21" font-weight="700" fill="#101858">ORIENTAR</text><rect x="430" y="180" width="160" height="290" rx="24" fill="#fff8e9"/><text x="460" y="235" font-size="21" font-weight="700" fill="#101858">COMPARAR</text><rect x="610" y="180" width="160" height="290" rx="24" fill="#fff1f7"/><text x="650" y="235" font-size="21" font-weight="700" fill="#101858">PROBAR</text><rect x="790" y="180" width="160" height="290" rx="24" fill="#faf1ff"/><text x="815" y="235" font-size="21" font-weight="700" fill="#101858">COMPLETAR</text><rect x="970" y="180" width="160" height="290" rx="24" fill="#eef0fb"/><text x="1010" y="235" font-size="21" font-weight="700" fill="#101858">CERRAR</text><text x="70" y="650" font-size="20" font-weight="700" fill="#ed3489">Una zona sin trabajo claro suele convertirse en ruido visual.</text></g></svg>