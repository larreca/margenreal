<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="t d"><title id="t">Cumplimiento ≠ causalidad</title><desc id="d">Cumplimiento visual sube de 80 a 95 por ciento, una mejora de 15 puntos porcentuales. Ticket sube 5 por ciento con promoción simultánea.</desc><rect x="0" y="0" width="1200" height="690" rx="0" fill="#fff"/><text x="52" y="73" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" fill="#162251">Cumplimiento ≠ causalidad</text><text x="52" y="114" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#4b5870">CAPÍTULO 32 · EJERCICIO DIDÁCTICO</text><rect x="52" y="155" width="343" height="363" rx="20" fill="#eaf0fa"/><text x="78" y="197" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#162251">ANTES</text><text x="78" y="255" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" fill="#c52c71">80 %</text><text x="78" y="311" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">16 de 20 posiciones</text><text x="78" y="345" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">correctamente ubicadas</text><rect x="425" y="155" width="343" height="363" rx="20" fill="#e8f5ef"/><text x="451" y="197" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#162251">DESPUÉS</text><text x="451" y="255" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" fill="#c52c71">95 %</text><text x="451" y="311" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">19 de 20 posiciones</text><text x="451" y="345" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">correctamente ubicadas</text><rect x="798" y="155" width="350" height="363" rx="20" fill="#fff2df"/><text x="824" y="197" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#162251">CAMBIO</text><text x="824" y="255" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" fill="#c52c71">+5 %</text><text x="824" y="311" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">+15 puntos porcentuales</text><text x="824" y="345" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">Ticket: $20 mil → $21 mil</text><text x="824" y="379" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">Promo simultánea</text><rect x="52" y="572" width="1096" height="82" rx="20" fill="#e8f5ef"/><text x="78" y="624" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#162251">El ticket creció; la causa no está aislada.</text></svg>