<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Jerarquía de señalética</text><g font-family="Arial"><rect x="130" y="180" width="940" height="110" rx="26" fill="#eef0fb"/><text x="180" y="245" font-size="24" font-weight="700" fill="#101858">1 · ORIENTAR</text><text x="470" y="245" font-size="18" fill="#34364a">“Protección UV” · “Manchas” · “Viaje”</text><rect x="190" y="340" width="820" height="110" rx="26" fill="#eef8f4"/><text x="240" y="405" font-size="24" font-weight="700" fill="#101858">2 · COMPARAR</text><text x="520" y="405" font-size="18" fill="#34364a">Gel · cream · stick · tamaños</text><rect x="250" y="500" width="700" height="110" rx="26" fill="#fff8e9"/><text x="300" y="565" font-size="24" font-weight="700" fill="#101858">3 · DECIDIR</text><text x="540" y="565" font-size="18" fill="#34364a">Precio · PPUM · beneficio verificable</text><text x="130" y="710" font-size="20" font-weight="700" fill="#ed3489">Una idea por nivel; no un párrafo por cartel.</text></g></svg>