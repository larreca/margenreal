<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="t d"><title id="t">De la pregunta al estante</title><desc id="d">Una clienta busca SPF. El recorrido orienta por necesidad, permite comparar opciones y mide preguntas repetidas.</desc><rect x="0" y="0" width="1200" height="690" rx="0" fill="#fff"/><text x="52" y="73" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" fill="#162251">De la pregunta al estante</text><text x="52" y="114" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#4b5870">CAPÍTULO 32 · EJERCICIO DIDÁCTICO</text><rect x="52" y="158" width="256" height="355" rx="20" fill="#eaf0fa"/><text x="78" y="200" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#162251">PREGUNTA</text><text x="78" y="258" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" fill="#c52c71">SPF</text><text x="78" y="314" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">Busca protección</text><text x="78" y="348" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">para uso diario</text><rect x="332" y="158" width="256" height="355" rx="20" fill="#f9e9f0"/><text x="358" y="200" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#162251">ORIENTACIÓN</text><text x="358" y="258" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" fill="#c52c71">Zona</text><text x="358" y="314" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">Señal visible:</text><text x="358" y="348" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">Protección UV</text><rect x="612" y="158" width="256" height="355" rx="20" fill="#e8f5ef"/><text x="638" y="200" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#162251">COMPARACIÓN</text><text x="638" y="258" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" fill="#c52c71">Elegir</text><text x="638" y="314" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">Formato, uso, precio</text><text x="638" y="348" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">y disponibilidad</text><rect x="892" y="158" width="256" height="355" rx="20" fill="#fff2df"/><text x="918" y="200" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#162251">CONTROL</text><text x="918" y="258" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" fill="#c52c71">KPI</text><text x="918" y="314" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">Cuenta preguntas</text><text x="918" y="348" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">de ubicación</text><rect x="52" y="572" width="1096" height="82" rx="20" fill="#e8f5ef"/><text x="78" y="624" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#162251">Mide si la nueva zona reduce la búsqueda repetida.</text></svg>