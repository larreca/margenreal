<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-labelledby="title desc"><title id="title">Procedimiento de verificación para testers compartidos</title><desc id="desc">Flujo didáctico: verificar etiqueta y estado, descartar cosméticos alterados, no compartir aplicadores, preferir muestras y aplicadores individuales cuando se permita, registrar y suspender ante irritación; no probar en piel dañada.</desc><rect width="1280" height="840" fill="#FCFAF7"/><g font-family="Arial,sans-serif"><text x="64" y="83" font-size="42" font-weight="700" fill="#1C2947">Tester seguro: decide antes de abrir</text><text x="64" y="129" font-size="21" fill="#526075">La demostración nunca justifica compartir aplicadores ni probar productos alterados.</text><g font-size="25" font-weight="700" fill="#1B2C49"><rect x="64" y="180" width="551" height="177" rx="21" fill="#E7EEF9"/><text x="89" y="231">1. Comprobar producto</text><rect x="665" y="180" width="551" height="177" rx="21" fill="#E8F3E7"/><text x="690" y="231">2. Preparar prueba adecuada</text><rect x="64" y="385" width="551" height="177" rx="21" fill="#FCEBE1"/><text x="89" y="436">3. Elegir zona y explicar</text><rect x="665" y="385" width="551" height="177" rx="21" fill="#F6EAF2"/><text x="690" y="436">4. Cerrar y registrar</text></g><g font-size="20" fill="#26384F"><text x="89" y="273">Etiqueta, vigencia, olor, envase,</text><text x="89" y="305">lote y aspecto. Si hay cambio:</text><text x="89" y="337" font-weight="700">RETIRAR de inmediato.</text><text x="690" y="273">Higiene y un aplicador nuevo</text><text x="690" y="305">de uso único si corresponde;</text><text x="690" y="337" font-weight="700">NUNCA compartir directo.</text><text x="89" y="478">Evitar mucosas, piel dañada,</text><text x="89" y="511">zonas irritadas y contacto no</text><text x="89" y="543">autorizado con ojos o labios.</text><text x="690" y="478">Registrar retiro del tester y</text><text x="690" y="511">reponer cuando sea adecuado;</text><text x="690" y="543">detener ante molestias.</text></g><rect x="64" y="609" width="1152" height="130" rx="20" fill="#222F50"/><text x="93" y="653" fill="#FFFFFF" font-size="26" font-weight="700">Si aparece una reacción intensa: suspende y deriva.</text><text x="93" y="694" fill="#FFFFFF" font-size="20">Una prueba de textura no descarta alergias ni sustituye evaluación médica.</text><text x="64" y="779" fill="#5B6475" font-size="16">Fuentes: FDA · Eye Cosmetic Safety; Ribeiro et al. (2026), estudio piloto de testers (42 muestras).</text><text x="64" y="807" fill="#5B6475" font-size="16">El estudio reportó contaminación en muestras; no demuestra infección o transmisión a clientes.</text></g></svg>