<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="t d"><title id="t">Una rutina, una lógica</title><desc id="d">Adyacencia didáctica: limpiar, hidratar y proteger según preferencias individuales. No agrupar tres exfoliantes como rutina básica.</desc><rect x="0" y="0" width="1200" height="690" rx="0" fill="#fff"/><text x="52" y="73" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" fill="#162251">Una rutina, una lógica</text><text x="52" y="114" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#4b5870">CAPÍTULO 32 · EJERCICIO DIDÁCTICO</text><rect x="52" y="158" width="256" height="355" rx="20" fill="#eaf0fa"/><text x="78" y="200" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#162251">MISIÓN</text><text x="78" y="258" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" fill="#c52c71">Cliente</text><text x="78" y="314" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">Rutina simple según</text><text x="78" y="348" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">tipo y tolerancia</text><rect x="332" y="158" width="256" height="355" rx="20" fill="#f9e9f0"/><text x="358" y="200" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#162251">PASO 1</text><text x="358" y="258" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" fill="#c52c71">Limpiar</text><text x="358" y="314" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">Limpieza adecuada</text><text x="358" y="348" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">sin sobrecargar</text><rect x="612" y="158" width="256" height="355" rx="20" fill="#e8f5ef"/><text x="638" y="200" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#162251">PASO 2</text><text x="638" y="258" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" fill="#c52c71">Hidratar</text><text x="638" y="314" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">Hidratación según</text><text x="638" y="348" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">necesidad</text><rect x="892" y="158" width="256" height="355" rx="20" fill="#fff2df"/><text x="918" y="200" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#162251">PASO 3</text><text x="918" y="258" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" fill="#c52c71">SPF</text><text x="918" y="314" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">Fotoprotección</text><text x="918" y="348" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#4b5870">según ficha</text><rect x="52" y="572" width="1096" height="82" rx="20" fill="#e8f5ef"/><text x="78" y="624" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#162251">No conviertas tres exfoliantes en una rutina básica.</text></svg>