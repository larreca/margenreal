<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1057" viewBox="0 0 560 1057" role="img" aria-labelledby="t d"><title id="t">Una rutina, una lógica</title><desc id="d">Adyacencia didáctica: limpiar, hidratar y proteger según preferencias individuales. No agrupar tres exfoliantes como rutina básica.</desc><rect x="0" y="0" width="560" height="1057" rx="0" fill="#fff"/><text x="28" y="59" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#162251">Una rutina, una lógica</text><text x="28" y="96" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#4b5870">CAPÍTULO 32 · EJERCICIO DIDÁCTICO</text><rect x="28" y="128" width="504" height="190" rx="20" fill="#eaf0fa"/><text x="52" y="170" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#162251">MISIÓN</text><text x="52" y="216" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#c52c71">Cliente</text><text x="52" y="268" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">Rutina simple según</text><text x="52" y="297" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">tipo y tolerancia</text><rect x="28" y="333" width="504" height="190" rx="20" fill="#f9e9f0"/><text x="52" y="375" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#162251">PASO 1</text><text x="52" y="421" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#c52c71">Limpiar</text><text x="52" y="473" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">Limpieza adecuada</text><text x="52" y="502" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">sin sobrecargar</text><rect x="28" y="538" width="504" height="190" rx="20" fill="#e8f5ef"/><text x="52" y="580" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#162251">PASO 2</text><text x="52" y="626" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#c52c71">Hidratar</text><text x="52" y="678" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">Hidratación según</text><text x="52" y="707" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">necesidad</text><rect x="28" y="743" width="504" height="190" rx="20" fill="#fff2df"/><text x="52" y="785" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#162251">PASO 3</text><text x="52" y="831" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#c52c71">SPF</text><text x="52" y="883" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">Fotoprotección</text><text x="52" y="912" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4b5870">según ficha</text><rect x="28" y="949" width="504" height="96" rx="20" fill="#e8f5ef"/><text x="48" y="989" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#162251">No conviertas tres exfoliantes en una</text><text x="48" y="1016" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#162251">rutina básica.</text></svg>