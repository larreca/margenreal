<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Arquitectura B2B: cobertura antes que duplicación</text><g font-family="Arial"><rect x="90" y="170" width="1020" height="90" rx="22" fill="#eef0fb"/><text x="130" y="225" font-size="21" font-weight="700" fill="#101858">1 · BÁSICOS</text><text x="350" y="225" font-size="18" fill="#34364a">Cleanser · hidratante · SPF</text><rect x="140" y="290" width="920" height="90" rx="22" fill="#eef8f4"/><text x="180" y="345" font-size="21" font-weight="700" fill="#101858">2 · TRATAMIENTOS</text><text x="430" y="345" font-size="18" fill="#34364a">manchas · textura · sebo · firmeza</text><rect x="190" y="410" width="820" height="90" rx="22" fill="#fff1f7"/><text x="230" y="465" font-size="21" font-weight="700" fill="#101858">3 · TEXTURAS</text><text x="440" y="465" font-size="18" fill="#34364a">gel · lotion · cream · balm</text><rect x="240" y="530" width="720" height="90" rx="22" fill="#fff8e9"/><text x="280" y="585" font-size="21" font-weight="700" fill="#101858">4 · COMPLEMENTOS</text><text x="535" y="585" font-size="18" fill="#34364a">mask · patch · sleeping pack</text><text x="90" y="720" font-size="20" font-weight="700" fill="#ed3489">Profundiza sólo donde rotación, ticket y recompra lo justifiquen.</text></g></svg>