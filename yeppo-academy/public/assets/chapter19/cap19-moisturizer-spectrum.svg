<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Espectro de texturas hidratantes</text><g font-family="Arial"><rect x="80" y="220" width="180" height="250" rx="26" fill="#eef8f4"/><text x="125" y="275" font-size="23" font-weight="700" fill="#101858">GEL</text><text x="110" y="325" font-size="16" fill="#34364a">Ligero</text><text x="110" y="360" font-size="16" fill="#34364a">Alta aceptación</text><rect x="295" y="220" width="180" height="250" rx="26" fill="#eef0fb"/><text x="325" y="275" font-size="23" font-weight="700" fill="#101858">LOTION</text><text x="325" y="325" font-size="16" fill="#34364a">Intermedio</text><text x="325" y="360" font-size="16" fill="#34364a">Capas fáciles</text><rect x="510" y="220" width="180" height="250" rx="26" fill="#faf1ff"/><text x="535" y="275" font-size="23" font-weight="700" fill="#101858">EMULSION</text><text x="535" y="325" font-size="16" fill="#34364a">Ligero-media</text><text x="535" y="360" font-size="16" fill="#34364a">Agua + lípidos</text><rect x="725" y="220" width="180" height="250" rx="26" fill="#fff1f7"/><text x="760" y="275" font-size="23" font-weight="700" fill="#101858">CREAM</text><text x="755" y="325" font-size="16" fill="#34364a">Más cuerpo</text><text x="755" y="360" font-size="16" fill="#34364a">Más emoliencia</text><rect x="940" y="220" width="180" height="250" rx="26" fill="#fff8e9"/><text x="980" y="275" font-size="23" font-weight="700" fill="#101858">BALM</text><text x="970" y="325" font-size="16" fill="#34364a">Más película</text><text x="970" y="360" font-size="16" fill="#34364a">Zonas secas</text><text x="80" y="590" font-size="19" fill="#34364a">La densidad orienta la experiencia; la fórmula define el rendimiento real.</text><text x="80" y="680" font-size="20" font-weight="700" fill="#ed3489">Piel + clima + tratamiento + preferencia = textura correcta.</text></g></svg>