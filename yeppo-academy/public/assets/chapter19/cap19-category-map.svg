<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Categorías: formato ≠ función</text><text x="70" y="120" font-family="Arial" font-size="18" fill="#686b80">Toner, essence, ampoule y serum son etiquetas de producto; el objetivo lo define la fórmula</text><g font-family="Arial"><rect x="80" y="185" width="300" height="155" rx="24" fill="#eef0fb"/><text x="110" y="230" font-size="22" font-weight="700" fill="#101858">LIMPIEZA</text><text x="110" y="270" font-size="17" fill="#33364b">Retira suciedad, sebo, maquillaje.</text><text x="110" y="305" font-size="16" fill="#686b80">No debe dejar tirantez por defecto.</text><rect x="450" y="185" width="300" height="155" rx="24" fill="#fff1f7"/><text x="480" y="230" font-size="22" font-weight="700" fill="#101858">CAPAS ACUOSAS</text><text x="480" y="270" font-size="17" fill="#33364b">Toner · essence · ampoule · serum.</text><text x="480" y="305" font-size="16" fill="#686b80">Comparar por fórmula y objetivo.</text><rect x="820" y="185" width="300" height="155" rx="24" fill="#eef8f4"/><text x="850" y="230" font-size="22" font-weight="700" fill="#101858">HIDRATACIÓN</text><text x="850" y="270" font-size="17" fill="#33364b">Gel · lotion · cream · balm.</text><text x="850" y="305" font-size="16" fill="#686b80">Textura según tipo/estado.</text><rect x="265" y="390" width="300" height="155" rx="24" fill="#fff7e9"/><text x="295" y="435" font-size="22" font-weight="700" fill="#101858">TRATAMIENTO</text><text x="295" y="475" font-size="17" fill="#33364b">Retinoides · ácidos · pigmento.</text><text x="295" y="510" font-size="16" fill="#686b80">Menos, mejor introducido.</text><rect x="635" y="390" width="300" height="155" rx="24" fill="#f3efff"/><text x="665" y="435" font-size="22" font-weight="700" fill="#101858">PROTECCIÓN</text><text x="665" y="475" font-size="17" fill="#33364b">SPF y medidas frente a UV.</text><text x="665" y="510" font-size="16" fill="#686b80">Paso final de la mañana.</text><text x="80" y="665" font-size="21" font-weight="700" fill="#ed3489">No construyas una rutina porque “faltan pasos”. Construye porque existe una función que falta.</text></g></svg>