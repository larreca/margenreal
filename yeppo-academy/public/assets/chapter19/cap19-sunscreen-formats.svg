<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Protector solar: tres variables distintas</text><g font-family="Arial"><rect x="90" y="180" width="300" height="300" rx="28" fill="#eef0fb"/><text x="125" y="235" font-size="24" font-weight="700" fill="#101858">FORMATO</text><text x="125" y="285" font-size="18" fill="#34364a">Cream · essence</text><text x="125" y="320" font-size="18" fill="#34364a">Serum · stick</text><text x="125" y="355" font-size="18" fill="#34364a">Cushion</text><text x="125" y="410" font-size="16" fill="#686b80">Experiencia / adherencia</text><rect x="450" y="180" width="300" height="300" rx="28" fill="#eef8f4"/><text x="485" y="235" font-size="24" font-weight="700" fill="#101858">SPF / PA</text><text x="485" y="285" font-size="18" fill="#34364a">Protección probada</text><text x="485" y="320" font-size="18" fill="#34364a">en condiciones de test</text><text x="485" y="410" font-size="16" fill="#686b80">No depende del nombre “serum”</text><rect x="810" y="180" width="300" height="300" rx="28" fill="#fff8e9"/><text x="845" y="235" font-size="24" font-weight="700" fill="#101858">CANTIDAD</text><text x="845" y="285" font-size="18" fill="#34364a">Cobertura uniforme</text><text x="845" y="320" font-size="18" fill="#34364a">+ reaplicación</text><text x="845" y="410" font-size="16" fill="#686b80">Determina protección real</text><text x="90" y="650" font-size="20" font-weight="700" fill="#ed3489">El mejor formato es el que facilita suficiente producto y uso consistente.</text></g></svg>