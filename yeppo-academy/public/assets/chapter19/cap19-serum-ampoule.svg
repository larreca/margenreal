<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Serum vs ampoule: no existe una escala universal</text><g font-family="Arial"><rect x="100" y="180" width="450" height="350" rx="28" fill="#eef0fb"/><text x="140" y="235" font-size="25" font-weight="700" fill="#101858">SERUM</text><text x="140" y="290" font-size="18" fill="#34364a">Puede ser ligero o denso</text><text x="140" y="330" font-size="18" fill="#34364a">Puede tener alta o baja concentración</text><text x="140" y="370" font-size="18" fill="#34364a">Puede hidratar o tratar</text><rect x="650" y="180" width="450" height="350" rx="28" fill="#fff1f7"/><text x="690" y="235" font-size="25" font-weight="700" fill="#101858">AMPOULE</text><text x="690" y="290" font-size="18" fill="#34364a">Puede ser ligera o densa</text><text x="690" y="330" font-size="18" fill="#34364a">No garantiza más concentración</text><text x="690" y="370" font-size="18" fill="#34364a">Depende de la marca</text><rect x="210" y="610" width="780" height="95" rx="24" fill="#eef8f4"/><text x="250" y="666" font-size="20" font-weight="700" fill="#101858">Compara INCI, concentración, evidencia y objetivo — no el nombre frontal.</text></g></svg>