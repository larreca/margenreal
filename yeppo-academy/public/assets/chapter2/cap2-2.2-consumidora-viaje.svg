<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">De descubrir a volver</title><desc id="desc">CLIENTA / RECORRIDO. 01 · Descubre: Una historia, un video o una conversación; 02 · Valida: Pregunta por necesidad, fórmula y confianza; 03 · Prueba: Compra una rutina que puede sostener; 04 · Regresa: Evalúa tolerancia y recompra con criterio</desc><style>.ey{font:700 19px Arial,sans-serif;letter-spacing:4px;fill:#ad397b}.title{font:normal 61px Georgia,serif;fill:#291f2d}.head{font:normal 44px Georgia,serif;fill:#77345e}.body{font:19px Arial,sans-serif;fill:#61485c}.foot{font:17px Arial,sans-serif;fill:#65475b}</style><rect width="1200" height="900" fill="#fff9fc"/><path d="M0 0 H1200 V195 H0Z" fill="#f9e3f0"/><circle cx="1080" cy="70" r="145" fill="#e7a1c8" opacity=".28"/><text x="70" y="83" class="ey">YEPPO ACADEMY  /  CLIENTA / RECORRIDO</text><text x="70" y="171" class="title">De descubrir a volver</text><rect x="70" y="270" width="506" height="220" rx="12" fill="#fff7f7"/><text x="100" y="346" class="head">01 · Descubre</text><text x="100" y="391" class="body">Una historia, un video o una conversació</text><rect x="600" y="270" width="506" height="220" rx="12" fill="#f5e1ee"/><text x="630" y="346" class="head">02 · Valida</text><text x="630" y="391" class="body">Pregunta por necesidad, fórmula y confia</text><rect x="70" y="515" width="506" height="220" rx="12" fill="#eee3f5"/><text x="100" y="591" class="head">03 · Prueba</text><text x="100" y="636" class="body">Compra una rutina que puede sostener</text><rect x="600" y="515" width="506" height="220" rx="12" fill="#e9c5dc"/><text x="630" y="591" class="head">04 · Regresa</text><text x="630" y="636" class="body">Evalúa tolerancia y recompra con criteri</text><path d="M70 783 H1130" stroke="#b88aa9"/><text x="70" y="830" class="foot">Guía práctica Yeppo Academy · preguntas para aplicar en tienda</text><text x="1060" y="833