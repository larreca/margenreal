<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#fff"/>
<text x="70" y="78" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Checklist Yeppo para leer un cosmético</text>
<text x="70" y="118" font-family="Arial" font-size="18" fill="#686b80">De la etiqueta a una recomendación responsable</text>
<g font-family="Arial">
<rect x="80" y="175" width="1040" height="78" rx="20" fill="#eef0fb"/><text x="115" y="210" font-size="21" font-weight="700" fill="#101858">1 · IDENTIFICA QUÉ ES</text><text x="115" y="238" font-size="17" fill="#33364b">limpiador · sérum · crema · protector · exfoliante · maquillaje</text>
<rect x="80" y="270" width="1040" height="78" rx="20" fill="#eef8ff"/><text x="115" y="305" font-size="21" font-weight="700" fill="#101858">2 · LEE EL INCI COMPLETO</text><text x="115" y="333" font-size="17" fill="#33364b">no solo “ingredientes clave” ni el claim frontal</text>
<rect x="80" y="365" width="1040" height="78" rx="20" fill="#eef8f4"/><text x="115" y="400" font-size="21" font-weight="700" fill="#101858">3 · AGRUPA POR FUNCIÓN</text><text x="115" y="428" font-size="17" fill="#33364b">vehículo · hidratación · tratamiento · estructura · conservación · sensorial</text>
<rect x="80" y="460" width="1040" height="78" rx="20" fill="#fff7e9"/><text x="115" y="495" font-size="21" font-weight="700" fill="#101858">4 · BUSCA PRECAUCIONES</text><text x="115" y="523" font-size="17" fill="#33364b">retinoides · exfoliantes · fragancia · alergias conocidas · embarazo/tratamiento</text>
<rect x="80" y="555" width="1040" height="78" rx="20" fill="#fff1f7"/><text x="115" y="590" font-size="21" font-weight="700" fill="#101858">5 · CONTRASTA CLAIM VS FÓRMULA</text><text x="115" y="618" font-size="17" fill="#33364b">si el backend, la ficha y el INCI se contradicen, no inventes: verifica</text>
<rect x="80" y="650" width="1040" height="78" rx="20" fill="#f3efff"/><text x="115" y="685" font-size="21" font-weight="700" fill="#101858">6 · RECIÉN ENTONCES RECOMIENDA</text><text x="115" y="713" font-size="17" fill="#33364b">tipo + estado + preocupación + tolerancia + forma de uso</text>
</g></svg>