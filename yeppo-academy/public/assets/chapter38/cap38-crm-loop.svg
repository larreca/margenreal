<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">CRM = contexto + acción</text><g font-family="Arial"><rect x="80" y="190" width="190" height="300" rx="24" fill="#eef0fb"/><text x="120" y="245" font-size="21" font-weight="700" fill="#101858">IDENTIDAD</text><rect x="290" y="190" width="190" height="300" rx="24" fill="#eef8f4"/><text x="330" y="245" font-size="21" font-weight="700" fill="#101858">CONTEXTO</text><rect x="500" y="190" width="190" height="300" rx="24" fill="#fff8e9"/><text x="540" y="245" font-size="21" font-weight="700" fill="#101858">HISTORIAL</text><rect x="710" y="190" width="190" height="300" rx="24" fill="#fff1f7"/><text x="755" y="245" font-size="21" font-weight="700" fill="#101858">ESTADO</text><rect x="920" y="190" width="190" height="300" rx="24" fill="#faf1ff"/><text x="950" y="245" font-size="21" font-weight="700" fill="#101858">PRÓXIMA ACCIÓN</text><text x="80" y="655" font-size="20" font-weight="700" fill="#ed3489">El CRM vale por lo que permite decidir y ejecutar.</text></g></svg>