<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Tendencia ≠ evidencia</text><text x="70" y="120" font-family="Arial" font-size="18" fill="#686b80">Cómo leer ingredientes avanzados sin apagar la innovación</text><g font-family="Arial"><rect x="80" y="180" width="1040" height="85" rx="20" fill="#eef0fb"/><text x="115" y="232" font-size="21" font-weight="700" fill="#101858">1 · ¿QUÉ ES EXACTAMENTE?</text><rect x="125" y="285" width="950" height="85" rx="20" fill="#fff1f7"/><text x="160" y="337" font-size="21" font-weight="700" fill="#101858">2 · ¿LA EVIDENCIA ES TÓPICA, INYECTABLE O PRECLÍNICA?</text><rect x="170" y="390" width="860" height="85" rx="20" fill="#eef8f4"/><text x="205" y="442" font-size="21" font-weight="700" fill="#101858">3 · ¿QUÉ RESULTADO SE MIDIÓ Y EN CUÁNTA GENTE?</text><rect x="215" y="495" width="770" height="85" rx="20" fill="#fff7e9"/><text x="250" y="547" font-size="21" font-weight="700" fill="#101858">4 · ¿LA FÓRMULA COMERCIAL EQUIVALE AL ESTUDIO?</text><rect x="260" y="600" width="680" height="85" rx="20" fill="#f3efff"/><text x="295" y="652" font-size="21" font-weight="700" fill="#101858">5 · ¿QUÉ PROMESA PODEMOS HACER HONESTAMENTE?</text><text x="80" y="755" font-size="18" font-weight="700" fill="#ed3489">La venta responsable no elimina tendencias: las pone en contexto.</text></g></svg>