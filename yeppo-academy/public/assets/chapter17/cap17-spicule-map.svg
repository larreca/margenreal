<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#fff"/>
<text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Spicules / Reedle: intensidad no es una regla de tres</text>
<g font-family="Arial">
<rect x="80" y="190" width="300" height="300" rx="28" fill="#eef8f4"/><text x="115" y="242" font-size="23" font-weight="700" fill="#101858">ENTRADA</text><text x="115" y="290" font-size="18" fill="#34364a">Menor carga sensorial</text><text x="115" y="330" font-size="17" fill="#34364a">Aprender tolerancia</text><text x="115" y="390" font-size="16" fill="#686b80">Objetivo: adaptación,</text><text x="115" y="420" font-size="16" fill="#686b80">no perseguir pinchazo.</text>
<rect x="450" y="190" width="300" height="300" rx="28" fill="#eef0fb"/><text x="485" y="242" font-size="23" font-weight="700" fill="#101858">INTERMEDIO</text><text x="485" y="290" font-size="18" fill="#34364a">Escalar sólo si hay</text><text x="485" y="330" font-size="17" fill="#34364a">un gap de rutina.</text><text x="485" y="390" font-size="16" fill="#686b80">Revisar retinoides,</text><text x="485" y="420" font-size="16" fill="#686b80">ácidos y procedimientos.</text>
<rect x="820" y="190" width="300" height="300" rx="28" fill="#fff1f7"/><text x="855" y="242" font-size="23" font-weight="700" fill="#101858">INTENSIVO</text><text x="855" y="290" font-size="18" fill="#34364a">Mayor experiencia</text><text x="855" y="330" font-size="17" fill="#34364a">no = resultado lineal</text><text x="855" y="390" font-size="16" fill="#686b80">Detener si irritación</text><text x="855" y="420" font-size="16" fill="#686b80">supera tolerancia.</text>
<rect x="150" y="580" width="900" height="95" rx="24" fill="#fff8e9"/><text x="190" y="635" font-size="21" font-weight="700" fill="#101858">100 → 300 describe una gama de marca; no demuestra “3× más eficaz”.</text>
<text x="80" y="750" font-size="17" fill="#686b80">Yeppo Academy · tecnología de delivery ≠ prueba automática de un resultado clínico.</text>
</g></svg>