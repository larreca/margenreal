<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#fff"/>
<text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">“Exosome” no identifica una única materia prima</text>
<text x="70" y="120" font-family="Arial" font-size="18" fill="#686b80">Fuente + caracterización + formulación + vía determinan qué evidencia aplica</text>
<g font-family="Arial">
<rect x="70" y="190" width="245" height="260" rx="26" fill="#f3efff"/><text x="105" y="240" font-size="21" font-weight="700" fill="#101858">MAMÍFERO / HUMANO</text><text x="105" y="295" font-size="17" fill="#34364a">EVs / exosomas</text><text x="105" y="335" font-size="16" fill="#686b80">Contexto regulatorio</text><text x="105" y="367" font-size="16" fill="#686b80">y de seguridad específico.</text>
<rect x="345" y="190" width="245" height="260" rx="26" fill="#eef8f4"/><text x="380" y="240" font-size="21" font-weight="700" fill="#101858">VEGETAL</text><text x="380" y="295" font-size="17" fill="#34364a">Plant-derived EV /</text><text x="380" y="325" font-size="17" fill="#34364a">exosome-like vesicle</text><text x="380" y="375" font-size="16" fill="#686b80">Estandarización aún</text><text x="380" y="407" font-size="16" fill="#686b80">en desarrollo.</text>
<rect x="620" y="190" width="245" height="260" rx="26" fill="#fff1f7"/><text x="655" y="240" font-size="21" font-weight="700" fill="#101858">MICROBIANO</text><text x="655" y="295" font-size="17" fill="#34364a">Ej. Lactobacillus EVs</text><text x="655" y="335" font-size="16" fill="#686b80">No equivale a</text><text x="655" y="367" font-size="16" fill="#686b80">exosoma humano.</text>
<rect x="895" y="190" width="235" height="260" rx="26" fill="#fff8e9"/><text x="930" y="240" font-size="21" font-weight="700" fill="#101858">OTRAS FUENTES</text><text x="930" y="295" font-size="17" fill="#34364a">Leche / matrices</text><text x="930" y="335" font-size="16" fill="#686b80">Necesitan definición</text><text x="930" y="367" font-size="16" fill="#686b80">y documentación.</text>
<rect x="110" y="535" width="980" height="135" rx="26" fill="#eef0fb"/><text x="150" y="585" font-size="22" font-weight="700" fill="#101858">SCOPING REVIEW 2026</text><text x="150" y="625" font-size="18" fill="#34364a">2.394 registros → 18 estudios tópicos · 10 con métodos de delivery · 8 tópico solo</text>
<text x="70" y="750" font-size="18" font-weight="700" fill="#ed3489">Primero pregunta: “¿vesículas de qué?”</text>
</g></svg>