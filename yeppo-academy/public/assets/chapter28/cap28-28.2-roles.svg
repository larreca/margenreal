<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="78" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Los 6 roles de un surtido sano</text><text x="70" y="118" font-family="Arial" font-size="18" fill="#686b80">Un SKU puede cumplir más de un rol; el error es comprar sin saber cuál</text><g font-family="Arial"><rect x="70" y="180" width="330" height="160" rx="24" fill="#eef0fb"/><text x="100" y="225" font-size="22" font-weight="700" fill="#101858">CORE</text><text x="100" y="265" font-size="17" fill="#33364b">Base permanente de demanda.</text><text x="100" y="300" font-size="16" fill="#686b80">Debe tener continuidad.</text><rect x="435" y="180" width="330" height="160" rx="24" fill="#fff1f7"/><text x="465" y="225" font-size="22" font-weight="700" fill="#101858">TRÁFICO</text><text x="465" y="265" font-size="17" fill="#33364b">Atrae visitas o búsquedas.</text><text x="465" y="300" font-size="16" fill="#686b80">Puede tener margen menor.</text><rect x="800" y="180" width="330" height="160" rx="24" fill="#eef8f4"/><text x="830" y="225" font-size="22" font-weight="700" fill="#101858">HÉROE</text><text x="830" y="265" font-size="17" fill="#33364b">Producto insignia/conversor.</text><text x="830" y="300" font-size="16" fill="#686b80">Debe estar disponible.</text><rect x="70" y="375" width="330" height="160" rx="24" fill="#fff7e9"/><text x="100" y="420" font-size="22" font-weight="700" fill="#101858">TENDENCIA</text><text x="100" y="460" font-size="17" fill="#33364b">Captura novedad/viralidad.</text><text x="100" y="495" font-size="16" fill="#686b80">Comprar con límite.</text><rect x="435" y="375" width="330" height="160" rx="24" fill="#eef8ff"/><text x="465" y="420" font-size="22" font-weight="700" fill="#101858">MARGEN</text><text x="465" y="460" font-size="17" fill="#33364b">Aporta rentabilidad al mix.</text><text x="465" y="495" font-size="16" fill="#686b80">No depende solo de volumen.</text><rect x="800" y="375" width="330" height="160" rx="24" fill="#f3efff"/><text x="830" y="420" font-size="22" font-weight="700" fill="#101858">CANASTA / RECOMPRA</text><text x="830" y="460" font-size="17" fill="#33364b">Completa rutina o repite uso.</text><text x="830" y="495" font-size="16" fill="#686b80">Aumenta recurrencia.</text><rect x="220" y="600" width="760" height="90" rx="22" fill="#101858"/><text x="265" y="640" font-size="20" font-weight="700" fill="#fff">MATRIZ DE DECISIÓN</text><text x="265" y="672" font-size="17" fill="#fff">rol + demanda + margen + rotación + capital + riesgo de vencimiento</text></g></svg>