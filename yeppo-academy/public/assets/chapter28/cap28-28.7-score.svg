<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="78" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Score de surtido: ninguna métrica decide sola</text><text x="70" y="118" font-family="Arial" font-size="18" fill="#686b80">Modelo pedagógico para priorizar análisis, no reemplaza el criterio del comprador</text><g font-family="Arial"><rect x="90" y="195" width="1020" height="70" rx="18" fill="#eef0fb"/><text x="120" y="238" font-size="20" font-weight="700" fill="#101858">DEMANDA / VENTA</text><rect x="90" y="285" width="840" height="70" rx="18" fill="#fff1f7"/><text x="120" y="328" font-size="20" font-weight="700" fill="#101858">MARGEN / CONTRIBUCIÓN</text><rect x="90" y="375" width="720" height="70" rx="18" fill="#eef8f4"/><text x="120" y="418" font-size="20" font-weight="700" fill="#101858">ROTACIÓN / SELL-THROUGH</text><rect x="90" y="465" width="600" height="70" rx="18" fill="#fff7e9"/><text x="120" y="508" font-size="20" font-weight="700" fill="#101858">ROL ESTRATÉGICO</text><rect x="90" y="555" width="480" height="70" rx="18" fill="#f3efff"/><text x="120" y="598" font-size="20" font-weight="700" fill="#101858">RIESGO / CAPITAL</text><text x="90" y="700" font-size="19" font-weight="700" fill="#ed3489">Un SKU de baja venta puede quedarse si cumple un rol importante; uno de alta venta puede salir si destruye margen o capital.</text></g></svg>