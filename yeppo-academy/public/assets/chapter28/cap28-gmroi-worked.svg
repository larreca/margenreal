<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc"><title id="title">GMROI: dos SKU, dos decisiones</title><desc id="desc">SKU A: 900000 de margen bruto y 600000 de inventario promedio, GMROI 1,5. SKU B: 700000 y 250000, GMROI 2,8. B usa mejor el capital; A aporta más margen absoluto.</desc><rect width="1280" height="760" fill="#faf8f7"/><text x="56" y="68" fill="#17234b" font-size="38" font-family="Arial,Helvetica,sans-serif" font-weight="700">GMROI: eficiencia del capital ≠ margen absoluto</text><text x="56" y="110" fill="#46536d" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="400">Trimestre ficticio · ambas bases expresadas a costo y en el mismo período</text><rect x="56" y="139" width="1168" height="170" rx="22" fill="#e7eef9"/><text x="86" y="194" fill="#17234b" font-size="32" font-family="Arial,Helvetica,sans-serif" font-weight="700">SKU A</text><text x="265" y="194" fill="#17234b" font-size="27" font-family="Arial,Helvetica,sans-serif" font-weight="400">Margen bruto $900.000</text><text x="265" y="239" fill="#46536d" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="400">Inventario promedio $600.000</text><rect x="900" y="167" width="274" height="95" rx="16" fill="#202d54"/><text x="932" y="225" fill="#fff" font-size="36" font-family="Arial,Helvetica,sans-serif" font-weight="700">GMROI 1,5</text><rect x="56" y="335" width="1168" height="170" rx="22" fill="#e5f4ee"/><text x="86" y="390" fill="#17234b" font-size="32" font-family="Arial,Helvetica,sans-serif" font-weight="700">SKU B</text><text x="265" y="390" fill="#17234b" font-size="27" font-family="Arial,Helvetica,sans-serif" font-weight="400">Margen bruto $700.000</text><text x="265" y="435" fill="#46536d" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="400">Inventario promedio $250.000</text><rect x="900" y="363" width="274" height="95" rx="16" fill="#202d54"/><text x="932" y="421" fill="#fff" font-size="36" font-family="Arial,Helvetica,sans-serif" font-weight="700">GMROI 2,8</text><rect x="56" y="574" width="1168" height="126" rx="22" fill="#f5e4ed"/><text x="84" y="623" fill="#17234b" font-size="26" font-family="Arial,Helvetica,sans-serif" font-weight="700">B rinde más por peso invertido; A deja $200.000 más de margen total.</text><text x="84" y="661" fill="#46536d" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="400">La decisión final requiere rol, demanda, costos de canal y riesgo.</text></svg>