<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Amplitud · Profundidad · Productividad</text><g font-family="Arial"><rect x="90" y="180" width="300" height="360" rx="28" fill="#eef0fb"/><text x="130" y="240" font-size="24" font-weight="700" fill="#101858">AMPLITUD</text><text x="130" y="300" font-size="18" fill="#34364a">Necesidades cubiertas</text><text x="130" y="345" font-size="17" fill="#686b80">¿Faltan misiones?</text><rect x="450" y="180" width="300" height="360" rx="28" fill="#eef8f4"/><text x="490" y="240" font-size="24" font-weight="700" fill="#101858">PROFUNDIDAD</text><text x="490" y="300" font-size="18" fill="#34364a">Alternativas por necesidad</text><text x="490" y="345" font-size="17" fill="#686b80">¿Se diferencian?</text><rect x="810" y="180" width="300" height="360" rx="28" fill="#fff8e9"/><text x="850" y="240" font-size="24" font-weight="700" fill="#101858">PRODUCTIVIDAD</text><text x="850" y="300" font-size="18" fill="#34364a">Margen + rotación</text><text x="850" y="345" font-size="17" fill="#686b80">¿Justifica capital?</text><text x="90" y="665" font-size="20" font-weight="700" fill="#ed3489">Más variedad sólo agrega valor cuando cubre un trabajo distinto o mejora disponibilidad.</text></g></svg>