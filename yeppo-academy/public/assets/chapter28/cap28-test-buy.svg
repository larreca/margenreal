<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Test-buy para novedades</text><g font-family="Arial"><rect x="80" y="185" width="230" height="330" rx="26" fill="#eef0fb"/><text x="120" y="245" font-size="23" font-weight="700" fill="#101858">HIPÓTESIS</text><text x="120" y="305" font-size="17" fill="#34364a">Por qué debería vender</text><rect x="340" y="185" width="230" height="330" rx="26" fill="#eef8f4"/><text x="380" y="245" font-size="23" font-weight="700" fill="#101858">COMPRA CORTA</text><text x="380" y="305" font-size="17" fill="#34364a">Riesgo limitado</text><rect x="600" y="185" width="230" height="330" rx="26" fill="#fff8e9"/><text x="640" y="245" font-size="23" font-weight="700" fill="#101858">SEÑAL</text><text x="640" y="305" font-size="17" fill="#34364a">Sell-through / búsqueda</text><rect x="860" y="185" width="230" height="330" rx="26" fill="#fff1f7"/><text x="900" y="245" font-size="23" font-weight="700" fill="#101858">DECISIÓN</text><text x="900" y="305" font-size="17" fill="#34364a">Escalar o salir</text><text x="80" y="665" font-size="20" font-weight="700" fill="#ed3489">La tendencia se compra como hipótesis hasta que los datos la validan.</text></g></svg>