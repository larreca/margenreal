<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="78" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Surtido = amplitud × profundidad × productividad</text><text x="70" y="118" font-family="Arial" font-size="18" fill="#686b80">Más SKUs no significa automáticamente una mejor tienda</text><g font-family="Arial"><rect x="80" y="190" width="300" height="400" rx="28" fill="#eef0fb"/><text x="115" y="240" font-size="25" font-weight="700" fill="#101858">AMPLITUD</text><text x="115" y="290" font-size="19" fill="#33364b">Cuántas necesidades</text><text x="115" y="325" font-size="19" fill="#33364b">y categorías cubres.</text><text x="115" y="400" font-size="17" fill="#686b80">Ej.: limpieza · SPF</text><text x="115" y="430" font-size="17" fill="#686b80">hidratación · manchas</text><text x="115" y="520" font-size="16" fill="#745fd8">Riesgo: catálogo incompleto</text><rect x="450" y="190" width="300" height="400" rx="28" fill="#fff1f7"/><text x="485" y="240" font-size="25" font-weight="700" fill="#101858">PROFUNDIDAD</text><text x="485" y="290" font-size="19" fill="#33364b">Cuántas opciones tienes</text><text x="485" y="325" font-size="19" fill="#33364b">dentro de cada necesidad.</text><text x="485" y="400" font-size="17" fill="#686b80">Ej.: 5 SPF ligeros</text><text x="485" y="430" font-size="17" fill="#686b80">vs 1 opción única</text><text x="485" y="520" font-size="16" fill="#ed3489">Riesgo: duplicación</text><rect x="820" y="190" width="300" height="400" rx="28" fill="#eef8f4"/><text x="855" y="240" font-size="25" font-weight="700" fill="#101858">PRODUCTIVIDAD</text><text x="855" y="290" font-size="19" fill="#33364b">Venta, margen, rotación</text><text x="855" y="325" font-size="19" fill="#33364b">y rol de cada SKU.</text><text x="855" y="400" font-size="17" fill="#686b80">¿Qué capital inmoviliza?</text><text x="855" y="430" font-size="17" fill="#686b80">¿Qué aporta a la canasta?</text><text x="855" y="520" font-size="16" fill="#27a679">Objetivo: equilibrio</text><text x="80" y="690" font-size="21" font-weight="700" fill="#101858">La pregunta correcta no es “¿cuántos productos tengo?”</text><text x="80" y="735" font-size="18" fill="#33364b">Es “¿qué trabajo cumple cada SKU y cuánto capital necesita para cumplirlo?”</text></g></svg>