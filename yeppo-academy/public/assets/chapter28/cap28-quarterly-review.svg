<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Revisión trimestral de surtido</text><g font-family="Arial"><rect x="80" y="170" width="1040" height="82" rx="20" fill="#eef0fb"/><text x="120" y="222" font-size="21" font-weight="700" fill="#101858">1 · CLASIFICAR</text><text x="380" y="222" font-size="17" fill="#34364a">Rol, misión, categoría</text><rect x="120" y="280" width="960" height="82" rx="20" fill="#eef8f4"/><text x="160" y="332" font-size="21" font-weight="700" fill="#101858">2 · MEDIR</text><text x="380" y="332" font-size="17" fill="#34364a">Venta, margen, rotación, cobertura, GMROI</text><rect x="160" y="390" width="880" height="82" rx="20" fill="#fff8e9"/><text x="200" y="442" font-size="21" font-weight="700" fill="#101858">3 · DECIDIR</text><text x="380" y="442" font-size="17" fill="#34364a">Escalar · mantener · reducir · testear · salir</text><rect x="200" y="500" width="800" height="82" rx="20" fill="#fff1f7"/><text x="240" y="552" font-size="21" font-weight="700" fill="#101858">4 · EJECUTAR</text><text x="430" y="552" font-size="17" fill="#34364a">Compra, precio, contenido, canal</text><rect x="240" y="610" width="720" height="82" rx="20" fill="#faf1ff"/><text x="280" y="662" font-size="21" font-weight="700" fill="#101858">5 · REVISAR FECHA</text></g></svg>