<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1030" viewBox="0 0 640 1030" role="img" aria-labelledby="title desc"><title id="title">GMROI comparado en móvil</title><desc id="desc">Dos ejemplos ficticios con margen, inventario y conclusión; A 1,5 frente a B 2,8.</desc><rect width="640" height="1030" fill="#faf8f7"/><text x="28" y="56" fill="#17234b" font-size="38" font-family="Arial,Helvetica,sans-serif" font-weight="700">GMROI: eficiencia</text><text x="28" y="99" fill="#17234b" font-size="38" font-family="Arial,Helvetica,sans-serif" font-weight="700">y margen absoluto</text><text x="28" y="139" fill="#46536d" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="400">Trimestre ficticio · bases a costo</text><rect x="28" y="185" width="584" height="260" rx="22" fill="#e7eef9"/><text x="54" y="239" fill="#17234b" font-size="34" font-family="Arial,Helvetica,sans-serif" font-weight="700">SKU A</text><text x="54" y="290" fill="#17234b" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="400">Margen bruto $900.000</text><text x="54" y="330" fill="#17234b" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="400">Inventario medio $600.000</text><rect x="54" y="354" width="530" height="72" rx="15" fill="#202d54"/><text x="79" y="403" fill="#fff" font-size="32" font-family="Arial,Helvetica,sans-serif" font-weight="700">GMROI = 1,5</text><rect x="28" y="470" width="584" height="260" rx="22" fill="#e5f4ee"/><text x="54" y="524" fill="#17234b" font-size="34" font-family="Arial,Helvetica,sans-serif" font-weight="700">SKU B</text><text x="54" y="575" fill="#17234b" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="400">Margen bruto $700.000</text><text x="54" y="615" fill="#17234b" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="400">Inventario medio $250.000</text><rect x="54" y="639" width="530" height="72" rx="15" fill="#202d54"/><text x="79" y="688" fill="#fff" font-size="32" font-family="Arial,Helvetica,sans-serif" font-weight="700">GMROI = 2,8</text><rect x="28" y="780" width="584" height="206" rx="22" fill="#f5e4ed"/><text x="50" y="835" fill="#17234b" font-size="28" font-family="Arial,Helvetica,sans-serif" font-weight="700">B rinde más por peso.</text><text x="50" y="878" fill="#17234b" font-size="26" font-family="Arial,Helvetica,sans-serif" font-weight="400">A deja $200.000 más</text><text x="50" y="917" fill="#46536d" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="400">de margen total. Falta</text><text x="50" y="953" fill="#46536d" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="400">evaluar riesgo y demanda.</text></svg>