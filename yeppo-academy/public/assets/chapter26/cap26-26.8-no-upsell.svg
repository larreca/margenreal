<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#fff"/>
<text x="70" y="78" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Cuándo NO hacer upsell</text>
<text x="70" y="118" font-family="Arial" font-size="18" fill="#686b80">La confianza vale más que una mejora de ticket puntual</text>
<g font-family="Arial">
<rect x="80" y="180" width="1040" height="82" rx="20" fill="#fff0f1"/>
<text x="115" y="215" font-size="20" font-weight="700" fill="#b42318">1 · PRIMERA PRUEBA / TOLERANCIA INCIERTA</text>
<text x="115" y="245" font-size="17" fill="#33364b">Formato menor puede reducir riesgo y facilitar aprendizaje.</text>

<rect x="80" y="285" width="1040" height="82" rx="20" fill="#fff7e9"/>
<text x="115" y="320" font-size="20" font-weight="700" fill="#101858">2 · PRESUPUESTO EXPLÍCITO</text>
<text x="115" y="350" font-size="17" fill="#33364b">No conviertas una restricción clara en una negociación.</text>

<rect x="80" y="390" width="1040" height="82" rx="20" fill="#f3efff"/>
<text x="115" y="425" font-size="20" font-weight="700" fill="#101858">3 · DIFERENCIA NO EXPLICABLE</text>
<text x="115" y="455" font-size="17" fill="#33364b">Más caro no significa automáticamente mejor para esa persona.</text>

<rect x="80" y="495" width="1040" height="82" rx="20" fill="#eef8f4"/>
<text x="115" y="530" font-size="20" font-weight="700" fill="#101858">4 · DUPLICACIÓN / COMPLEJIDAD</text>
<text x="115" y="560" font-size="17" fill="#33364b">Si el upgrade agrega fricción sin resolver una necesidad, no aporta valor.</text>

<rect x="80" y="600" width="1040" height="82" rx="20" fill="#eef8ff"/>
<text x="115" y="635" font-size="20" font-weight="700" fill="#101858">5 · STOCK / REPOSICIÓN INESTABLE</text>
<text x="115" y="665" font-size="17" fill="#33364b">No entrenes preferencia por una opción que no podrás sostener.</text>

<text x="80" y="750" font-size="19" font-weight="700" fill="#ed3489">Frase de salida: “La opción base ya resuelve lo que necesitas; la superior solo vale la pena si este beneficio te importa.”</text>
</g></svg>