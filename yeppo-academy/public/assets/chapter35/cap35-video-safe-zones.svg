<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="825" viewBox="0 0 1280 825" role="img" aria-labelledby="t d"><title id="t">Video vertical y zonas seguras: previsualizar en Instagram y TikTok</title><desc id="d">Diseño didáctico de marco vertical de video nueve dieciseisavos con área central reservada para texto clave, controles de interfaz esquemáticos y zonas superior/inferior de riesgo de superposición. No se dan medidas universales; validar previews en plataformas.</desc><rect width="1280" height="825" fill="#FAF8F6"/><g font-family="Arial,sans-serif"><text x="63" y="80" font-size="39" font-weight="700" fill="#192645">Video vertical 9:16 · La interfaz tapa contenido</text><text x="63" y="126" font-size="20" fill="#505E73">Una plantilla editorial no reemplaza probar el placement real.</text><rect x="65" y="173" width="376" height="593" rx="26" fill="#202D48"/><rect x="97" y="198" width="314" height="543" rx="15" fill="#E1EAF2"/><rect x="97" y="198" width="314" height="107" rx="14" fill="#F1CFD7"/><rect x="97" y="636" width="314" height="105" rx="14" fill="#F1CFD7"/><rect x="131" y="330" width="251" height="283" rx="15" fill="#CFEBDA" stroke="#579171" stroke-width="3"/><text x="160" y="402" font-size="22" font-weight="700" fill="#214933">ENVASE</text><text x="160" y="443" font-size="22" font-weight="700" fill="#214933">TEXTURA</text><text x="160" y="484" font-size="21" font-weight="700" fill="#214933">TEXTO LEGIBLE</text><text x="160" y="525" font-size="20" font-weight="700" fill="#214933">CTA APROBADO</text><text x="132" y="265" font-size="19" fill="#863D52">Superposición posible</text><text x="132" y="694" font-size="19" fill="#863D52">Controles y subtítulos</text><rect x="501" y="173" width="716" height="397" rx="21" fill="#E9EDF7"/><text x="527" y="228" font-size="26" font-weight="700" fill="#253354">Cuatro verificaciones antes de publicar</text><g font-size="21" fill="#33465C"><text x="528" y="291">1. Subtítulos contrastados y tamaño legible</text><text x="528" y="355">2. CTA y precio lejos de controles flotantes</text><text x="528" y="419">3. Música y elementos con permiso comercial</text><text x="528" y="483">4. Previsualización real con audio y sin audio</text></g><rect x="501" y="608" width="716" height="136" rx="19" fill="#253451"/><text x="526" y="654" font-size="23" font-weight="700" fill="#FFFFFF">No hay márgenes universales fijos.</text><text x="526" y="692" font-size="20" fill="#FFFFFF">Verificar guía y placement vigente por plataforma.</text><text x="501" y="796" font-size="16" fill="#5C6375">Fuente conceptual: Meta Reels Ads · safe zones, vídeo vertical y audio.</text></g></svg>