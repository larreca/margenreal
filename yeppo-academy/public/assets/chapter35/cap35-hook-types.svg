<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Cuatro familias de hook</text><g font-family="Arial"><rect x="90" y="200" width="230" height="330" rx="28" fill="#eef0fb"/><text x="140" y="260" font-size="25" font-weight="700" fill="#101858">PROBLEMA</text><text x="125" y="325" font-size="17" fill="#34364a">“¿Se siente pesado?”</text><rect x="350" y="200" width="230" height="330" rx="28" fill="#eef8f4"/><text x="390" y="260" font-size="25" font-weight="700" fill="#101858">COMPARA</text><text x="395" y="325" font-size="17" fill="#34364a">“Gel vs cream”</text><rect x="610" y="200" width="230" height="330" rx="28" fill="#fff8e9"/><text x="655" y="260" font-size="25" font-weight="700" fill="#101858">DECIDE</text><text x="650" y="325" font-size="17" fill="#34364a">“30 o 100 ml?”</text><rect x="870" y="200" width="230" height="330" rx="28" fill="#fff1f7"/><text x="905" y="260" font-size="25" font-weight="700" fill="#101858">DEMUESTRA</text><text x="915" y="325" font-size="17" fill="#34364a">Producto desde 0s</text><text x="90" y="660" font-size="20" font-weight="700" fill="#ed3489">El hook debe cumplirse en el cuerpo del video.</text></g></svg>