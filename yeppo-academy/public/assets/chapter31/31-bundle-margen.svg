<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="686" viewBox="0 0 1200 686" role="img"><rect x="0" y="0" width="1200" height="686" rx="0" fill="#FFF"/><text x="54" y="73" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#15215A">El pack también necesita margen</text><text x="54" y="113" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#4C5872">Tres productos · valores netos simulados</text><rect x="54" y="154" width="255" height="348" rx="20" fill="#EAF0FA"/><text x="76" y="199" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#15215A">POR SEPARADO</text><text x="76" y="286" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#15215A">$30.000</text><text x="76" y="363" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#4C5872">12.000 + 10.000</text><text x="76" y="402" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#4C5872">+ 8.000</text><rect x="330" y="154" width="255" height="348" rx="20" fill="#FCECF3"/><text x="352" y="199" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#15215A">PACK</text><text x="352" y="286" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#15215A">$27.000</text><text x="352" y="363" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#4C5872">ahorro $3.000</text><text x="352" y="402" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#4C5872">10% descuento</text><rect x="606" y="154" width="255" height="348" rx="20" fill="#E7F5EF"/><text x="628" y="199" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#15215A">COSTO TOTAL</text><text x="628" y="286" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#15215A">$12.000</text><text x="628" y="363" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#4C5872">beneficio bruto</text><text x="628" y="402" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#4C5872">=$15.000</text><rect x="882" y="154" width="255" height="348" rx="20" fill="#FFF4E2"/><text x="904" y="199" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#15215A">MARGEN BRUTO</text><text x="904" y="286" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#C73578">55,56%</text><text x="904" y="363" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#4C5872">15.000 ÷ 27.000</text><text x="904" y="402" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#4C5872">antes de fees</text><rect x="54" y="527" width="1083" height="91" rx="20" fill="#E8F5F1"/><text x="82" y="581" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#087862">Curaduría, stock y economía del pack.</text><text x="54" y="657" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#4C5872">Todos los importes son supuestos educativos. Recalcula costos y reglas antes de publicar.</text></svg>