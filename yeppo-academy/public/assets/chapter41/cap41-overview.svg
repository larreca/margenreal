<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#fff"/><text x="70" y="78" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Capítulo 41 · Cómo comprar mejor a Yeppo</text><text x="70" y="120" font-family="Arial" font-size="18" fill="#686b80">Mapa visual Yeppo Academy · aprendizaje aplicado para clientes B2B</text><rect x="70" y="160" width="1060" height="54" rx="16" fill="#101858"/><text x="95" y="194" font-family="Arial" font-size="16" font-weight="700" fill="#fff">Comprar mejor significa convertir capital en rotación y recompra, no maximizar el tamaño del pedido.</text><rect x="75" y="250" width="240" height="260" rx="24" fill="#eef0fb"/><text x="103" y="302" font-family="Arial" font-size="18" font-weight="700" fill="#101858">41.1</text><text x="103" y="350" font-family="Arial" font-size="16" font-weight="700" fill="#33364b">Comprar para vender, no para l</text><text x="103" y="380" font-family="Arial" font-size="16" font-weight="700" fill="#33364b">lenar estanterías</text><text x="103" y="450" font-family="Arial" font-size="15" fill="#686b80">Concepto → aplicación</text><rect x="345" y="250" width="240" height="260" rx="24" fill="#fff1f7"/><text x="373" y="302" font-family="Arial" font-size="18" font-weight="700" fill="#101858">41.2</text><text x="373" y="350" font-family="Arial" font-size="16" font-weight="700" fill="#33364b">Anchura vs profundidad de surt</text><text x="373" y="380" font-family="Arial" font-size="16" font-weight="700" fill="#33364b">ido</text><text x="373" y="450" font-family="Arial" font-size="15" fill="#686b80">Concepto → aplicación</text><rect x="615" y="250" width="240" height="260" rx="24" fill="#eef8f4"/><text x="643" y="302" font-family="Arial" font-size="18" font-weight="700" fill="#101858">41.3</text><text x="643" y="350" font-family="Arial" font-size="16" font-weight="700" fill="#33364b">Construir la compra por necesi</text><text x="643" y="380" font-family="Arial" font-size="16" font-weight="700" fill="#33364b">dades</text><text x="643" y="450" font-family="Arial" font-size="15" fill="#686b80">Concepto → aplicación</text><rect x="885" y="250" width="240" height="260" rx="24" fill="#fff7e9"/><text x="913" y="302" font-family="Arial" font-size="18" font-weight="700" fill="#101858">41.4</text><text x="913" y="350" font-family="Arial" font-size="16" font-weight="700" fill="#33364b">Usar precio y ticket del clien</text><text x="913" y="380" font-family="Arial" font-size="16" font-weight="700" fill="#33364b">te</text><text x="913" y="450" font-family="Arial" font-size="15" fill="#686b80">Concepto → aplicación</text><text x="75" y="585" font-family="Arial" font-size="20" font-weight="700" fill="#ed3489">Del conocimiento a la ejecución</text><text x="75" y="625" font-family="Arial" font-size="17" fill="#33364b">8 módulos · casos · decisiones · aplicación B2B · evaluación</text></svg>