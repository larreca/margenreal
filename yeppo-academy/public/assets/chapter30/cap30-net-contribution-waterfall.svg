<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="810" viewBox="0 0 1280 810" role="img" aria-labelledby="t d"><title id="t">De precio al público a margen de contribución</title><desc id="d">Ejercicio simulado: total cobrado 11900 pesos chilenos incluye 1900 de IVA, ingreso neto 10000. Se restan costo 6000, comisión 1190 y logística 500 para obtener contribución 2310, equivalente al 23,1 por ciento del ingreso neto.</desc><rect width="1280" height="810" fill="#FAF9F6"/><g font-family="Arial,sans-serif"><text x="64" y="85" font-size="40" font-weight="700" fill="#1C2846">Precio cobrado ≠ ganancia</text><text x="64" y="125" font-size="21" fill="#586175">Ejemplo de una venta ficticia en CLP. Comisión aplicada al precio bruto.</text><rect x="64" y="171" width="1150" height="104" rx="18" fill="#1F304F"/><text x="92" y="218" font-size="30" font-weight="700" fill="#FFF">Cliente paga: $11.900</text><text x="92" y="253" font-size="19" fill="#E5EAF5">IVA incluido $1.900 → ingreso neto del negocio: $10.000</text><g font-size="23" fill="#1D2D4F"><text x="95" y="331">Ingreso neto</text><text x="95" y="420">Costo del producto</text><text x="95" y="509">Comisión</text><text x="95" y="598">Logística</text><text x="95" y="691">Contribución</text></g><g font-size="22" font-weight="700" fill="#172747"><text x="970" y="331">$10.000</text><text x="970" y="420">− $6.000</text><text x="970" y="509">− $1.190</text><text x="970" y="598">− $500</text><text x="970" y="691">$2.310</text></g><rect x="365" y="298" width="560" height="51" rx="10" fill="#CAE0E8"/><rect x="365" y="387" width="336" height="51" rx="10" fill="#F0BFC0"/><rect x="365" y="476" width="67" height="51" rx="10" fill="#F2D1A6"/><rect x="365" y="565" width="28" height="51" rx="8" fill="#E3D1F2"/><rect x="365" y="657" width="130" height="51" rx="10" fill="#C4E4C5"/><text x="64" y="766" font-size="21" font-weight="700" fill="#205A40">Margen = $2.310 / $10.000 = 23,1 % · Denominador: ingreso sin IVA</text><text x="64" y="797" font-size="15" fill="#617082">No contempla devoluciones ni otros cargos. IVA de referencia: SII 19 % (consulta 26-10-2026).</text></g></svg>