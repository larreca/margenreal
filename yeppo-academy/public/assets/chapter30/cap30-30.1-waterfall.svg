<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="78" font-family="Arial" font-size="36" font-weight="700" fill="#101858">De precio de venta a margen real</text><text x="70" y="118" font-family="Arial" font-size="18" fill="#686b80">Facturar no es ganar: cada capa consume parte de la venta</text><g font-family="Arial"><rect x="80" y="185" width="1040" height="65" rx="16" fill="#745fd8"/><text x="110" y="226" font-size="21" font-weight="700" fill="#fff">PRECIO COBRADO AL CLIENTE</text><rect x="130" y="270" width="940" height="65" rx="16" fill="#9788dc"/><text x="160" y="311" font-size="19" font-weight="700" fill="#fff">− IVA / IMPUESTOS CUANDO CORRESPONDE</text><rect x="180" y="355" width="840" height="65" rx="16" fill="#ed85b5"/><text x="210" y="396" font-size="19" font-weight="700" fill="#fff">− COSTO DEL PRODUCTO</text><rect x="230" y="440" width="740" height="65" rx="16" fill="#d99b2b"/><text x="260" y="481" font-size="19" font-weight="700" fill="#fff">− COMISIÓN / PASARELA / MARKETPLACE</text><rect x="280" y="525" width="640" height="65" rx="16" fill="#6abf9e"/><text x="310" y="566" font-size="19" font-weight="700" fill="#fff">− ENVÍO / PACKING / COSTO DE SERVIR</text><rect x="330" y="610" width="540" height="65" rx="16" fill="#101858"/><text x="360" y="651" font-size="19" font-weight="700" fill="#fff">= CONTRIBUCIÓN DISPONIBLE</text><text x="80" y="755" font-size="18" font-weight="700" fill="#ed3489">El margen bruto del producto y la contribución neta del canal no son la misma cifra.</text></g></svg>