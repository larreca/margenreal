<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Markup ≠ Margen</text><g font-family="Arial"><rect x="120" y="190" width="400" height="360" rx="30" fill="#eef0fb"/><text x="165" y="250" font-size="27" font-weight="700" fill="#101858">MARKUP</text><text x="165" y="320" font-size="19" fill="#34364a">(Precio − Costo) ÷ Costo</text><text x="165" y="390" font-size="22" font-weight="700" fill="#ed3489">$10k → $20k = 100%</text><rect x="680" y="190" width="400" height="360" rx="30" fill="#eef8f4"/><text x="725" y="250" font-size="27" font-weight="700" fill="#101858">MARGEN</text><text x="725" y="320" font-size="19" fill="#34364a">(Precio − Costo) ÷ Precio</text><text x="725" y="390" font-size="22" font-weight="700" fill="#ed3489">$10k → $20k = 50%</text><text x="120" y="680" font-size="20" font-weight="700" fill="#101858">Misma utilidad en pesos, distinto denominador.</text></g></svg>