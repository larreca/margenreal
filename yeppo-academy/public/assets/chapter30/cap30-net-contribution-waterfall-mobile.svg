<svg xmlns="http://www.w3.org/2000/svg" width="560" height="900" viewBox="0 0 560 900" role="img"><rect x="0" y="0" width="560" height="900" rx="0" fill="#FFFFFF"/><text x="28" y="58" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#15215A">De venta a contribución</text><text x="28" y="93" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#4D5873">CLP · pedido hipotético</text><rect x="28" y="126" width="504" height="94" rx="18" fill="#15215A"/><text x="48" y="163" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Precio pagado</text><text x="48" y="200" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#FFFFFF">$11.900</text><rect x="28" y="238" width="504" height="94" rx="18" fill="#E9F0FA"/><text x="48" y="275" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#15215A">Venta neta</text><text x="48" y="312" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#15215A">$10.000</text><rect x="28" y="350" width="504" height="94" rx="18" fill="#FCECF3"/><text x="48" y="387" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#15215A">Costo producto</text><text x="48" y="424" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#15215A">− $6.000</text><rect x="28" y="462" width="504" height="94" rx="18" fill="#FDF1D9"/><text x="48" y="499" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#15215A">Comisión sobre bruto</text><text x="48" y="536" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#15215A">− $1.190</text><rect x="28" y="574" width="504" height="94" rx="18" fill="#EEE8F9"/><text x="48" y="611" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#15215A">Logística</text><text x="48" y="648" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#15215A">− $500</text><rect x="28" y="686" width="504" height="94" rx="18" fill="#E