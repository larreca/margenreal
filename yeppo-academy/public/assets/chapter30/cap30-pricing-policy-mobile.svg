<svg xmlns="http://www.w3.org/2000/svg" width="560" height="929" viewBox="0 0 560 929" role="img"><rect x="0" y="0" width="560" height="929" rx="0" fill="#FFFFFF"/><text x="28" y="59" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#15215A">Antes de fijar precio</text><text x="28" y="94" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#4D5873">Secuencia de aprobación comercial</text><rect x="28" y="127" width="504" height="125" rx="18" fill="#E9F0FA"/><text x="51" y="177" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#15215A">1 · COSTO</text><text x="51" y="218" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#4D5873">Actualiza producto y directos</text><rect x="28" y="273" width="504" height="125" rx="18" fill="#E6F5EF"/><text x="51" y="323" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#15215A">2 · IVA</text><text x="51" y="364" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#4D5873">Separa precio final de venta neta</text><rect x="28" y="419" width="504" height="125" rx="18" fill="#FCECF3"/><text x="51" y="469" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#15215A">3 · CANAL</text><text x="51" y="510" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#4D5873">Base de fees y logística</text><rect x="28" y="565" width="504" height="125" rx="18" fill="#FDF1D9"/><text x="51" y="615" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#15215A">4 · MARGEN</text><text x="51" y="656" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#4D5873">Comprueba objetivo y piso</text><rect x="28" y="711" width="504" height="125" rx="18" fill="#EEE8F9"/><text x="51" y="761" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#15215A">5 · MERCADO</text><text x="51" y="802" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#4D5873">