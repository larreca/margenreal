<svg xmlns="http://www.w3.org/2000/svg" width="560" height="904" viewBox="0 0 560 904" role="img"><rect x="0" y="0" width="560" height="904" rx="0" fill="#FFFFFF"/><text x="28" y="65" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#15215A">Precio, IVA y margen</text><text x="28" y="100" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#4D5873">Ejemplo simulado · Chile · CLP</text><rect x="28" y="130" width="504" height="118" rx="18" fill="#15215A"/><text x="51" y="173" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">PRECIO BRUTO</text><text x="51" y="224" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">$23.800</text><rect x="28" y="266" width="504" height="137" rx="18" fill="#E9F0FA"/><text x="51" y="307" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#15215A">VENTA NETA = bruto ÷ 1,19</text><text x="51" y="367" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#15215A">$20.000</text><rect x="28" y="421" width="504" height="137" rx="18" fill="#FCECF3"/><text x="51" y="462" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#15215A">IVA = bruto − neto</text><text x="51" y="523" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#D63F81">$3.800</text><rect x="28" y="576" width="504" height="206" rx="18" fill="#E6F5EF"/><text x="51" y="621" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#117A64">MARGEN BRUTO</text><text x="51" y="669" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#15215A">(20.000 − 12.000) ÷ 20.000</text><text x="51" y="745" font-family="Arial,sans-serif" font-size="54" font-weight="700" fill="#117A64">40%</text><text x="28" y="832" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#4D5873">Costo neto supuesto: $12.000.</text><text x="28" y="865" font-family="Arial,sans-serif" font-size="19" font-weight