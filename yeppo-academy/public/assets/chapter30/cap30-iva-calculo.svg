-family="Arial,sans-serif" font-size="41" font-weight="700" fill="#117A64">40%</text><text x="54" y="641" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#4D5873">Denominador: venta neta. IVA incluido no es ingreso propio del ejemplo.</text></svg>