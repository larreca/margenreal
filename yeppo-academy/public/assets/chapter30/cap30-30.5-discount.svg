<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="78" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Un descuento pequeño puede recortar mucho el beneficio</text><text x="70" y="118" font-family="Arial" font-size="18" fill="#686b80">Simulación: costo $10.000 · precio lista $20.000</text><g font-family="Arial"><rect x="90" y="200" width="240" height="400" rx="26" fill="#eef8f4"/><text x="125" y="250" font-size="21" font-weight="700" fill="#101858">SIN DESCUENTO</text><text x="125" y="315" font-size="38" font-weight="700" fill="#27a679">$20.000</text><text x="125" y="380" font-size="18" fill="#33364b">beneficio $10.000</text><text x="125" y="420" font-size="18" fill="#33364b">margen 50%</text><rect x="370" y="250" width="240" height="350" rx="26" fill="#fff7e9"/><text x="405" y="300" font-size="21" font-weight="700" fill="#101858">−10%</text><text x="405" y="365" font-size="38" font-weight="700" fill="#d99b2b">$18.000</text><text x="405" y="430" font-size="18" fill="#33364b">beneficio $8.000</text><text x="405" y="470" font-size="18" fill="#33364b">margen 44,4%</text><rect x="650" y="300" width="240" height="300" rx="26" fill="#fff1f7"/><text x="685" y="350" font-size="21" font-weight="700" fill="#101858">−20%</text><text x="685" y="415" font-size="38" font-weight="700" fill="#ed3489">$16.000</text><text x="685" y="480" font-size="18" fill="#33364b">beneficio $6.000</text><text x="685" y="520" font-size="18" fill="#33364b">margen 37,5%</text><rect x="930" y="350" width="180" height="250" rx="26" fill="#f3efff"/><text x="965" y="400" font-size="21" font-weight="700" fill="#101858">−30%</text><text x="965" y="465" font-size="32" font-weight="700" fill="#745fd8">$14.000</text><text x="965" y="520" font-size="17" fill="#33364b">beneficio $4.000</text><text x="90" y="690" font-size="19" font-weight="700" fill="#ed3489">Con −20% de precio, el beneficio bruto por unidad cae 40%: de $10.000 a $6.000.</text><text x="90" y="735" font-size="17" fill="#686b80">Antes de promocionar, calcula margen posterior a descuento y costos de canal.</text></g></svg>