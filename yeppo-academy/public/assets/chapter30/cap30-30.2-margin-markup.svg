<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="78" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Markup ≠ margen</text><text x="70" y="118" font-family="Arial" font-size="18" fill="#686b80">El mismo beneficio se divide por bases distintas</text><g font-family="Arial"><rect x="90" y="190" width="470" height="430" rx="28" fill="#eef0fb"/><text x="130" y="245" font-size="27" font-weight="700" fill="#101858">MARKUP</text><text x="130" y="300" font-size="19" fill="#33364b">(Precio − Costo) ÷ Costo</text><text x="130" y="360" font-size="18" fill="#686b80">Costo: $10.000</text><text x="130" y="400" font-size="18" fill="#686b80">Precio: $20.000</text><text x="130" y="475" font-size="52" font-weight="700" fill="#745fd8">100%</text><text x="130" y="540" font-size="17" fill="#33364b">Ganaste $10.000 sobre</text><text x="130" y="570" font-size="17" fill="#33364b">una base de costo $10.000.</text><rect x="640" y="190" width="470" height="430" rx="28" fill="#fff1f7"/><text x="680" y="245" font-size="27" font-weight="700" fill="#101858">MARGEN</text><text x="680" y="300" font-size="19" fill="#33364b">(Precio − Costo) ÷ Precio</text><text x="680" y="360" font-size="18" fill="#686b80">Costo: $10.000</text><text x="680" y="400" font-size="18" fill="#686b80">Precio: $20.000</text><text x="680" y="475" font-size="52" font-weight="700" fill="#ed3489">50%</text><text x="680" y="540" font-size="17" fill="#33364b">Ganaste $10.000 sobre</text><text x="680" y="570" font-size="17" fill="#33364b">una venta de $20.000.</text><text x="90" y="700" font-size="20" font-weight="700" fill="#101858">Para fijar precio desde margen objetivo:</text><text x="90" y="742" font-size="21" fill="#33364b">Precio = Costo ÷ (1 − Margen objetivo)</text></g></svg>