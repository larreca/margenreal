<svg xmlns="http://www.w3.org/2000/svg" width="560" height="980" viewBox="0 0 560 980" role="img"><rect x="0" y="0" width="560" height="980" rx="0" fill="#FFFFFF"/><text x="28" y="64" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#15215A">Comisión: ¿sobre qué base?</text><text x="28" y="100" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#4D5873">Ejemplo simulado · misma tasa 10%</text><rect x="28" y="124" width="504" height="125" rx="18" fill="#15215A"/><text x="50" y="168" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Venta neta $10.000</text><text x="50" y="209" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">Costo $6.000 · logística $500</text><rect x="28" y="270" width="504" height="273" rx="18" fill="#FCECF3"/><text x="50" y="313" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#15215A">SOBRE PRECIO BRUTO</text><text x="50" y="354" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#4D5873">10% × $11.900 = $1.190</text><text x="50" y="405" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#15215A">10.000 − 6.000 − 1.190 − 500</text><text x="50" y="476" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#15215A">Queda $2.310</text><text x="50" y="513" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#4D5873">23,1% del neto</text><rect x="28" y="566" width="504" height="273" rx="18" fill="#E6F5EF"/><text x="50" y="609" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#15215A">SOBRE VENTA NETA</text><text x="50" y="650" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#4D5873">10% × $10.000 = $1.000</text><text x="50" y="701" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#15215A">10.000 − 6.000 − 1.000 − 500</text><text x="50" y="772" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#15215A">Queda $2.500</text><text x="50" y="809" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#4D5873">25% del neto</text><text x="28" y="911" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#4D5873">Contrasta base y cargos con el contrato.</text><text x="28" y="945" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#4D5873">No son tarifas de un marketplace.</text></svg>