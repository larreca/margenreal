<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="830" viewBox="0 0 1280 830" role="img" aria-labelledby="t d"><title id="t">Embudo de medición para un Reel de producto, ejemplo simulado</title><desc id="d">Diez mil vistas, doscientos clics etiquetados, veinte carritos y ocho pedidos. Tasa clic sobre vistas dos por ciento, tasa pedido sobre clic cuatro por ciento y tasa pedido sobre carrito cuarenta por ciento; no equivale a ROAS o ganancia.</desc><rect width="1280" height="830" fill="#FAF9F6"/><g font-family="Arial,sans-serif"><text x="65" y="84" font-size="39" font-weight="700" fill="#1A2849">De vistas a pedidos: medir sin inventar ROAS</text><text x="65" y="129" font-size="21" fill="#526079">Ejercicio ficticio: las vistas no son personas únicas y no existe dato de gasto.</text><rect x="65" y="171" width="1145" height="116" rx="18" fill="#E6EDF9"/><rect x="65" y="308" width="986" height="116" rx="18" fill="#E4F1E8"/><rect x="65" y="445" width="835" height="116" rx="18" fill="#FFF0E2"/><rect x="65" y="582" width="684" height="116" rx="18" fill="#F4E7F1"/><g font-size="29" font-weight="700" fill="#192A49"><text x="97" y="225">10.000 vistas</text><text x="97" y="363">200 clics etiquetados</text><text x="97" y="501">20 carritos</text><text x="97" y="637">8 pedidos</text></g><g font-size="21" fill="#334A63"><text x="97" y="262">Métrica de exposición, no rentabilidad</text><text x="97" y="399">CTR simplificado: 2 % sobre vistas</text><text x="97" y="536">10 % de clics originaron carritos</text><text x="97" y="673">4 % de clics; 40 % de carritos</text></g><rect x="820" y="591" width="384" height="116" rx="18" fill="#253251"/><text x="847" y="637" font-size="23" font-weight="700" fill="#FFFFFF">Faltan gasto y costos</text><text x="847" y="675" font-size="20" fill="#FFFFFF">No inferir contribución.</text><text x="65" y="782" font-size="17" fill="#5C6472">Cohorte simulada, sin atribución de resultados a campañas reales de Yeppo.</text></g></svg>