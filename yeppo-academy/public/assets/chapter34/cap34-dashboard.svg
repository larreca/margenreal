<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Dashboard por objetivo</text><g font-family="Arial"><rect x="70" y="180" width="200" height="250" rx="24" fill="#eef0fb"/><text x="105" y="235" font-size="21" font-weight="700" fill="#101858">AWARENESS</text><text x="105" y="290" font-size="16" fill="#34364a">Reach / views</text><rect x="285" y="180" width="200" height="250" rx="24" fill="#eef8f4"/><text x="320" y="235" font-size="21" font-weight="700" fill="#101858">EDUCACIÓN</text><text x="320" y="290" font-size="16" fill="#34364a">Saves / finish</text><rect x="500" y="180" width="200" height="250" rx="24" fill="#fff8e9"/><text x="530" y="235" font-size="21" font-weight="700" fill="#101858">CONSIDERAR</text><text x="535" y="290" font-size="16" fill="#34364a">Clicks / PDP</text><rect x="715" y="180" width="200" height="250" rx="24" fill="#fff1f7"/><text x="750" y="235" font-size="21" font-weight="700" fill="#101858">CONVERTIR</text><text x="750" y="290" font-size="16" fill="#34364a">Revenue / CVR</text><rect x="930" y="180" width="200" height="250" rx="24" fill="#faf1ff"/><text x="970" y="235" font-size="21" font-weight="700" fill="#101858">RETENER</text><text x="970" y="290" font-size="16" fill="#34364a">Repeat / rebuy</text><text x="70" y="650" font-size="20" font-weight="700" fill="#ed3489">La métrica correcta depende del trabajo de la pieza.</text></g></svg>