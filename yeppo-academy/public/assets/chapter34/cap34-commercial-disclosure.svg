<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="830" viewBox="0 0 1280 830" role="img" aria-labelledby="t d"><title id="t">Distinguir orgánico de colaboración comercial en Instagram y TikTok</title><desc id="d">Árbol ilustrativo: identificar intercambio de valor, regalo o comisión; comunicar relación clara; aplicar etiqueta de colaboración pagada en Instagram o aviso de contenido comercial en TikTok y verificar permisos y claims antes de publicar.</desc><rect width="1280" height="830" fill="#FBFAF7"/><g font-family="Arial,sans-serif"><text x="63" y="84" font-size="40" font-weight="700" fill="#1D2845">¿Es contenido comercial? Comprueba la relación</text><text x="63" y="127" font-size="21" fill="#505D74">Un regalo, préstamo, remuneración o afiliación puede constituir intercambio de valor.</text><rect x="306" y="167" width="668" height="106" rx="21" fill="#1D2D50"/><text x="340" y="215" font-size="27" font-weight="700" fill="#FFFFFF">¿La marca aporta algo a cambio?</text><text x="340" y="251" font-size="19" fill="#FFFFFF">Pago · producto gratuito · comisión · incentivo</text><path d="M640 273 V307 M352 307 H928 M352 307 V343 M928 307 V343" fill="none" stroke="#9F7892" stroke-width="5"/><rect x="65" y="343" width="553" height="210" rx="23" fill="#F8E8EE"/><rect x="662" y="343" width="553" height="210" rx="23" fill="#E8F3ED"/><text x="91" y="392" font-size="27" font-weight="700" fill="#24364F">SÍ · vínculo comercial</text><text x="688" y="392" font-size="27" font-weight="700" fill="#24364F">NO · sin incentivo</text><g font-size="20" fill="#283B50"><text x="91" y="431">Declarar de forma clara y destacada.</text><text x="91" y="467">Usar herramientas de transparencia</text><text x="91" y="502">de la plataforma que corresponda.</text><text x="688" y="431">No inventar independencia.</text><text x="688" y="467">Verificar exactitud y respaldo</text><text x="688" y="502">de todas las afirmaciones.</text></g><rect x="65" y="599" width="553" height="132" rx="18" fill="#E4E9F7"/><rect x="662" y="599" width="553" height="132" rx="18" fill="#EAF1DF"/><text x="89" y="644" font-size="25" font-weight="700" fill="#243451">Instagram / Meta</text><text x="686" y="644" font-size="25" font-weight="700" fill="#243451">TikTok</text><text x="89" y="684" font-size="21" fill="#243451">Etiqueta «Colaboración pagada»</text><text x="686" y="684" font-size="20" fill="#243451">Aviso de contenido comercial</text><text x="63" y="785" font-size="17" fill="#5C6373">Fuentes: SERNAC, Meta y TikTok; políticas consultadas 26-10-2026. Verificar requisitos vigentes al publicar.</text></g></svg>