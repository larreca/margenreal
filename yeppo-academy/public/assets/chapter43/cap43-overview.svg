<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#fff"/><text x="70" y="78" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Capítulo 43 · Cómo construir el primer pedido</text><text x="70" y="120" font-family="Arial" font-size="18" fill="#686b80">Mapa visual Yeppo Academy · aprendizaje aplicado para clientes B2B</text><rect x="70" y="160" width="1060" height="54" rx="16" fill="#101858"/><text x="95" y="194" font-family="Arial" font-size="16" font-weight="700" fill="#fff">El primer pedido es una hipótesis diversificada que debe producir datos para el segundo.</text><rect x="75" y="250" width="240" height="260" rx="24" fill="#eef0fb"/><text x="103" y="302" font-family="Arial" font-size="18" font-weight="700" fill="#101858">43.1</text><text x="103" y="350" font-family="Arial" font-size="16" font-weight="700" fill="#33364b">Presupuesto como portafolio</text><text x="103" y="450" font-family="Arial" font-size="15" fill="#686b80">Concepto → aplicación</text><rect x="345" y="250" width="240" height="260" rx="24" fill="#fff1f7"/><text x="373" y="302" font-family="Arial" font-size="18" font-weight="700" fill="#101858">43.2</text><text x="373" y="350" font-family="Arial" font-size="16" font-weight="700" fill="#33364b">Surtido de entrada: 300–400 </text><text x="373" y="450" font-family="Arial" font-size="15" fill="#686b80">Concepto → aplicación</text><rect x="615" y="250" width="240" height="260" rx="24" fill="#eef8f4"/><text x="643" y="302" font-family="Arial" font-size="18" font-weight="700" fill="#101858">43.3</text><text x="643" y="350" font-family="Arial" font-size="16" font-weight="700" fill="#33364b">Surtido medio: 500–800 mil</text><text x="643" y="450" font-family="Arial" font-size="15" fill="#686b80">Concepto → aplicación</text><rect x="885" y="250" width="240" height="260" rx="24" fill="#fff7e9"/><text x="913" y="302" font-family="Arial" font-size="18" font-weight="700" fill="#101858">43.4</text><text x="913" y="350" font-family="Arial" font-size="16" font-weight="700" fill="#33364b">Surtido expandido: 1 millón+</text><text x="913" y="450" font-family="Arial" font-size="15" fill="#686b80">Concepto → aplicación</text><text x="75" y="585" font-family="Arial" font-size="20" font-weight="700" fill="#ed3489">Del conocimiento a la ejecución</text><text x="75" y="625" font-family="Arial" font-size="17" fill="#33364b">8 módulos · casos · decisiones · aplicación B2B · evaluación</text></svg>