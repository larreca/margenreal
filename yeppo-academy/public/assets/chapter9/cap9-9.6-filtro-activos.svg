<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#fff"/>
<text x="70" y="78" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Antes de recomendar un activo intenso</text>
<text x="70" y="118" font-family="Arial" font-size="18" fill="#686b80">Filtro práctico para retinoides, exfoliantes y rutinas avanzadas</text>
<g font-family="Arial">
<rect x="80" y="180" width="1040" height="85" rx="22" fill="#eef0fb"/><text x="115" y="218" font-size="21" font-weight="700" fill="#101858">1 · ¿EMBARAZO O LACTANCIA?</text><text x="115" y="247" font-size="18" fill="#33364b">retinol/retinoides requieren evitar o consultar según situación</text>
<rect x="80" y="285" width="1040" height="85" rx="22" fill="#fff1f7"/><text x="115" y="323" font-size="21" font-weight="700" fill="#101858">2 · ¿TRATAMIENTO DERMATOLÓGICO?</text><text x="115" y="352" font-size="18" fill="#33364b">isotretinoína y otras terapias pueden volver la piel mucho más reactiva</text>
<rect x="80" y="390" width="1040" height="85" rx="22" fill="#fff7e9"/><text x="115" y="428" font-size="21" font-weight="700" fill="#101858">3 · ¿YA USA OTROS ACTIVOS?</text><text x="115" y="457" font-size="18" fill="#33364b">retinol + AHA/BHA + exfoliación física = mayor carga irritante</text>
<rect x="80" y="495" width="1040" height="85" rx="22" fill="#eef8f4"/><text x="115" y="533" font-size="21" font-weight="700" fill="#101858">4 · ¿LA PIEL ESTÁ ESTABLE?</text><text x="115" y="562" font-size="18" fill="#33364b">si arde, descama o está inflamada, no sumar intensidad</text>
<rect x="80" y="600" width="1040" height="85" rx="22" fill="#f3efff"/><text x="115" y="638" font-size="21" font-weight="700" fill="#101858">5 · ¿ENTIENDE CÓMO USARLO?</text><text x="115" y="667" font-size="18" fill="#33364b">frecuencia gradual · cantidad · hidratación · fotoprotección · cuándo suspender</text>
<text x="80" y="750" font-size="18" font-weight="700" fill="#ed3489">Una venta avanzada requiere más contexto, no más presión comercial.</text>
</g></svg>
