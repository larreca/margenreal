<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#fff"/>
<text x="70" y="78" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Red flags: semáforo de decisión</text>
<text x="70" y="118" font-family="Arial" font-size="18" fill="#686b80">Yeppo Academy · decidir si orientar, simplificar o derivar</text>
<g font-family="Arial">
<circle cx="180" cy="260" r="85" fill="#7dd3a9"/><text x="140" y="270" font-size="30" font-weight="700" fill="#fff">VERDE</text>
<text x="310" y="225" font-size="24" font-weight="700" fill="#157b53">SE PUEDE ORIENTAR</text>
<text x="310" y="267" font-size="20" fill="#33364b">brillo · sequedad leve · textura · rutina · preferencia de textura</text>
<text x="310" y="300" font-size="18" fill="#686b80">→ recomendación cosmética simple + expectativas realistas</text>

<circle cx="180" cy="455" r="85" fill="#f3c96b"/><text x="124" y="465" font-size="30" font-weight="700" fill="#fff">AMARILLO</text>
<text x="310" y="420" font-size="24" font-weight="700" fill="#9b6b00">PAUSA Y PREGUNTA MÁS</text>
<text x="310" y="462" font-size="20" fill="#33364b">ardor leve · descamación · varios activos · tratamiento dermatológico</text>
<text x="310" y="495" font-size="18" fill="#686b80">→ reducir variables · revisar contexto · no escalar activos</text>

<circle cx="180" cy="650" r="85" fill="#ef7b83"/><text x="145" y="660" font-size="30" font-weight="700" fill="#fff">ROJO</text>
<text x="310" y="615" font-size="24" font-weight="700" fill="#b42318">DETENER Y DERIVAR</text>
<text x="310" y="657" font-size="20" fill="#33364b">dolor intenso · hinchazón · ampollas · sangrado · lesión cambiante</text>
<text x="310" y="690" font-size="18" fill="#686b80">→ no “probar algo” encima · recomendar atención profesional</text>
</g></svg>
