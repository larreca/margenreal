<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Compatibilidad = cuatro preguntas</text><g font-family="Arial"><rect x="80" y="180" width="500" height="180" rx="26" fill="#eef0fb"/><text x="115" y="230" font-size="24" font-weight="700" fill="#101858">1 · ESTABILIDAD</text><text x="115" y="275" font-size="18" fill="#34364a">¿La fórmula mantiene el activo estable?</text><rect x="620" y="180" width="500" height="180" rx="26" fill="#fff1f7"/><text x="655" y="230" font-size="24" font-weight="700" fill="#101858">2 · TOLERANCIA</text><text x="655" y="275" font-size="18" fill="#34364a">¿La piel soporta la carga conjunta?</text><rect x="80" y="410" width="500" height="180" rx="26" fill="#eef8f4"/><text x="115" y="460" font-size="24" font-weight="700" fill="#101858">3 · CONVENIENCIA</text><text x="115" y="505" font-size="18" fill="#34364a">¿Agregarlo resuelve una necesidad real?</text><rect x="620" y="410" width="500" height="180" rx="26" fill="#fff8e9"/><text x="655" y="460" font-size="24" font-weight="700" fill="#101858">4 · CONTEXTO</text><text x="655" y="505" font-size="18" fill="#34364a">¿Hay tratamiento médico o instrucción de marca?</text><text x="80" y="710" font-size="20" font-weight="700" fill="#ed3489">No respondas “sí/no” antes de saber qué tipo de compatibilidad te preguntan.</text></g></svg>