<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Introducir activos con trazabilidad</text><g font-family="Arial"><rect x="90" y="180" width="1020" height="105" rx="24" fill="#eef8f4"/><text x="130" y="245" font-size="23" font-weight="700" fill="#101858">1 · BASE ESTABLE</text><text x="430" y="245" font-size="18" fill="#34364a">limpieza + hidratación + SPF</text><rect x="150" y="325" width="900" height="105" rx="24" fill="#eef0fb"/><text x="190" y="390" font-size="23" font-weight="700" fill="#101858">2 · UN ACTIVO</text><text x="430" y="390" font-size="18" fill="#34364a">baja frecuencia · una variable nueva</text><rect x="210" y="470" width="780" height="105" rx="24" fill="#fff8e9"/><text x="250" y="535" font-size="23" font-weight="700" fill="#101858">3 · OBSERVAR</text><text x="500" y="535" font-size="18" fill="#34364a">resultado + tolerancia</text><rect x="270" y="615" width="660" height="105" rx="24" fill="#fff1f7"/><text x="310" y="680" font-size="23" font-weight="700" fill="#101858">4 · ESCALAR</text><text x="520" y="680" font-size="18" fill="#34364a">sólo si aporta valor</text></g></svg>