<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="76" font-family="Arial" font-size="32" font-weight="700" fill="#101858">Matriz de compatibilidad Yeppo</text><g font-family="Arial"><rect x="80" y="150" width="1040" height="82" rx="18" fill="#eef0fb"/><text x="110" y="201" font-size="18" font-weight="700" fill="#101858">RETINOIDE + AHA/BHA</text><text x="405" y="201" font-size="17" fill="#34364a">Posible · vigilar irritación · introducir gradual</text><rect x="80" y="250" width="1040" height="82" rx="18" fill="#eef8f4"/><text x="110" y="301" font-size="18" font-weight="700" fill="#101858">VIT C + NIACINAMIDA</text><text x="405" y="301" font-size="17" fill="#34364a">No prohibición universal · revisar fórmula</text><rect x="80" y="350" width="1040" height="82" rx="18" fill="#fff8e9"/><text x="110" y="401" font-size="18" font-weight="700" fill="#101858">COPPER PEPTIDE + ACTIVOS</text><text x="405" y="401" font-size="17" fill="#34364a">SKU-específico · seguir fabricante</text><rect x="80" y="450" width="1040" height="82" rx="18" fill="#fff1f7"/><text x="110" y="501" font-size="18" font-weight="700" fill="#101858">BPO + RETINOIDE</text><text x="405" y="501" font-size="17" fill="#34364a">Depende de molécula y formulación</text><rect x="80" y="550" width="1040" height="82" rx="18" fill="#faf1ff"/><text x="110" y="601" font-size="18" font-weight="700" fill="#101858">MUCHOS ACTIVOS</text><text x="405" y="601" font-size="17" fill="#34364a">Químicamente posible ≠ rutina sostenible</text><text x="80" y="730" font-size="19" font-weight="700" fill="#ed3489">Mejor pregunta: ¿qué problema real prevengo al separarlos?</text></g></svg>