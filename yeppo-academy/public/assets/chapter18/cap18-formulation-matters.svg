<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">La formulación puede cambiar la regla</text><g font-family="Arial"><rect x="80" y="190" width="310" height="360" rx="28" fill="#fff1f7"/><text x="115" y="240" font-size="23" font-weight="700" fill="#101858">TRETINOÍNA CLÁSICA</text><text x="115" y="295" font-size="18" fill="#34364a">BPO + luz</text><text x="115" y="340" font-size="17" fill="#34364a">&gt;50% degradación ~2 h</text><text x="115" y="390" font-size="16" fill="#686b80">Interacción histórica real.</text><rect x="445" y="190" width="310" height="360" rx="28" fill="#eef8f4"/><text x="480" y="240" font-size="23" font-weight="700" fill="#101858">ADAPALENO</text><text x="480" y="295" font-size="18" fill="#34364a">Mayor estabilidad</text><text x="480" y="340" font-size="17" fill="#34364a">frente a BPO</text><text x="480" y="390" font-size="16" fill="#686b80">No hereda la misma regla.</text><rect x="810" y="190" width="310" height="360" rx="28" fill="#eef0fb"/><text x="845" y="240" font-size="23" font-weight="700" fill="#101858">MICROENCAPSULADO</text><text x="845" y="295" font-size="18" fill="#34364a">BPO + tretinoína</text><text x="845" y="340" font-size="17" fill="#34364a">coformulados y estudiados</text><text x="845" y="390" font-size="16" fill="#686b80">Tecnología modifica estabilidad.</text><text x="80" y="700" font-size="20" font-weight="700" fill="#ed3489">Una regla correcta para una fórmula puede ser incorrecta para otra.</text></g></svg>