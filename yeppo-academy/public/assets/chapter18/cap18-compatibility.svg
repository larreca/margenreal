<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Compatibilidad: menos reglas virales, más contexto</text><text x="70" y="120" font-family="Arial" font-size="18" fill="#686b80">La pregunta no es solo “¿se mezclan?” sino “¿esta persona tolera la carga total?”</text><g font-family="Arial"><rect x="80" y="190" width="240" height="390" rx="28" fill="#eef0fb"/><text x="115" y="240" font-size="22" font-weight="700" fill="#101858">FÓRMULA</text><text x="115" y="300" font-size="18" fill="#33364b">pH · vehículo</text><text x="115" y="340" font-size="18" fill="#33364b">concentración</text><text x="115" y="380" font-size="18" fill="#33364b">estabilidad</text><rect x="350" y="190" width="240" height="390" rx="28" fill="#fff1f7"/><text x="385" y="240" font-size="22" font-weight="700" fill="#101858">RUTINA</text><text x="385" y="300" font-size="18" fill="#33364b">cantidad</text><text x="385" y="340" font-size="18" fill="#33364b">frecuencia</text><text x="385" y="380" font-size="18" fill="#33364b">orden</text><rect x="620" y="190" width="240" height="390" rx="28" fill="#eef8f4"/><text x="655" y="240" font-size="22" font-weight="700" fill="#101858">PIEL</text><text x="655" y="300" font-size="18" fill="#33364b">tipo / estado</text><text x="655" y="340" font-size="18" fill="#33364b">tolerancia</text><text x="655" y="380" font-size="18" fill="#33364b">historial</text><rect x="890" y="190" width="240" height="390" rx="28" fill="#fff7e9"/><text x="925" y="240" font-size="22" font-weight="700" fill="#101858">CONTEXTO</text><text x="925" y="300" font-size="18" fill="#33364b">clima</text><text x="925" y="340" font-size="18" fill="#33364b">medicación</text><text x="925" y="380" font-size="18" fill="#33364b">objetivo</text><text x="80" y="675" font-size="21" font-weight="700" fill="#101858">Separar activos por días puede ser una estrategia de tolerancia, no una “ley química”.</text><text x="80" y="725" font-size="18" fill="#686b80">Existen fórmulas comerciales que combinan ingredientes que internet dice que “nunca” deben coexistir.</text></g></svg>