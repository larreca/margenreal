<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Orden práctico de aplicación</text><g font-family="Arial"><rect x="90" y="210" width="220" height="150" rx="24" fill="#eef0fb"/><text x="130" y="265" font-size="22" font-weight="700" fill="#101858">1 · LIMPIAR</text><text x="130" y="310" font-size="17" fill="#34364a">suave y sin fricción</text><rect x="350" y="210" width="220" height="150" rx="24" fill="#fff1f7"/><text x="385" y="265" font-size="22" font-weight="700" fill="#101858">2 · TRATAR</text><text x="385" y="310" font-size="17" fill="#34364a">activo principal</text><rect x="610" y="210" width="220" height="150" rx="24" fill="#eef8f4"/><text x="642" y="265" font-size="22" font-weight="700" fill="#101858">3 · HIDRATAR</text><text x="642" y="310" font-size="17" fill="#34364a">según necesidad</text><rect x="870" y="210" width="220" height="150" rx="24" fill="#fff8e9"/><text x="915" y="265" font-size="22" font-weight="700" fill="#101858">4 · SPF</text><text x="915" y="310" font-size="17" fill="#34364a">último skincare AM</text><rect x="160" y="470" width="880" height="120" rx="26" fill="#faf9fd"/><text x="200" y="520" font-size="21" font-weight="700" fill="#101858">Pilling ≠ reacción química automática</text><text x="200" y="560" font-size="17" fill="#34364a">Reduce cantidad, capas y fricción antes de culpar a los ingredientes.</text></g></svg>