<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Retinoide + exfoliante: piensa en carga, no en prohibición</text><g font-family="Arial"><rect x="90" y="190" width="1020" height="110" rx="24" fill="#eef8f4"/><text x="130" y="255" font-size="22" font-weight="700" fill="#101858">BAJA CARGA</text><text x="360" y="255" font-size="18" fill="#34364a">un activo · baja frecuencia · piel estable</text><rect x="150" y="350" width="900" height="110" rx="24" fill="#fff8e9"/><text x="190" y="415" font-size="22" font-weight="700" fill="#101858">MEDIA</text><text x="360" y="415" font-size="18" fill="#34364a">alternancia · experiencia previa · hidratación</text><rect x="210" y="510" width="780" height="110" rx="24" fill="#fff1f7"/><text x="250" y="575" font-size="22" font-weight="700" fill="#101858">ALTA CARGA</text><text x="450" y="575" font-size="18" fill="#34364a">varios irritantes + ardor/descamación</text><text x="90" y="720" font-size="20" font-weight="700" fill="#ed3489">Si la tolerancia cae, reducir es más inteligente que “hacer funcionar” la combinación.</text></g></svg>