<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#fff"/>
<text x="70" y="78" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Cuando la piel “pide menos”, no más</text>
<text x="70" y="118" font-family="Arial" font-size="18" fill="#686b80">Ruta cosmética conservadora ante reactividad o barrera alterada</text>
<g font-family="Arial">
<rect x="85" y="190" width="1030" height="78" rx="20" fill="#fff1f7"/><text x="115" y="225" font-size="20" font-weight="700" fill="#101858">1 · IDENTIFICA EL CAMBIO</text><text x="115" y="252" font-size="17" fill="#33364b">ardor · tirantez · descamación · rojez · nueva intolerancia</text>
<rect x="85" y="285" width="1030" height="78" rx="20" fill="#f3efff"/><text x="115" y="320" font-size="20" font-weight="700" fill="#101858">2 · REDUCE VARIABLES</text><text x="115" y="347" font-size="17" fill="#33364b">pausa novedades y evita acumular exfoliantes/activos irritantes</text>
<rect x="85" y="380" width="1030" height="78" rx="20" fill="#eef8f4"/><text x="115" y="415" font-size="20" font-weight="700" fill="#101858">3 · PRIORIZA SOPORTE</text><text x="115" y="442" font-size="17" fill="#33364b">limpieza suave · hidratación compatible · fotoprotección</text>
<rect x="85" y="475" width="1030" height="78" rx="20" fill="#eef8ff"/><text x="115" y="510" font-size="20" font-weight="700" fill="#101858">4 · OBSERVA</text><text x="115" y="537" font-size="17" fill="#33364b">¿disminuye la incomodidad? ¿qué producto coincidió con el cambio?</text>
<rect x="85" y="570" width="1030" height="78" rx="20" fill="#fff7e9"/><text x="115" y="605" font-size="20" font-weight="700" fill="#101858">5 · DERIVA SI HAY SEÑALES PREOCUPANTES</text><text x="115" y="632" font-size="17" fill="#33364b">dolor intenso · ampollas · hinchazón · lesión persistente · empeoramiento</text>
<text x="85" y="720" font-size="18" font-weight="700" fill="#ed3489">No existe un plazo universal de “reparación de barrera”: la recuperación depende del daño, exposición y persona.</text>
</g></svg>