<text x="0" y="0" font-family="Arial" font-size="24" font-weight="700" fill="#101858">DOS MEDIDAS DISTINTAS</text>
<text x="0" y="70" font-family="Arial" font-size="21" font-weight="700" fill="#745fd8">Hidratación SC</text><text x="0" y="105" font-family="Arial" font-size="18" fill="#33364b">Contenido de agua superficial;</text><text x="0" y="135" font-family="Arial" font-size="18" fill="#33364b">puede medirse con corneometría.</text>
<text x="0" y="215" font-family="Arial" font-size="21" font-weight="700" fill="#ed3489">TEWL</text><text x="0" y="250" font-family="Arial" font-size="18" fill="#33364b">Flujo de agua que atraviesa</text><text x="0" y="280" font-family="Arial" font-size="18" fill="#33364b">la piel hacia el ambiente.</text>
<text x="0" y="370" font-family="Arial" font-size="17" fill="#686b80">No son la misma variable y</text><text x="0" y="400" font-family="Arial" font-size="17" fill="#686b80">pueden cambiar por zona y clima.</text>
</g>
<text x="90" y="740" font-family="Arial" font-size="18" font-weight="700" fill="#101858">Una piel con sebo visible también puede presentar baja hidratación superficial.</text>
