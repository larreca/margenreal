<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="heading desc">
<title id="heading">Capítulo 12: criterio para recomendar ingredientes calmantes</title>
<desc id="desc">Diagrama de cuatro decisiones: escuchar síntomas y detectar señales de alerta; comprobar INCI y evidencia de la fórmula; elegir una rutina sencilla y tolerable; evaluar la respuesta y derivar cuando corresponda. La historia de un ingrediente no garantiza eficacia del producto final.</desc>
<rect width="1200" height="760" fill="#fcfaf8"/>
<text x="68" y="84" fill="#171b39" font-family="Arial,sans-serif" font-size="37" font-weight="700">Ingredientes calmantes: decidir con criterio</text>
<text x="68" y="128" fill="#4c5368" font-family="Arial,sans-serif" font-size="20">Capítulo 12 · De la consulta de la clienta a una recomendación responsable</text>
<rect x="68" y="162" width="1064" height="70" rx="16" fill="#171b39"/>
<text x="95" y="194" fill="white" font-family="Arial,sans-serif" font-size="20" font-weight="700">PRINCIPIO CLAVE</text>
<text x="95" y="220" fill="white" font-family="Arial,sans-serif" font-size="18">Uso tradicional, evidencia del ingrediente y eficacia de una fórmula no son equivalentes.</text>
<g font-family="Arial,sans-serif">
<rect x="68" y="270" width="508" height="171" rx="18" fill="#edeafa" stroke="#ccc4ea" stroke-width="2"/>
<rect x="624" y="270" width="508" height="171" rx="18" fill="#e9f4f0" stroke="#c2ded4" stroke-width="2"/>
<rect x="68" y="464" width="508" height="171" rx="18" fill="#fff1e5" stroke="#f1d8c2" stroke-width="2"/>
<rect x="624" y="464" width="508" height="171" rx="18" fill="#fbeaf1" stroke="#eed0df" stroke-width="2"/>
<g fill="#171b39" font-size="27" font-weight="700">
<text x="97" y="325">01 · Escuchar</text><text x="653" y="325">02 · Verificar</text>
<text x="97" y="519">03 · Elegir</text><text x="653" y="519">04 · Reevaluar</text>
</g>
<g fill="#31364b" font-size="20">
<text x="97" y="363">¿Qué siente, desde cuándo y qué cambió?</text>
<text x="97" y="397">Dolor, hinchazón o reacción intensa:</text>
<text x="97" y="421" font-weight="700">detener venta y derivar.</text>
<text x="653" y="363">Leer INCI, fórmula completa y etiqueta.</text>
<text x="653" y="397">Contrastar fuente y producto estudiado.</text>
<text x="653" y="421" font-weight="700">No prometer curación.</text>
<text x="97" y="557">Comparar textura, función y tolerancia.</text>
<text x="97" y="591">Menos pasos y cambios simultáneos</text>
<text x="97" y="615">cuando la piel está incómoda.</text>
<text x="653" y="557">Observar comodidad y reacción.</text>
<text x="653" y="591">Si persiste o empeora el malestar,</text>
<text x="653" y="615" font-weight="700">orientar consulta profesional.</text>
</g>
<text x="68" y="702" font-size="17" fill="#555d6e">Aplicación: 12.1 seguridad · 12.2–12.6 ingredientes · 12.7 decisión en tienda · 12.8 evaluación</text>
<text x="68" y="728" font-size="15" fill="#667088">Esquema pedagógico Yeppo Academy · No representa un diagnóstico ni resultados clínicos.</text>
</g>
</svg>