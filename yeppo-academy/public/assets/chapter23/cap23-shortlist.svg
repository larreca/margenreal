<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Shortlist consultivo</text><g font-family="Arial"><rect x="90" y="180" width="300" height="360" rx="28" fill="#eef8f4"/><text x="130" y="240" font-size="25" font-weight="700" fill="#101858">A · PRINCIPAL</text><text x="130" y="300" font-size="18" fill="#34364a">Mejor encaje</text><text x="130" y="340" font-size="18" fill="#34364a">Objetivo + rutina</text><text x="130" y="380" font-size="18" fill="#34364a">+ preferencia</text><rect x="450" y="180" width="300" height="360" rx="28" fill="#eef0fb"/><text x="490" y="240" font-size="25" font-weight="700" fill="#101858">B · ALTERNATIVA</text><text x="490" y="300" font-size="18" fill="#34364a">Otro precio</text><text x="490" y="340" font-size="18" fill="#34364a">Textura o formato</text><text x="490" y="380" font-size="18" fill="#34364a">Trade-off real</text><rect x="810" y="180" width="300" height="360" rx="28" fill="#fff1f7"/><text x="850" y="240" font-size="25" font-weight="700" fill="#101858">C · DESCARTE</text><text x="850" y="300" font-size="18" fill="#34364a">Duplicación</text><text x="850" y="340" font-size="18" fill="#34364a">Carga o precio</text><text x="850" y="380" font-size="18" fill="#34364a">Explicar por qué no</text><text x="90" y="665" font-size="20" font-weight="700" fill="#ed3489">Pocas opciones con diferencias reales generan más claridad que diez enlaces.</text></g></svg>