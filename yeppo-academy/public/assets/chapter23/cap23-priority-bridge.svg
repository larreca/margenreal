<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">De entrevista a propuesta</text><g font-family="Arial"><rect x="90" y="180" width="260" height="320" rx="28" fill="#eef0fb"/><text x="130" y="240" font-size="23" font-weight="700" fill="#101858">DATOS</text><text x="130" y="300" font-size="17" fill="#34364a">Prioridad</text><text x="130" y="340" font-size="17" fill="#34364a">Rutina</text><text x="130" y="380" font-size="17" fill="#34364a">Preferencia</text><text x="130" y="420" font-size="17" fill="#34364a">Presupuesto</text><rect x="470" y="230" width="260" height="220" rx="28" fill="#fff8e9"/><text x="510" y="290" font-size="23" font-weight="700" fill="#101858">PRIORIZAR</text><text x="510" y="345" font-size="17" fill="#34364a">¿Qué importa primero?</text><rect x="850" y="180" width="260" height="320" rx="28" fill="#eef8f4"/><text x="890" y="240" font-size="23" font-weight="700" fill="#101858">PROPUESTA</text><text x="890" y="300" font-size="17" fill="#34364a">1 opción principal</text><text x="890" y="340" font-size="17" fill="#34364a">1 alternativa</text><text x="890" y="380" font-size="17" fill="#34364a">Trade-off claro</text><text x="90" y="650" font-size="20" font-weight="700" fill="#ed3489">La propuesta debe sonar como consecuencia de la entrevista.</text></g></svg>