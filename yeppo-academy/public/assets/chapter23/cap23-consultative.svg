<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Venta consultiva: del problema al cierre</text><text x="70" y="120" font-family="Arial" font-size="18" fill="#686b80">El vendedor aporta criterio, no presión</text><g font-family="Arial"><circle cx="170" cy="360" r="85" fill="#eef0fb"/><text x="120" y="350" font-size="20" font-weight="700" fill="#101858">ESCUCHA</text><text x="118" y="385" font-size="16" fill="#33364b">qué necesita</text><path d="M265 360 H355" stroke="#745fd8" stroke-width="7"/><circle cx="455" cy="360" r="85" fill="#fff1f7"/><text x="395" y="350" font-size="20" font-weight="700" fill="#101858">PRIORIZA</text><text x="390" y="385" font-size="16" fill="#33364b">qué va primero</text><path d="M550 360 H640" stroke="#ed3489" stroke-width="7"/><circle cx="740" cy="360" r="85" fill="#eef8f4"/><text x="675" y="350" font-size="20" font-weight="700" fill="#101858">RECOMIENDA</text><text x="680" y="385" font-size="16" fill="#33364b">por qué encaja</text><path d="M835 360 H925" stroke="#27a679" stroke-width="7"/><circle cx="1020" cy="360" r="85" fill="#fff7e9"/><text x="975" y="350" font-size="20" font-weight="700" fill="#101858">CIERRA</text><text x="965" y="385" font-size="16" fill="#33364b">sin forzar</text><rect x="245" y="540" width="710" height="110" rx="24" fill="#101858"/><text x="290" y="585" font-size="21" font-weight="700" fill="#fff">SEGUIMIENTO</text><text x="290" y="625" font-size="17" fill="#fff">uso · tolerancia · recompra · siguiente objetivo</text></g></svg>