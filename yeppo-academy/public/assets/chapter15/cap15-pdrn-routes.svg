<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#fff"/>
<text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">PDRN / PN: la vía de uso cambia la evidencia</text>
<text x="70" y="120" font-family="Arial" font-size="18" fill="#686b80">No heredes resultados de una intervención a otra</text>
<g font-family="Arial">
<rect x="80" y="205" width="300" height="300" rx="28" fill="#f3efff"/><text x="115" y="255" font-size="23" font-weight="700" fill="#101858">INYECCIÓN / PROCEDIMIENTO</text><text x="115" y="305" font-size="18" fill="#34364a">• mayor parte de la literatura</text><text x="115" y="342" font-size="18" fill="#34364a">• exposición distinta</text><text x="115" y="379" font-size="18" fill="#34364a">• entorno clínico</text><text x="115" y="430" font-size="17" fill="#686b80">No sirve como prueba automática</text><text x="115" y="460" font-size="17" fill="#686b80">para un sérum.</text>
<rect x="450" y="205" width="300" height="300" rx="28" fill="#fff1f7"/><text x="485" y="255" font-size="23" font-weight="700" fill="#101858">TÓPICO ESTUDIADO</text><text x="485" y="305" font-size="18" fill="#34364a">• evidencia emergente 2026</text><text x="485" y="342" font-size="18" fill="#34364a">• preparación específica</text><text x="485" y="379" font-size="18" fill="#34364a">• ensayo corto / formulación concreta</text><text x="485" y="430" font-size="17" fill="#686b80">Dato útil, pero todavía</text><text x="485" y="460" font-size="17" fill="#686b80">no generalizable a toda la categoría.</text>
<rect x="820" y="205" width="300" height="300" rx="28" fill="#eef8f4"/><text x="855" y="255" font-size="23" font-weight="700" fill="#101858">PRODUCTO COMERCIAL</text><text x="855" y="305" font-size="18" fill="#34364a">• revisar INCI</text><text x="855" y="342" font-size="18" fill="#34364a">• revisar concentración si existe</text><text x="855" y="379" font-size="18" fill="#34364a">• revisar datos del producto</text><text x="855" y="430" font-size="17" fill="#686b80">“Contiene PDRN” no significa</text><text x="855" y="460" font-size="17" fill="#686b80">“reproduce un procedimiento”.</text>
<line x1="380" y1="355" x2="450" y2="355" stroke="#9d8fd5" stroke-width="6"/><line x1="750" y1="355" x2="820" y2="355" stroke="#9d8fd5" stroke-width="6"/>
<rect x="140" y="585" width="920" height="100" rx="24" fill="#eef0fb"/><text x="180" y="630" font-size="22" font-weight="700" fill="#101858">Regla Yeppo: molécula + formulación + vía + estudio específico</text><text x="180" y="665" font-size="17" fill="#34364a">Si cambia uno de esos cuatro elementos, baja la certeza de extrapolación.</text>
<text x="70" y="760" font-size="16" fill="#686b80">Yeppo Academy · Capítulo 15 · Actualizado 2026</text>
</g></svg>