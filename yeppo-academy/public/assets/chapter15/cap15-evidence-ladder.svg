<rect x="110" y="600" width="980" height="92" rx="20" fill="#eef0fb"/><text x="150" y="655" font-size="21" font-weight="700" fill="#101858">BASE CONSOLIDADA: fotoprotección + hidratación</text>
<rect x="175" y="485" width="850" height="92" rx="20" fill="#f3efff"/><text x="215" y="540" font-size="21" font-weight="700" fill="#101858">RESPALDO MUY SÓLIDO: tretinoína para fotoenvejecimiento*</text>
