<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Anti-aging: una escalera de evidencia</text><text x="70" y="120" font-family="Arial" font-size="18" fill="#686b80">No todos los ingredientes tienen el mismo nivel de respaldo clínico</text><g font-family="Arial"><rect x="110" y="580" width="980" height="100" rx="20" fill="#eef0fb"/><text x="150" y="640" font-size="22" font-weight="700" fill="#101858">BASE: fotoprotección + hidratación</text><rect x="190" y="455" width="820" height="100" rx="20" fill="#f3efff"/><text x="230" y="515" font-size="22" font-weight="700" fill="#101858">EVIDENCIA FUERTE: retinoides / tretinoína</text><rect x="270" y="330" width="660" height="100" rx="20" fill="#fff1f7"/><text x="310" y="390" font-size="22" font-weight="700" fill="#101858">EVIDENCIA MODERADA: vitamina C / péptidos</text><rect x="350" y="205" width="500" height="100" rx="20" fill="#eef8f4"/><text x="390" y="265" font-size="22" font-weight="700" fill="#101858">PROMETEDOR: adenosina / ginseng / PDRN*</text><text x="110" y="740" font-size="17" fill="#686b80">*PDRN/PN: la evidencia estética actual se concentra sobre todo en procedimientos/inyecciones; no debe extrapolarse automáticamente a cualquier cosmético tópico.</text></g></svg>