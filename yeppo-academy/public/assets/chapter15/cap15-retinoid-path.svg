<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#fff"/>
<text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Familia de retinoides: no son equivalentes</text>
<text x="70" y="120" font-family="Arial" font-size="18" fill="#686b80">Ruta simplificada de conversión hacia ácido retinoico</text>
<g font-family="Arial">
<rect x="70" y="220" width="230" height="180" rx="24" fill="#eef0fb"/><text x="100" y="268" font-size="22" font-weight="700" fill="#101858">RETINYL ESTERS</text><text x="100" y="310" font-size="17" fill="#34364a">Cosmético</text><text x="100" y="345" font-size="17" fill="#34364a">Más conversiones</text>
<text x="320" y="315" font-size="42" fill="#9d8fd5">→</text>
<rect x="370" y="220" width="210" height="180" rx="24" fill="#f3efff"/><text x="420" y="268" font-size="24" font-weight="700" fill="#101858">RETINOL</text><text x="405" y="310" font-size="17" fill="#34364a">Cosmético</text><text x="405" y="345" font-size="17" fill="#34364a">Evidencia variable</text>
<text x="600" y="315" font-size="42" fill="#9d8fd5">→</text>
<rect x="650" y="220" width="210" height="180" rx="24" fill="#fff1f7"/><text x="698" y="268" font-size="24" font-weight="700" fill="#101858">RETINAL</text><text x="685" y="310" font-size="17" fill="#34364a">Cosmético</text><text x="685" y="345" font-size="17" fill="#34364a">Una conversión</text>
<text x="880" y="315" font-size="42" fill="#9d8fd5">→</text>
<rect x="930" y="220" width="200" height="180" rx="24" fill="#eef8f4"/><text x="956" y="263" font-size="21" font-weight="700" fill="#101858">ÁCIDO RETINOICO</text><text x="970" y="303" font-size="17" fill="#34364a">Tretinoína</text><text x="970" y="338" font-size="17" fill="#34364a">Medicamento</text><text x="970" y="373" font-size="17" fill="#34364a">Mayor respaldo clínico</text>
<rect x="95" y="495" width="1010" height="150" rx="25" fill="#fff8e9"/><text x="130" y="545" font-size="22" font-weight="700" fill="#101858">NO conviertas esta ruta en una escala universal de “potencia”</text>
<text x="130" y="590" font-size="18" fill="#34364a">Concentración, vehículo, estabilidad y tolerancia cambian el resultado real.</text>
<text x="130" y="625" font-size="18" fill="#34364a">Irritación no es sinónimo de eficacia. Embarazo: evitar retinoides.</text>
<text x="70" y="755" font-size="16" fill="#686b80">Yeppo Academy · Fuente base: revisión sistemática 2024 + AAD</text>
