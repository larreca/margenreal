<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Cómo busca un cliente</text><g font-family="Arial"><rect x="70" y="180" width="160" height="290" rx="24" fill="#eef0fb"/><text x="105" y="235" font-size="21" font-weight="700" fill="#101858">EXACTA</text><text x="100" y="290" font-size="15" fill="#34364a">“345 Relief”</text><rect x="250" y="180" width="160" height="290" rx="24" fill="#eef8f4"/><text x="280" y="235" font-size="21" font-weight="700" fill="#101858">CATEGORÍA</text><text x="275" y="290" font-size="15" fill="#34364a">“protector”</text><rect x="430" y="180" width="160" height="290" rx="24" fill="#fff8e9"/><text x="465" y="235" font-size="21" font-weight="700" fill="#101858">ATRIBUTO</text><text x="465" y="290" font-size="15" fill="#34364a">“SPF50”</text><rect x="610" y="180" width="160" height="290" rx="24" fill="#fff1f7"/><text x="635" y="235" font-size="21" font-weight="700" fill="#101858">PROBLEMA</text><text x="650" y="290" font-size="15" fill="#34364a">“rojeces”</text><rect x="790" y="180" width="160" height="290" rx="24" fill="#faf1ff"/><text x="830" y="235" font-size="21" font-weight="700" fill="#101858">MARCA</text><text x="830" y="290" font-size="15" fill="#34364a">“SKIN1004”</text><rect x="970" y="180" width="160" height="290" rx="24" fill="#eef0fb"/><text x="1000" y="235" font-size="21" font-weight="700" fill="#101858">CONTENIDO</text><text x="1005" y="290" font-size="15" fill="#34364a">“envíos”</text><text x="70" y="650" font-size="20" font-weight="700" fill="#ed3489">El buscador debe seguir la intención, no sólo el título exacto.</text></g></svg>