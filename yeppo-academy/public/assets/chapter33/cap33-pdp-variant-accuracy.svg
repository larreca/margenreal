<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc"><title id="title">Ficha ecommerce confiable con variante consistente</title><desc id="desc">Esquema comparativo de PDP: imagen correspondiente a presentación de 100 ml, título y variante de 100 ml, precio total asociado, disponibilidad y acción clara, con alerta de no mezclar fotografías 50 ml y SKU 100 ml.</desc><rect width="1280" height="820" fill="#FBF9F6"/><g font-family="Arial,sans-serif"><text x="60" y="80" font-size="42" font-weight="700" fill="#182541">Cada variante necesita una ficha coherente</text><text x="60" y="126" font-size="21" fill="#57627A">Ejemplo ficticio: hidratante de 100 ml. No reproduce fotografías de marcas.</text><rect x="60" y="169" width="743" height="549" fill="#FFFFFF" rx="24" stroke="#D4CBD6" stroke-width="3"/><rect x="92" y="206" width="320" height="347" fill="#E5EDF7" rx="17"/><rect x="166" y="260" width="171" height="221" fill="#FFFFFF" stroke="#536987" stroke-width="4" rx="17"/><rect x="166" y="254" width="171" height="33" fill="#D5CBE2" rx="10"/><text x="185" y="351" fill="#192744" font-size="21" font-weight="700">HIDRATANTE</text><text x="212" y="386" fill="#192744" font-size="27" font-weight="700">100 ml</text><text x="461" y="244" fill="#182541" font-size="25" font-weight="700">Hidratante • 100 ml</text><text x="461" y="291" fill="#37526F" font-size="20">Variante seleccionada</text><rect x="456" y="311" width="134" height="55" rx="10" fill="#D9E8ED" stroke="#6C8799"/><text x="471" y="348" fill="#192744" font-size="19" font-weight="700">100 ml ✓</text><text x="461" y="415" fill="#182541" font-size="25" font-weight="700">Precio total visible</text><text x="461" y="463" fill="#38536B" font-size="20">Disponibilidad verificable</text><rect x="455" y="511" width="300" height="72" rx="15" fill="#25375E"/><text x="512" y="555" fill="#FFFFFF" font-size="24" font-weight="700">Añadir al carrito</text><text x="93" y="606" fill="#365674" font-size="19">Imágenes: envase, escala, textura,</text><text x="93" y="635" fill="#365674" font-size="19">etiqueta y aplicación documentada.</text><rect x="841" y="169" width="374" height="392" rx="24" fill="#FCE9E9"/><text x="866" y="224" fill="#812C43" font-size="27" font-weight="700">ERROR A EVITAR</text><text x="866" y="274" fill="#4C3E48" font-size="21">Cliente elige 100 ml,</text><text x="866" y="308" fill="#4C3E48" font-size="21">pero ve foto de 50 ml.</text><text x="866" y="364" fill="#4C3E48" font-size="21">Puede comprar con una</text><text x="866" y="396" fill="#4C3E48" font-size="21">expectativa incorrecta.</text><text x="866" y="472" fill="#812C43" font-size="20" font-weight="700">Verificar por SKU/variante.</text><text x="60" y="769" fill="#596478" font-size="18">Esquema educativo sin precios, stock ni fotografías reales de Yeppo.</text><text x="60" y="799" fill="#596478" font-size="17">Marco UX: Baymard Product Page UX, consulta 26-10-2026.</text></g></svg>