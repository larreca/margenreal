<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="835" viewBox="0 0 1280 835" role="img" aria-labelledby="title desc"><title id="title">Embudo de descubrimiento y compra en ecommerce</title><desc id="desc">Diagrama de etapas: búsqueda y filtros, tarjeta PLP, ficha PDP, selección de variante y carrito, checkout. Cada etapa asocia una falla habitual y una métrica para auditar, con advertencia de comparar cohortes.</desc><rect width="1280" height="835" fill="#FAF9F5"/><g font-family="Arial,sans-serif"><text x="57" y="80" font-size="41" font-weight="700" fill="#172844">Del buscador al pedido: detectar la fricción</text><text x="57" y="122" font-size="21" fill="#536077">Mide cada etapa antes de decidir qué corregir.</text><g font-size="25" fill="#1A2A49" font-weight="700"><rect x="61" y="167" width="1156" height="101" rx="19" fill="#E5EDF9"/><text x="89" y="208">1. Búsqueda y filtros</text><text x="89" y="244" font-size="19" font-weight="400">Consultas sin resultados · filtros inconsistentes</text><rect x="61" y="283" width="1083" height="101" rx="19" fill="#E7F3E8"/><text x="89" y="324">2. Listado PLP</text><text x="89" y="360" font-size="19" font-weight="400">Card sin volumen ni precio · aperturas útiles</text><rect x="61" y="399" width="1010" height="101" rx="19" fill="#FAEBD9"/><text x="89" y="440">3. Ficha PDP</text><text x="89" y="476" font-size="19" font-weight="400">Imágenes, uso, variantes y disponibilidad</text><rect x="61" y="515" width="937" height="101" rx="19" fill="#F4E6F0"/><text x="89" y="556">4. Carrito</text><text x="89" y="592" font-size="19" font-weight="400">Costo del pedido y coherencia de SKU</text><rect x="61" y="631" width="864" height="101" rx="19" fill="#D9E5E6"/><text x="89" y="672">5. Checkout</text><text x="89" y="708" font-size="19" font-weight="400">Costos transparentes · pago y entrega</text></g><text x="57" y="780" fill="#536077" font-size="20" font-weight="700">Cada tasa usa su propio denominador y período.</text><text x="57" y="813" fill="#536077" font-size="16">Este embudo esquematiza el proceso, no datos de conversión ni resultados reales de Yeppo.</text></g></svg>