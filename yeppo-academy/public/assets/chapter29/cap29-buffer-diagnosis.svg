<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc"><title id="title">Qué causó el quiebre</title><desc id="desc">Promoción conocida omitida: corregir pronóstico. Atraso recurrente del proveedor: medir lead time. Variación residual: evaluar seguridad por SKU y nivel de servicio.</desc><rect width="1280" height="780" fill="#faf8f7"/><text x="55" y="69" fill="#17234b" font-size="40" font-family="Arial,Helvetica,sans-serif" font-weight="700">¿Qué causó el quiebre?</text><text x="55" y="111" fill="#46536d" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="400">No aumentes todo el stock de seguridad antes de separar causas</text><rect x="404" y="148" width="470" height="91" rx="22" fill="#202d54"/><text x="441" y="204" fill="#fff" font-size="30" font-family="Arial,Helvetica,sans-serif" font-weight="700">QUIEBRE OBSERVADO</text><line x1="639" y1="239" x2="639" y2="282" stroke="#46536d" stroke-width="3"/><line x1="244" y1="282" x2="1035" y2="282" stroke="#46536d" stroke-width="3"/><line x1="244" y1="282" x2="244" y2="316" stroke="#46536d" stroke-width="3"/><line x1="639" y1="282" x2="639" y2="316" stroke="#46536d" stroke-width="3"/><line x1="1035" y1="282" x2="1035" y2="316" stroke="#46536d" stroke-width="3"/><rect x="55" y="316" width="378" height="287" rx="22" fill="#e7eef9"/><text x="78" y="370" fill="#17234b" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700">PROMOCIÓN OMITIDA</text><text x="78" y="434" fill="#17234b" font-size="27" font-family="Arial,Helvetica,sans-serif" font-weight="700">Ajustar pronóstico</text><text x="78" y="487" fill="#46536d" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="400">El evento era conocido</text><rect x="450" y="316" width="378" height="287" rx="22" fill="#fff0d1"/><text x="473" y="370" fill="#17234b" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700">ATRASO RECURRENTE</text><text x="473" y="434" fill="#17234b" font-size="27" font-family="Arial,Helvetica,sans-serif" font-weight="700">Medir lead time</text><text x="473" y="487" fill="#46536d" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="400">Corregir proveedor/plazo</text><rect x="845" y="316" width="378" height="287" rx="22" fill="#e5f4ee"/><text x="868" y="370" fill="#17234b" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700">VARIACIÓN RESIDUAL</text><text x="868" y="434" fill="#17234b" font-size="27" font-family="Arial,Helvetica,sans-serif" font-weight="700">Evaluar buffer</text><text x="868" y="487" fill="#46536d" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="400">Según servicio y caducidad</text><rect x="55" y="646" width="1168" height="86" rx="22" fill="#f5e4ed"/><text x="85" y="700" fill="#17234b" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="700">Duplicar todo el buffer puede convertir un error de forecast en merma.</text></svg>