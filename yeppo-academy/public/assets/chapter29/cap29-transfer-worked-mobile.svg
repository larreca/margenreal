<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1280" viewBox="0 0 640 1280" role="img" aria-labelledby="title desc"><title id="title">Transferencia de inventario en móvil</title><desc id="desc">Caso ficticio: A 5 y 1,7 días, B 60 y 120 días. Si 20 llegan a tiempo A 25 y 8,3 días, B 40 y 80 días. Tránsito no es disponible.</desc><rect width="640" height="1280" fill="#faf8f7"/><text x="28" y="58" fill="#17234b" font-size="38" font-family="Arial,Helvetica,sans-serif" font-weight="700">Transferir antes</text><text x="28" y="100" fill="#17234b" font-size="38" font-family="Arial,Helvetica,sans-serif" font-weight="700">de recomprar</text><text x="28" y="141" fill="#46536d" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="400">Ejemplo hipotético · unidades disponibles</text><rect x="28" y="185" width="584" height="233" rx="22" fill="#f5e4ed"/><text x="54" y="243" fill="#17234b" font-size="28" font-family="Arial,Helvetica,sans-serif" font-weight="700">A · NECESITA STOCK</text><text x="54" y="305" fill="#17234b" font-size="31" font-family="Arial,Helvetica,sans-serif" font-weight="400">5 ÷ 3/día</text><text x="54" y="367" fill="#af336c" font-size="39" font-family="Arial,Helvetica,sans-serif" font-weight="700">1,7 días</text><rect x="28" y="450" width="584" height="233" rx="22" fill="#e7eef9"/><text x="54" y="508" fill="#17234b" font-size="28" font-family="Arial,Helvetica,sans-serif" font-weight="700">B · TIENE MÁS STOCK</text><text x="54" y="570" fill="#17234b" font-size="31" font-family="Arial,Helvetica,sans-serif" font-weight="400">60 ÷ 0,5/día</text><text x="54" y="632" fill="#17234b" font-size="39" font-family="Arial,Helvetica,sans-serif" font-weight="700">120 días</text><rect x="83" y="715" width="474" height="87" rx="22" fill="#202d54"/><text x="110" y="769" fill="#fff" font-size="28" font-family="Arial,Helvetica,sans-serif" font-weight="700">20 en traslado → A</text><rect x="28" y="834" width="584" height="138" rx="22" fill="#e5f4ee"/><text x="54" y="890" fill="#17234b" font-size="28" font-family="Arial,Helvetica,sans-serif" font-weight="700">A: 25 ÷ 3 = 8,3 días</text><text x="54" y="930" fill="#46536d" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="400">Si llegan a tiempo</text><rect x="28" y="1000" width="584" height="138" rx="22" fill="#fff0d1"/><text x="54" y="1056" fill="#17234b" font-size="27" font-family="Arial,Helvetica,sans-serif" font-weight="700">B: 40 ÷ 0,5 = 80 días</text><text x="54" y="1096" fill="#46536d" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="400">Sin causar quiebre en B</text><text x="28" y="1190" fill="#af336c" font-size="27" font-family="Arial,Helvetica,sans-serif" font-weight="700">Tránsito ≠ disponible.</text><text x="28" y="1225" fill="#46536d" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="400">Verifica lote, costo y reservas.</text></svg>