<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img" aria-labelledby="title desc"><title id="title">Transferir antes de recomprar</title><desc id="desc">Caso ficticio: A empieza con 5 unidades a 3 por día, cobertura 1,7 días. B empieza con 60 a 0,5 por día, cobertura 120 días. Transferir 20 solo si llega a tiempo y cumple trazabilidad; A quedaría con 25, B con 40.</desc><rect width="1280" height="790" fill="#faf8f7"/><text x="55" y="67" fill="#17234b" font-size="38" font-family="Arial,Helvetica,sans-serif" font-weight="700">Misma red, cobertura muy distinta</text><text x="55" y="108" fill="#46536d" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="400">Ejemplo hipotético · transferir 20 solo si llega antes del quiebre</text><rect x="55" y="160" width="541" height="229" rx="22" fill="#f5e4ed"/><rect x="682" y="160" width="541" height="229" rx="22" fill="#e7eef9"/><text x="83" y="215" fill="#17234b" font-size="26" font-family="Arial,Helvetica,sans-serif" font-weight="700">TIENDA A · URGENTE</text><text x="83" y="278" fill="#17234b" font-size="30" font-family="Arial,Helvetica,sans-serif" font-weight="400">5 disponibles ÷ 3/día</text><text x="83" y="339" fill="#af336c" font-size="43" font-family="Arial,Helvetica,sans-serif" font-weight="700">1,7 días</text><text x="710" y="215" fill="#17234b" font-size="26" font-family="Arial,Helvetica,sans-serif" font-weight="700">TIENDA B · LENTA</text><text x="710" y="278" fill="#17234b" font-size="30" font-family="Arial,Helvetica,sans-serif" font-weight="400">60 disponibles ÷ 0,5/día</text><text x="710" y="339" fill="#17234b" font-size="43" font-family="Arial,Helvetica,sans-serif" font-weight="700">120 días</text><rect x="457" y="418" width="365" height="89" rx="22" fill="#202d54"/><text x="488" y="475" fill="#fff" font-size="29" font-family="Arial,Helvetica,sans-serif" font-weight="700">20 en traslado →</text><rect x="55" y="537" width="541" height="139" rx="22" fill="#e5f4ee"/><rect x="682" y="537" width="541" height="139" rx="22" fill="#fff0d1"/><text x="82" y="589" fill="#17234b" font-size="27" font-family="Arial,Helvetica,sans-serif" font-weight="700">A después: 25 ÷ 3/día</text><text x="82" y="635" fill="#17234b" font-size="27" font-family="Arial,Helvetica,sans-serif" font-weight="400">8,3 días de cobertura</text><text x="708" y="589" fill="#17234b" font-size="27" font-family="Arial,Helvetica,sans-serif" font-weight="700">B después: 40 ÷ 0,5/día</text><text x="708" y="635" fill="#17234b" font-size="27" font-family="Arial,Helvetica,sans-serif" font-weight="400">80 días de cobertura</text><text x="55" y="739" fill="#46536d" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="400">Tránsito no es disponibilidad: revisar lote, reservas, costo y tiempo real de llegada.</text></svg>