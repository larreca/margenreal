<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc"><title id="title">Cuatro métricas, cuatro bases</title><desc id="desc">Cohorte cerrada: 70 unidades vendidas de 100 recibidas da 70 por ciento; 30 restantes a 3 diarias dan 10 días. Rotación usa COGS e inventario promedio. Quiebre usa días sin stock.</desc><rect width="1280" height="820" fill="#faf8f7"/><text x="54" y="65" fill="#17234b" font-size="39" font-family="Arial,Helvetica,sans-serif" font-weight="700">Cuatro métricas · no mezclar denominadores</text><text x="54" y="108" fill="#46536d" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="400">Ejemplo ficticio: 100 recibidas, 70 vendidas, 30 restantes y 3 ventas al día</text><rect x="54" y="150" width="570" height="255" rx="22" fill="#e7eef9"/><text x="80" y="199" fill="#17234b" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="700">COHORTE</text><text x="80" y="259" fill="#17234b" font-size="35" font-family="Arial,Helvetica,sans-serif" font-weight="700">70 / 100 = 70 %</text><text x="80" y="311" fill="#46536d" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="400">Qué parte de esa compra salió</text><text x="80" y="358" fill="#af336c" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="400">No igualar a todo informe Shopify</text><rect x="657" y="150" width="570" height="255" rx="22" fill="#e5f4ee"/><text x="683" y="199" fill="#17234b" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="700">COBERTURA</text><text x="683" y="259" fill="#17234b" font-size="35" font-family="Arial,Helvetica,sans-serif" font-weight="700">30 / 3 = 10 días</text><text x="683" y="311" fill="#46536d" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="400">Cuánto dura al ritmo actual</text><text x="683" y="358" fill="#af336c" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="400">Depende de demanda futura</text><rect x="54" y="435" width="570" height="255" rx="22" fill="#fff0d1"/><text x="80" y="484" fill="#17234b" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="700">ROTACIÓN</text><text x="80" y="544" fill="#17234b" font-size="35" font-family="Arial,Helvetica,sans-serif" font-weight="700">COGS / inventario medio</text><text x="80" y="596" fill="#46536d" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="400">Veces que vuelve el capital</text><text x="80" y="643" fill="#af336c" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="400">Todo medido a costo</text><rect x="657" y="435" width="570" height="255" rx="22" fill="#f5e4ed"/><text x="683" y="484" fill="#17234b" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="700">QUIEBRE</text><text x="683" y="544" fill="#17234b" font-size="35" font-family="Arial,Helvetica,sans-serif" font-weight="700">días sin stock / días</text><text x="683" y="596" fill="#46536d" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="400">Fracción del período sin venta</text><text x="683" y="643" fill="#af336c" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="400">No es demanda perdida exacta</text><text x="54" y="776" fill="#17234b" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="700">Shopify Sell-through rate = vendidas / (vendidas + inventario final).</text></svg>