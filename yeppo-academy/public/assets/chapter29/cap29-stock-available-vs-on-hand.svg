<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img" aria-labelledby="t d"><title id="t">Existencias físicas frente a disponibilidad para vender</title><desc id="d">Ejemplo con 100 unidades on hand: 75 disponibles, 20 comprometidas y 5 no disponibles. Solo 75 unidades pueden ofrecerse para venta inmediata.</desc><rect width="1280" height="790" fill="#FCFAF7"/><g font-family="Arial,sans-serif"><text x="66" y="82" font-size="41" font-weight="700" fill="#182544">¿100 unidades significa que puedo vender 100?</text><text x="66" y="128" font-size="23" fill="#505C71">No. Existencia física y disponibilidad son estados diferentes.</text><rect x="66" y="176" width="1148" height="127" fill="#1D2D50" rx="18"/><text x="94" y="233" font-size="38" font-weight="700" fill="white">On hand: 100 unidades</text><text x="94" y="274" font-size="21" fill="#EEF0FA">Total físico en esta ubicación, incluidos estados no vendibles.</text><rect x="66" y="356" width="861" height="94" fill="#E7F4E9" rx="12"/><rect x="940" y="356" width="173" height="94" fill="#F3E2EB" rx="12"/><rect x="1126" y="356" width="88" height="94" fill="#FBE7DB" rx="12"/><g fill="#1B2C45" font-size="23" font-weight="700"><text x="87" y="399">75 disponibles</text><text x="957" y="399">20</text><text x="1137" y="399">5</text></g><g fill="#1B2C45" font-size="17"><text x="957" y="426">Comprom.</text><text x="1137" y="426">No disp.</text></g><path d="M70 483 H919" stroke="#31845C" stroke-width="5"/><text x="70" y="527" font-size="26" font-weight="700" fill="#275641">Promesa de venta inmediata: 75, no 100.</text><rect x="66" y="576" width="1148" height="121" fill="#EDF0F9" rx="19"/><text x="92" y="623" font-size="24" font-weight="700" fill="#1B294C">Control operativo</text><text x="92" y="664" font-size="21" fill="#1B294C">Verifica disponible por sucursal, reservas, lotes y recepción antes de reponer.</text><text x="66" y="754" font-size="17" fill="#5C6574">Datos simulados · Shopify Inventory Reports (consultado 26-10-2026).</text></g></svg>