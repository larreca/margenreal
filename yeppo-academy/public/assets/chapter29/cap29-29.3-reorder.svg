<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="78" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Punto de reposición: comprar antes del quiebre</text><text x="70" y="118" font-family="Arial" font-size="18" fill="#686b80">Modelo base: demanda durante lead time + stock de seguridad</text><g font-family="Arial"><line x1="110" y1="640" x2="1080" y2="640" stroke="#33364b" stroke-width="3"/><line x1="110" y1="190" x2="110" y2="640" stroke="#33364b" stroke-width="3"/><path d="M130 230 L720 560" stroke="#ed3489" stroke-width="7" fill="none"/><line x1="110" y1="470" x2="1020" y2="470" stroke="#745fd8" stroke-width="4" stroke-dasharray="14 10"/><text x="760" y="455" font-size="19" font-weight="700" fill="#745fd8">PUNTO DE REORDEN</text><line x1="110" y1="580" x2="1020" y2="580" stroke="#27a679" stroke-width="4" stroke-dasharray="10 9"/><text x="760" y="568" font-size="18" font-weight="700" fill="#27a679">STOCK DE SEGURIDAD</text><path d="M720 560 L720 230 L1040 410" stroke="#d99b2b" stroke-width="6" fill="none"/><text x="745" y="240" font-size="17" fill="#33364b">llega reposición</text><text x="150" y="705" font-size="22" font-weight="700" fill="#101858">ROP = demanda diaria × lead time + safety stock</text><text x="150" y="745" font-size="17" fill="#686b80">Si demanda o lead time son variables, el safety stock debe reflejar esa incertidumbre.</text></g></svg>