<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1450" viewBox="0 0 640 1450" role="img" aria-labelledby="title desc"><title id="title">Cuatro métricas de stock en móvil</title><desc id="desc">Fórmulas con denominador y límite, más la definición de Sell-through rate de Shopify.</desc><rect width="640" height="1450" fill="#faf8f7"/><text x="28" y="57" fill="#17234b" font-size="38" font-family="Arial,Helvetica,sans-serif" font-weight="700">Cuatro métricas</text><text x="28" y="101" fill="#17234b" font-size="38" font-family="Arial,Helvetica,sans-serif" font-weight="700">cuatro bases</text><text x="28" y="140" fill="#46536d" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="400">Caso: 100 recibidas, 70 vendidas</text><rect x="28" y="177" width="584" height="242" rx="22" fill="#e7eef9"/><text x="54" y="234" fill="#17234b" font-size="28" font-family="Arial,Helvetica,sans-serif" font-weight="700">COHORTE</text><text x="54" y="297" fill="#17234b" font-size="31" font-family="Arial,Helvetica,sans-serif" font-weight="700">70 / 100 = 70 %</text><text x="54" y="355" fill="#46536d" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="400">Parte de la compra que salió</text><rect x="28" y="443" width="584" height="242" rx="22" fill="#e5f4ee"/><text x="54" y="500" fill="#17234b" font-size="28" font-family="Arial,Helvetica,sans-serif" font-weight="700">COBERTURA</text><text x="54" y="563" fill="#17234b" font-size="31" font-family="Arial,Helvetica,sans-serif" font-weight="700">30 / 3 = 10 días</text><text x="54" y="621" fill="#46536d" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="400">Duración a demanda actual</text><rect x="28" y="709" width="584" height="242" rx="22" fill="#fff0d1"/><text x="54" y="766" fill="#17234b" font-size="28" font-family="Arial,Helvetica,sans-serif" font-weight="700">ROTACIÓN</text><text x="54" y="829" fill="#17234b" font-size="31" font-family="Arial,Helvetica,sans-serif" font-weight="700">COGS / inventario medio</text><text x="54" y="887" fill="#46536d" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="400">Ambos montos a costo</text><rect x="28" y="975" width="584" height="242" rx="22" fill="#f5e4ed"/><text x="54" y="1032" fill="#17234b" font-size="28" font-family="Arial,Helvetica,sans-serif" font-weight="700">QUIEBRE</text><text x="54" y="1095" fill="#17234b" font-size="31" font-family="Arial,Helvetica,sans-serif" font-weight="700">días sin stock / días</text><text x="54" y="1153" fill="#46536d" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="400">No es venta perdida exacta</text><rect x="28" y="1260" width="584" height="152" rx="22" fill="#202d54"/><text x="50" y="1314" fill="#fff" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="700">Shopify Sell-through rate:</text><text x="50" y="1361" fill="#fff" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="400">vendidas / (vendidas + final)</text></svg>