<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Cuatro métricas, cuatro preguntas</text><g font-family="Arial"><rect x="90" y="180" width="460" height="220" rx="28" fill="#eef0fb"/><text x="130" y="235" font-size="24" font-weight="700" fill="#101858">ROTACIÓN</text><text x="130" y="285" font-size="18" fill="#34364a">¿Qué tan rápido vuelve la caja?</text><rect x="650" y="180" width="460" height="220" rx="28" fill="#eef8f4"/><text x="690" y="235" font-size="24" font-weight="700" fill="#101858">COBERTURA</text><text x="690" y="285" font-size="18" fill="#34364a">¿Cuántos días dura el stock?</text><rect x="90" y="470" width="460" height="220" rx="28" fill="#fff8e9"/><text x="130" y="525" font-size="24" font-weight="700" fill="#101858">SELL-THROUGH</text><text x="130" y="575" font-size="18" fill="#34364a">¿Qué parte de lo recibido salió?</text><rect x="650" y="470" width="460" height="220" rx="28" fill="#fff1f7"/><text x="690" y="525" font-size="24" font-weight="700" fill="#101858">STOCKOUT</text><text x="690" y="575" font-size="18" fill="#34364a">¿Cuánto tiempo no estuvo disponible?</text></g></svg>