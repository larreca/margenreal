<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1280" viewBox="0 0 640 1280" role="img" aria-labelledby="title desc"><title id="title">Diagnóstico del stock de seguridad en móvil</title><desc id="desc">Tres causas del quiebre exigen acciones diferentes; solo variación residual puede justificar buffer.</desc><rect width="640" height="1280" fill="#faf8f7"/><text x="28" y="60" fill="#17234b" font-size="35" font-family="Arial,Helvetica,sans-serif" font-weight="700">¿Por qué hubo quiebre?</text><rect x="28" y="95" width="584" height="91" rx="22" fill="#202d54"/><text x="60" y="151" fill="#fff" font-size="27" font-family="Arial,Helvetica,sans-serif" font-weight="700">DIAGNOSTICAR ANTES</text><rect x="28" y="228" width="584" height="256" rx="22" fill="#e7eef9"/><text x="52" y="286" fill="#17234b" font-size="27" font-family="Arial,Helvetica,sans-serif" font-weight="700">1 · PROMOCIÓN OMITIDA</text><text x="52" y="353" fill="#17234b" font-size="30" font-family="Arial,Helvetica,sans-serif" font-weight="700">Ajusta el pronóstico</text><text x="52" y="414" fill="#46536d" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="400">Evento conocido, no azar</text><rect x="28" y="518" width="584" height="256" rx="22" fill="#fff0d1"/><text x="52" y="576" fill="#17234b" font-size="27" font-family="Arial,Helvetica,sans-serif" font-weight="700">2 · ATRASO REPETIDO</text><text x="52" y="643" fill="#17234b" font-size="30" font-family="Arial,Helvetica,sans-serif" font-weight="700">Mide lead time real</text><text x="52" y="704" fill="#46536d" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="400">Corrige plazo/proveedor</text><rect x="28" y="808" width="584" height="256" rx="22" fill="#e5f4ee"/><text x="52" y="866" fill="#17234b" font-size="27" font-family="Arial,Helvetica,sans-serif" font-weight="700">3 · VARIACIÓN RESIDUAL</text><text x="52" y="933" fill="#17234b" font-size="30" font-family="Arial,Helvetica,sans-serif" font-weight="700">Evalúa buffer por SKU</text><text x="52" y="994" fill="#46536d" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="400">Considera caducidad y costo</text><rect x="28" y="1125" width="584" height="116" rx="22" fill="#f5e4ed"/><text x="51" y="1173" fill="#17234b" font-size="27" font-family="Arial,Helvetica,sans-serif" font-weight="700">No dupliques todos</text><text x="51" y="1210" fill="#17234b" font-size="27" font-family="Arial,Helvetica,sans-serif" font-weight="700">los buffers por reflejo.</text></svg>