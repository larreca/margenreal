<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Antes del markdown</text><g font-family="Arial"><rect x="80" y="170" width="1040" height="82" rx="20" fill="#eef0fb"/><text x="120" y="222" font-size="21" font-weight="700" fill="#101858">1 · DIAGNOSTICAR</text><text x="420" y="222" font-size="17" fill="#34364a">Demanda · cobertura · vencimiento · margen</text><rect x="120" y="280" width="960" height="82" rx="20" fill="#eef8f4"/><text x="160" y="332" font-size="21" font-weight="700" fill="#101858">2 · REDISTRIBUIR</text><text x="450" y="332" font-size="17" fill="#34364a">Mover hacia donde existe demanda</text><rect x="160" y="390" width="880" height="82" rx="20" fill="#fff8e9"/><text x="200" y="442" font-size="21" font-weight="700" fill="#101858">3 · ACTIVAR</text><text x="410" y="442" font-size="17" fill="#34364a">Contenido · bundle · CRM · canal</text><rect x="200" y="500" width="800" height="82" rx="20" fill="#fff1f7"/><text x="240" y="552" font-size="21" font-weight="700" fill="#101858">4 · MARKDOWN</text><text x="475" y="552" font-size="17" fill="#34364a">Descuento calculado</text><rect x="240" y="610" width="720" height="82" rx="20" fill="#faf1ff"/><text x="280" y="662" font-size="21" font-weight="700" fill="#101858">5 · SALIR / NO RECOMPRAR</text></g></svg>