<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="78" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Inventario es dinero esperando convertirse en venta</text><text x="70" y="118" font-family="Arial" font-size="18" fill="#686b80">Comprar demasiado y comprar demasiado poco cuestan dinero de formas distintas</text><g font-family="Arial"><circle cx="180" cy="380" r="90" fill="#eef0fb"/><text x="125" y="372" font-size="21" font-weight="700" fill="#101858">COMPRA</text><text x="120" y="408" font-size="17" fill="#33364b">sale caja</text><path d="M285 380 H420" stroke="#745fd8" stroke-width="8"/><polygon points="430,380 400,362 400,398" fill="#745fd8"/><circle cx="535" cy="380" r="90" fill="#fff1f7"/><text x="480" y="372" font-size="21" font-weight="700" fill="#101858">STOCK</text><text x="465" y="408" font-size="17" fill="#33364b">capital inmóvil</text><path d="M640 380 H775" stroke="#ed3489" stroke-width="8"/><polygon points="785,380 755,362 755,398" fill="#ed3489"/><circle cx="890" cy="380" r="90" fill="#eef8f4"/><text x="835" y="372" font-size="21" font-weight="700" fill="#101858">VENTA</text><text x="830" y="408" font-size="17" fill="#33364b">vuelve caja</text><path d="M890 485 C890 650 180 650 180 485" fill="none" stroke="#27a679" stroke-width="6"/><text x="445" y="625" font-size="18" font-weight="700" fill="#27a679">REPOSICIÓN</text><text x="70" y="720" font-size="19" fill="#33364b">Sobrestock = caja atrapada + vencimiento + markdown. Quiebre = venta perdida + cliente frustrado + posible pérdida de recompra.</text></g></svg>