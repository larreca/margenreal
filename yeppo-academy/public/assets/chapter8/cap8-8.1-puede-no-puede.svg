<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#fff"/>
<text x="70" y="78" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Qué puede y qué no puede identificar un vendedor</text>
<text x="70" y="118" font-family="Arial" font-size="18" fill="#686b80">Infografía Yeppo Academy · alcance de una conversación cosmética responsable</text>
<rect x="70" y="175" width="500" height="500" rx="28" fill="#eef8f4"/>
<text x="110" y="225" font-family="Arial" font-size="27" font-weight="700" fill="#157b53">SÍ PUEDE</text>
<text x="110" y="280" font-family="Arial" font-size="20" fill="#33364b">• preguntar tipo y estado percibido</text>
<text x="110" y="325" font-family="Arial" font-size="20" fill="#33364b">• identificar preocupación cosmética</text>
<text x="110" y="370" font-family="Arial" font-size="20" fill="#33364b">• revisar rutina y tolerancia</text>
<text x="110" y="415" font-family="Arial" font-size="20" fill="#33364b">• observar brillo, sequedad y textura</text>
<text x="110" y="460" font-family="Arial" font-size="20" fill="#33364b">• explicar función cosmética</text>
<text x="110" y="505" font-family="Arial" font-size="20" fill="#33364b">• sugerir rutina simple</text>
<text x="110" y="550" font-family="Arial" font-size="20" fill="#33364b">• reconocer una señal de derivación</text>
<rect x="630" y="175" width="500" height="500" rx="28" fill="#fff0f1"/>
<text x="670" y="225" font-family="Arial" font-size="27" font-weight="700" fill="#b42318">NO PUEDE</text>
<text x="670" y="280" font-family="Arial" font-size="20" fill="#33364b">• diagnosticar acné, rosácea o dermatitis</text>
<text x="670" y="325" font-family="Arial" font-size="20" fill="#33364b">• confirmar alergia o infección</text>
<text x="670" y="370" font-family="Arial" font-size="20" fill="#33364b">• interpretar lunares o lesiones</text>
<text x="670" y="415" font-family="Arial" font-size="20" fill="#33364b">• atribuir causas hormonales</text>
<text x="670" y="460" font-family="Arial" font-size="20" fill="#33364b">• prometer curar una enfermedad</text>
<text x="670" y="505" font-family="Arial" font-size="20" fill="#33364b">• sustituir una indicación médica</text>
<text x="670" y="550" font-family="Arial" font-size="20" fill="#33364b">• minimizar dolor o reacción intensa</text>
<text x="70" y="745" font-family="Arial" font-size="19" font-weight="700" fill="#101858">Observar ≠ diagnosticar. Derivar a tiempo también es parte de una buena venta.</text>
</svg>
