<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Cómo explicar un producto en 45 segundos</text><text x="70" y="120" font-family="Arial" font-size="18" fill="#686b80">Del dato técnico a una decisión comprensible</text><g font-family="Arial"><rect x="80" y="180" width="1040" height="70" rx="18" fill="#eef0fb"/><text x="115" y="224" font-size="19" font-weight="700" fill="#101858">1 · PROBLEMA: “para qué situación lo miraría”</text><rect x="115" y="270" width="970" height="70" rx="18" fill="#fff1f7"/><text x="150" y="314" font-size="19" font-weight="700" fill="#101858">2 · BENEFICIO: “qué apariencia o sensación busca mejorar”</text><rect x="150" y="360" width="900" height="70" rx="18" fill="#eef8f4"/><text x="185" y="404" font-size="19" font-weight="700" fill="#101858">3 · SOPORTE: ingrediente/fórmula que explica la propuesta</text><rect x="185" y="450" width="830" height="70" rx="18" fill="#fff7e9"/><text x="220" y="494" font-size="19" font-weight="700" fill="#101858">4 · EXPERIENCIA: textura, acabado, cantidad, frecuencia</text><rect x="220" y="540" width="760" height="70" rx="18" fill="#f3efff"/><text x="255" y="584" font-size="19" font-weight="700" fill="#101858">5 · EXPECTATIVA: qué sí y qué no prometemos</text><rect x="255" y="630" width="690" height="70" rx="18" fill="#101858"/><text x="290" y="674" font-size="19" font-weight="700" fill="#fff">6 · COMPLEMENTO: solo si realmente falta un paso</text><text x="80" y="760" font-size="18" font-weight="700" fill="#ed3489">Una buena explicación traduce; no recita el INCI ni inventa resultados.</text></g></svg>