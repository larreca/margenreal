<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Fuerza del claim = fuerza de evidencia</text><g font-family="Arial"><rect x="100" y="540" width="230" height="120" rx="24" fill="#eef8f4"/><text x="135" y="595" font-size="22" font-weight="700" fill="#101858">DESCRIPTIVO</text><text x="135" y="630" font-size="16" fill="#34364a">“Textura ligera”</text><rect x="360" y="420" width="230" height="240" rx="24" fill="#eef0fb"/><text x="400" y="475" font-size="22" font-weight="700" fill="#101858">COSMÉTICO</text><text x="400" y="515" font-size="16" fill="#34364a">“Ayuda a mejorar”</text><rect x="620" y="300" width="230" height="360" rx="24" fill="#fff8e9"/><text x="650" y="355" font-size="22" font-weight="700" fill="#101858">CUANTIFICADO</text><text x="650" y="395" font-size="16" fill="#34364a">“X% en 4 semanas”</text><rect x="880" y="180" width="230" height="480" rx="24" fill="#fff1f7"/><text x="915" y="235" font-size="22" font-weight="700" fill="#101858">MÉDICO / ABSOLUTO</text><text x="915" y="275" font-size="16" fill="#34364a">“Cura” · “100% seguro”</text><text x="100" y="725" font-size="19" font-weight="700" fill="#ed3489">No subas de escalón sin evidencia y contexto suficientes.</text></g></svg>