<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="78" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Pitch de producto · 7 preguntas</text><g font-family="Arial"><rect x="70" y="155" width="1060" height="68" rx="18" fill="#eef0fb"/><text x="105" y="198" font-size="20" font-weight="700" fill="#101858">1 · PROBLEMA</text><text x="360" y="198" font-size="17" fill="#34364a">¿Qué necesidad concreta resuelve?</text><rect x="105" y="242" width="990" height="68" rx="18" fill="#eef8f4"/><text x="140" y="285" font-size="20" font-weight="700" fill="#101858">2 · BENEFICIO</text><text x="390" y="285" font-size="17" fill="#34364a">¿Qué cambio cosmético es razonable?</text><rect x="140" y="329" width="920" height="68" rx="18" fill="#fff8e9"/><text x="175" y="372" font-size="20" font-weight="700" fill="#101858">3 · EVIDENCIA</text><text x="430" y="372" font-size="17" fill="#34364a">¿Qué dato respalda la función?</text><rect x="175" y="416" width="850" height="68" rx="18" fill="#fff1f7"/><text x="210" y="459" font-size="20" font-weight="700" fill="#101858">4 · SENSORIAL</text><text x="455" y="459" font-size="17" fill="#34364a">¿Cómo se siente y presenta?</text><rect x="210" y="503" width="780" height="68" rx="18" fill="#faf1ff"/><text x="245" y="546" font-size="20" font-weight="700" fill="#101858">5 · USO</text><text x="420" y="546" font-size="17" fill="#34364a">¿Dónde, cuánto y con qué frecuencia?</text><rect x="245" y="590" width="710" height="68" rx="18" fill="#eef0fb"/><text x="280" y="633" font-size="20" font-weight="700" fill="#101858">6 · EXPECTATIVA</text><text x="505" y="633" font-size="17" fill="#34364a">¿Qué NO promete?</text><rect x="280" y="677" width="640" height="68" rx="18" fill="#eef8f4"/><text x="315" y="720" font-size="20" font-weight="700" fill="#101858">7 · COMPLEMENTO</text></g></svg>