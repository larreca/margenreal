<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Mismo framework · distinto pitch</text><g font-family="Arial"><rect x="80" y="175" width="320" height="410" rx="28" fill="#eef0fb"/><text x="120" y="235" font-size="23" font-weight="700" fill="#101858">AMPOULE</text><text x="120" y="295" font-size="17" fill="#34364a">Prioridad: tono</text><text x="120" y="335" font-size="17" fill="#34364a">Soporte: activos clave</text><text x="120" y="375" font-size="17" fill="#34364a">Uso: capa tratamiento</text><text x="120" y="415" font-size="17" fill="#34364a">Límite: gradual</text><rect x="440" y="175" width="320" height="410" rx="28" fill="#fff1f7"/><text x="480" y="235" font-size="23" font-weight="700" fill="#101858">RETINOL</text><text x="480" y="295" font-size="17" fill="#34364a">Prioridad: textura/líneas</text><text x="480" y="335" font-size="17" fill="#34364a">Uso: PM progresivo</text><text x="480" y="375" font-size="17" fill="#34364a">Tolerancia importa</text><text x="480" y="415" font-size="17" fill="#34364a">Límite: no inmediato</text><rect x="800" y="175" width="320" height="410" rx="28" fill="#eef8f4"/><text x="840" y="235" font-size="23" font-weight="700" fill="#101858">CLEANSER</text><text x="840" y="295" font-size="17" fill="#34364a">Prioridad: limpiar</text><text x="840" y="335" font-size="17" fill="#34364a">Sensorial: espuma</text><text x="840" y="375" font-size="17" fill="#34364a">Uso: masajear/enjuagar</text><text x="840" y="415" font-size="17" fill="#34364a">Límite: no tratamiento</text><text x="80" y="690" font-size="20" font-weight="700" fill="#ed3489">La complejidad del pitch debe corresponder al riesgo y a la categoría.</text></g></svg>