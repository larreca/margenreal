<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img" aria-labelledby="title desc"><title id="title">Autorización sanitaria ISP</title><desc id="desc">Autorización sanitaria ISP. VERIFICAR. Registro o notificación aplicable. Producto, titular y variante. Etiqueta y antecedentes. Factura y fotografía NO sustituyen autorización. Consultar bases oficiales del ISP.</desc><rect width="1280" height="790" fill="#FBF9F6"/><g font-family="Arial,Helvetica,sans-serif"><text x="58" y="77" fill="#192B47" font-size="42" font-weight="700">Autorización sanitaria ISP</text><text x="58" y="120" fill="#536679" font-size="22">YEPPO Academy · Caso didáctico 45.2 · No representa datos en vivo</text><rect x="53" y="160" width="1174" height="225" rx="29" fill="#223754"/><rect x="78" y="185" width="180" height="8" rx="4" fill="#8DBFCA"/><text x="87" y="285" font-size="70" font-weight="800" fill="#FFFFFF">VERIFICAR</text><text x="88" y="333" font-size="23" fill="#DDE9F2">Antes de vender cosméticos en Chile</text><rect x="54" y="431" width="366" height="139" rx="21" fill="#E4EDF8"/><circle cx="89" cy="468" r="17" fill="#243957"/><text x="89" y="476" font-size="21" text-anchor="middle" fill="#FFFFFF" font-weight="700">1</text><text x="116" y="470" font-size="21" font-weight="600" fill="#20344C">Registro o notificación</text><text x="116" y="498" font-size="21" font-weight="600" fill="#20344C">aplicable</text><rect x="459" y="431" width="366" height="139" rx="21" fill="#E1F0E8"/><circle cx="494" cy="468" r="17" fill="#243957"/><text x="494" y="476" font-size="21" text-anchor="middle" fill="#FFFFFF" font-weight="700">2</text><text x="521" y="470" font-size="21" font-weight="600" fill="#20344C">Producto, titular y</text><text x="521" y="498" font-size="21" font-weight="600" fill="#20344C">variante</text><rect x="864" y="431" width="366" height="139" rx="21" fill="#F7E9E4"/><circle cx="899" cy="468" r="17" fill="#243957"/><text x="899" y="476" font-size="21" text-anchor="middle" fill="#FFFFFF" font-weight="700">3</text><text x="926" y="470" font-size="21" font-weight="600" fill="#20344C">Etiqueta y antecedentes</text><rect x="54" y="596" width="1174" height="123" rx="21" fill="#E8EDF3"/><text x="87" y="644" font-size="21" fill="#243855">Factura y fotografía NO sustituyen autorización. Consultar bases oficiales del ISP.</text><text x="56" y="759" font-size="17" fill="#5B6B79">Fuente conceptual: documentación ISP / Shopify cuando corresponde. Supuestos explícitos del ejercicio.</text></g></svg>