<rect x="70" y="395" width="1060" height="180" rx="28" fill="#2f2548"/><text x="105" y="445" font-family="Arial" font-size="22" font-weight="700" fill="#fff">Cómo leer estos datos</text><text x="105" y="483" font-family="Arial" font-size="18" fill="#ece7f2">1. Exportaciones ≠ ventas retail.  2. Un caso chileno ≠ mercado total.  3. La tendencia sirve para detectar oportunidad,</text><text x="105" y="515" font-family="Arial" font-size="18" fill="#ece7f2">pero la decisión de compra se valida con tus propios datos de margen, rotación, cobertura y recompra.</text><text x="70" y="635" font-family="Arial" font-size="14" fill="#6b6471">Fuentes: MFDS (02-10-2026), NIQ (15-07-2026), La Tercera (23-03-2026). *Crecimiento reportado por Kosmeticos, no estimación del mercado chileno total.</text>
