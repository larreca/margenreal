<g font-family="Arial"><rect x="70" y="125" width="330" height="220" rx="30" fill="#f2edf8"/><text x="105" y="175" font-size="18" font-weight="700" fill="#5d4778">EXPORTACIONES DE COREA</text><text x="105" y="245" font-size="58" font-weight="800" fill="#2c2344">US$11,1B</text><text x="105" y="285" font-size="19">acumulado a Q3 2026</text><text x="105" y="318" font-size="15" fill="#6a6470">Récord histórico para 9 meses · MFDS</text>
<rect x="435" y="125" width="330" height="220" rx="30" fill="#fae8f0"/><text x="470" y="175" font-size="18" font-weight="700" fill="#7d4662">VENTAS K-BEAUTY</text><text x="470" y="245" font-size="58" font-weight="800" fill="#3d2634">+53%</text><text x="470" y="285" font-size="19">valor, interanual</text><text x="470" y="318" font-size="15" fill="#6a6470">+131% en dos años · NIQ 2026</text>
