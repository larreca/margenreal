<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" rx="34" fill="#fbf9fd"/><text x="60" y="70" font-family="Arial" font-size="24" font-weight="700" fill="#70509a">RUTINA: FUNCIÓN ANTES QUE CANTIDAD DE PASOS</text>
<g font-family="Arial" text-anchor="middle"><g transform="translate(80 155)"><rect width="240" height="260" rx="30" fill="#e8eef7"/><text x="120" y="60" font-size="24" font-weight="700">1 · LIMPIAR</text><text x="120" y="110" font-size="17">retirar suciedad</text><text x="120" y="140" font-size="17">sin sobrelimpiar</text><text x="120" y="200" font-size="16" fill="#526174">¿hace falta AM/PM?</text></g>
<g transform="translate(345 155)"><rect width="240" height="260" rx="30" fill="#e8f1ed"/><text x="120" y="60" font-size="24" font-weight="700">2 · HIDRATAR</text><text x="120" y="110" font-size="17">agua + confort</text><text x="120" y="140" font-size="17">+ barrera</text><text x="120" y="200" font-size="16" fill="#526174">textura tolerable</text></g>
<g transform="translate(610 155)"><rect width="240" height="260" rx="30" fill="#f7e6ef"/><text x="120" y="60" font-size="24" font-weight="700">3 · TRATAR</text><text x="120" y="110" font-size="17">una prioridad</text><text x="120" y="140" font-size="17">a la vez</text><text x="120" y="200" font-size="16" fill="#6f5261">sólo si aporta</text></g>
<g transform="translate(875 155)"><rect width="240" height="260" rx="30" fill="#f6eadb"/><text x="120" y="60" font-size="24" font-weight="700">4 · PROTEGER</text><text x="120" y="110" font-size="17">fotoprotección</text><text x="120" y="140" font-size="17">y hábitos</text><text x="120" y="200" font-size="16" fill="#6c5b48">AM como base</text></g></g>
<rect x="150" y="470" width="900" height="90" rx="25" fill="#302648"/><text x="600" y="510" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="white">Una buena rutina es la mínima estructura que la persona puede sostener.</text><text x="600" y="542" text-anchor="middle" font-family="Arial" font-size="17" fill="#e8e1f2">Los pasos extra deben justificar su función, tolerancia, tiempo y presupuesto.</text>
</svg>