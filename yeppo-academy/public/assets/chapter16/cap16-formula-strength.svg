<text x="175" y="480" font-size="23" font-weight="700" fill="#101858">+ TIEMPO DE CONTACTO + SUPERFICIE + OTROS ACTIVOS + TOLERANCIA</text>
<text x="175" y="530" font-size="18" fill="#34364a">Leave-on ≠ rinse-off. Pad = química + posible fricción.</text>
<text x="175" y="570" font-size="18" fill="#34364a">La misma etiqueta de “5%” puede producir experiencias muy diferentes.</text>
<text x="70" y="735" font-size="20" font-weight="700" fill="#ed3489">Regla Yeppo: compara la fórmula y la rutina, no sólo el número frontal.</text>
<text x="70" y="775" font-size="16" fill="#686b80">Yeppo Academy · Capítulo 16</text>
