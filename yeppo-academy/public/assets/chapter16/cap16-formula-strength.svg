<text x="330" y="275" font-size="36" fill="#9d8fd5">×</text>
<rect x="380" y="190" width="190" height="150" rx="24" fill="#f3efff"/><text x="430" y="235" font-size="22" font-weight="700" fill="#101858">pH</text><text x="415" y="278" font-size="17" fill="#34364a">Cambia disponibilidad</text><text x="415" y="310" font-size="16" fill="#686b80">del ácido</text>
<text x="590" y="275" font-size="36" fill="#9d8fd5">×</text>
<rect x="640" y="190" width="210" height="150" rx="24" fill="#eef8f4"/><text x="690" y="235" font-size="22" font-weight="700" fill="#101858">VEHÍCULO</text><text x="675" y="278" font-size="17" fill="#34364a">Gel, toner, crema</text><text x="675" y="310" font-size="16" fill="#686b80">Entrega y contacto</text>
