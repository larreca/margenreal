<text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">La intensidad real no es un porcentaje</text>
<text x="70" y="120" font-family="Arial" font-size="18" fill="#686b80">Un exfoliante se interpreta como una ecuación de exposición</text>
