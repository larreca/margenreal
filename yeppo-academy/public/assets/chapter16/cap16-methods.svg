<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#fff"/>
<text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Tres rutas de exfoliación</text>
<text x="70" y="120" font-family="Arial" font-size="18" fill="#686b80">Mecanismo distinto ≠ intensidad automáticamente comparable</text>
<g font-family="Arial">
<rect x="70" y="185" width="325" height="400" rx="28" fill="#fff1f7"/><text x="105" y="235" font-size="24" font-weight="700" fill="#101858">QUÍMICA</text><text x="105" y="285" font-size="18" fill="#34364a">AHA · BHA · PHA · LHA</text><text x="105" y="340" font-size="17" fill="#34364a">Modifica cohesión/descamación</text><text x="105" y="380" font-size="17" fill="#34364a">según ácido y formulación.</text><text x="105" y="455" font-size="16" fill="#686b80">Clave: concentración + pH</text><text x="105" y="488" font-size="16" fill="#686b80">+ vehículo + frecuencia.</text>
<rect x="438" y="185" width="325" height="400" rx="28" fill="#eef8f4"/><text x="473" y="235" font-size="24" font-weight="700" fill="#101858">ENZIMÁTICA</text><text x="473" y="285" font-size="18" fill="#34364a">Papaina · bromelaina</text><text x="473" y="340" font-size="17" fill="#34364a">Proteólisis superficial.</text><text x="473" y="380" font-size="17" fill="#34364a">Evidencia clínica más limitada.</text><text x="473" y="455" font-size="16" fill="#686b80">Clave: estabilidad, pH,</text><text x="473" y="488" font-size="16" fill="#686b80">temperatura y alergia.</text>
<rect x="806" y="185" width="325" height="400" rx="28" fill="#eef0fb"/><text x="841" y="235" font-size="24" font-weight="700" fill="#101858">MECÁNICA</text><text x="841" y="285" font-size="18" fill="#34364a">Scrub · paño · cepillo · pad</text><text x="841" y="340" font-size="17" fill="#34364a">La fricción remueve material</text><text x="841" y="380" font-size="17" fill="#34364a">superficial.</text><text x="841" y="455" font-size="16" fill="#686b80">Clave: presión + tiempo +</text><text x="841" y="488" font-size="16" fill="#686b80">frecuencia.</text>
<rect x="140" y="650" width="920" height="80" rx="22" fill="#fff8e9"/><text x="180" y="698" font-size="20" font-weight="700" fill="#101858">Ardor, fricción intensa o “bolitas” visibles no son pruebas de eficacia.</text>
</g></svg>