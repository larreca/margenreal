<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Mapa de exfoliación: intensidad no es eficacia</text><text x="70" y="120" font-family="Arial" font-size="18" fill="#686b80">Tipo de ácido, concentración, pH, vehículo y frecuencia cambian la experiencia</text><g font-family="Arial"><rect x="80" y="190" width="310" height="410" rx="28" fill="#fff1f7"/><text x="115" y="245" font-size="26" font-weight="700" fill="#101858">AHA</text><text x="115" y="290" font-size="18" fill="#33364b">Glicólico · láctico</text><text x="115" y="350" font-size="18" fill="#33364b">Superficie / textura</text><text x="115" y="390" font-size="18" fill="#33364b">Pigmentación superficial</text><text x="115" y="470" font-size="16" fill="#686b80">Más pequeño ≠ siempre mejor.</text><rect x="445" y="190" width="310" height="410" rx="28" fill="#eef0fb"/><text x="480" y="245" font-size="26" font-weight="700" fill="#101858">BHA</text><text x="480" y="290" font-size="18" fill="#33364b">Salicílico</text><text x="480" y="350" font-size="18" fill="#33364b">Afinidad por lípidos</text><text x="480" y="390" font-size="18" fill="#33364b">Poros / comedones</text><text x="480" y="470" font-size="16" fill="#686b80">Puede irritar si se acumula.</text><rect x="810" y="190" width="310" height="410" rx="28" fill="#eef8f4"/><text x="845" y="245" font-size="26" font-weight="700" fill="#101858">PHA</text><text x="845" y="290" font-size="18" fill="#33364b">Gluconolactona</text><text x="845" y="350" font-size="18" fill="#33364b">Moléculas mayores</text><text x="845" y="390" font-size="18" fill="#33364b">Buena tolerancia relativa</text><text x="845" y="470" font-size="16" fill="#686b80">No significa “cero irritación”.</text><text x="80" y="700" font-size="20" font-weight="700" fill="#ed3489">Frecuencia correcta = la mínima que logra el objetivo sin deteriorar tolerancia.</text></g></svg>