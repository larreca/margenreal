<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#fff"/>
<text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Dosis exfoliante: empieza abajo y escala sólo si hace falta</text>
<g font-family="Arial">
<rect x="90" y="180" width="1020" height="120" rx="24" fill="#eef8f4"/><text x="130" y="228" font-size="24" font-weight="700" fill="#101858">1 · INICIO</text><text x="320" y="228" font-size="19" fill="#34364a">Una exposición espaciada → observa 48–72 h</text><text x="320" y="265" font-size="16" fill="#686b80">Objetivo: saber cómo responde esa piel a esa fórmula.</text>
<rect x="150" y="345" width="900" height="120" rx="24" fill="#eef0fb"/><text x="190" y="393" font-size="24" font-weight="700" fill="#101858">2 · AJUSTE</text><text x="380" y="393" font-size="19" fill="#34364a">Aumenta sólo si tolera y el objetivo no se logra</text><text x="380" y="430" font-size="16" fill="#686b80">No persigas descamación como indicador de “funcionamiento”.</text>
<rect x="210" y="510" width="780" height="120" rx="24" fill="#fff1f7"/><text x="250" y="558" font-size="24" font-weight="700" fill="#101858">3 · PAUSA</text><text x="420" y="558" font-size="19" fill="#34364a">Ardor, tirantez, rojez o reacción creciente</text><text x="420" y="595" font-size="16" fill="#686b80">Reduce carga antes de sumar otro tratamiento.</text>
<text x="90" y="715" font-size="20" font-weight="700" fill="#ed3489">Frecuencia correcta = mínima exposición que cumple el objetivo con buena tolerancia.</text>
<text x="90" y="760" font-size="16" fill="#686b80">Yeppo Academy · La pauta del fabricante es el punto de partida, no una obligación de escalar.</text>
</g></svg>