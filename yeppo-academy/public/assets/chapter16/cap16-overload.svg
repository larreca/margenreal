<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#fff"/>
<text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Semáforo de tolerancia</text>
<text x="70" y="120" font-family="Arial" font-size="18" fill="#686b80">No normalices una reacción intensa llamándola “purga”</text>
<g font-family="Arial">
<rect x="80" y="185" width="1040" height="145" rx="26" fill="#eef8f4"/><circle cx="135" cy="257" r="25" fill="#57a67d"/><text x="185" y="235" font-size="23" font-weight="700" fill="#101858">VERDE · TOLERANCIA</text><text x="185" y="278" font-size="18" fill="#34364a">Sin ardor persistente · objetivo se cumple · hidratación confortable</text>
<rect x="80" y="365" width="1040" height="145" rx="26" fill="#fff8e9"/><circle cx="135" cy="437" r="25" fill="#d8a83b"/><text x="185" y="415" font-size="23" font-weight="700" fill="#101858">AMARILLO · AJUSTAR</text><text x="185" y="458" font-size="18" fill="#34364a">Sequedad, tirantez o sensibilidad creciente → espaciar y simplificar</text>
<rect x="80" y="545" width="1040" height="145" rx="26" fill="#fff1f7"/><circle cx="135" cy="617" r="25" fill="#d55779"/><text x="185" y="595" font-size="23" font-weight="700" fill="#101858">ROJO · DETENER / DERIVAR</text><text x="185" y="638" font-size="18" fill="#34364a">Edema importante · ampollas · dolor fuerte · secreción · compromiso ocular</text>
<text x="80" y="755" font-size="17" fill="#686b80">Retail describe señales y reconoce límites; no diagnostica dermatitis, quemadura química ni “barrera destruida”.</text>
</g></svg>