<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" fill="#fff"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#101858">Replenishment vs Winback</text><g font-family="Arial"><rect x="110" y="190" width="430" height="360" rx="30" fill="#eef8f4"/><text x="160" y="250" font-size="27" font-weight="700" fill="#101858">REPLENISHMENT</text><text x="160" y="320" font-size="18" fill="#34364a">Dentro del ciclo esperado</text><text x="160" y="370" font-size="18" fill="#34364a">“¿Se está terminando?”</text><rect x="660" y="190" width="430" height="360" rx="30" fill="#fff1f7"/><text x="720" y="250" font-size="27" font-weight="700" fill="#101858">WINBACK</text><text x="720" y="320" font-size="18" fill="#34364a">Fuera del ciclo normal</text><text x="720" y="370" font-size="18" fill="#34364a">“¿Cambió algo?”</text><text x="110" y="665" font-size="20" font-weight="700" fill="#ed3489">El momento cambia el mensaje.</text></g></svg>