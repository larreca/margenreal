<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#fff"/>
<text x="70" y="78" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Cómo priorizar varias preocupaciones</text>
<text x="70" y="118" font-family="Arial" font-size="18" fill="#686b80">Infografía Yeppo Academy · menos objetivos simultáneos = más claridad</text>
<g font-family="Arial">
<rect x="100" y="175" width="1000" height="90" rx="22" fill="#fff0f1"/><text x="135" y="215" font-size="21" font-weight="700" fill="#b42318">1 · SEGURIDAD</text><text x="135" y="245" font-size="18" fill="#33364b">dolor · nódulos profundos · lesión cambiante · sangrado · hinchazón · reacción intensa → derivar</text>
<rect x="145" y="285" width="910" height="90" rx="22" fill="#fff7e9"/><text x="180" y="325" font-size="21" font-weight="700" fill="#101858">2 · CONTROLAR LO ACTIVO</text><text x="180" y="355" font-size="18" fill="#33364b">brote inflamatorio o irritación antes de perseguir marcas y luminosidad</text>
<rect x="190" y="395" width="820" height="90" rx="22" fill="#eef8f4"/><text x="225" y="435" font-size="21" font-weight="700" fill="#101858">3 · PROTEGER LA BARRERA</text><text x="225" y="465" font-size="18" fill="#33364b">si la piel no tolera la rutina, reducir variables</text>
<rect x="235" y="505" width="730" height="90" rx="22" fill="#eef0fb"/><text x="270" y="545" font-size="21" font-weight="700" fill="#101858">4 · OBJETIVO COSMÉTICO PRINCIPAL</text><text x="270" y="575" font-size="18" fill="#33364b">manchas · poros · textura · líneas · luminosidad</text>
<rect x="280" y="615" width="640" height="90" rx="22" fill="#f3efff"/><text x="315" y="655" font-size="21" font-weight="700" fill="#101858">5 · OBJETIVO SECUNDARIO</text><text x="315" y="685" font-size="18" fill="#33364b">solo cuando la rutina base ya es tolerable</text>
</g></svg>