<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#fff"/>
<text x="70" y="80" font-family="Arial" font-size="36" font-weight="700" fill="#101858">Mapa de preocupaciones de piel</text>
<text x="70" y="120" font-family="Arial" font-size="18" fill="#686b80">Infografía Yeppo Academy · primero priorizar, después elegir activos</text>
<g font-family="Arial">
<rect x="70" y="180" width="330" height="150" rx="24" fill="#eef0fb"/><text x="100" y="225" font-size="24" font-weight="700" fill="#101858">IMPERFECCIONES</text><text x="100" y="265" font-size="18" fill="#33364b">comedones · pápulas · brotes</text><text x="100" y="298" font-size="16" fill="#686b80">No todo brote es acné.</text>
<rect x="435" y="180" width="330" height="150" rx="24" fill="#fff1f7"/><text x="465" y="225" font-size="24" font-weight="700" fill="#101858">MANCHAS</text><text x="465" y="265" font-size="18" fill="#33364b">PIH · tono desigual · melasma</text><text x="465" y="298" font-size="16" fill="#686b80">Origen y profundidad importan.</text>
<rect x="800" y="180" width="330" height="150" rx="24" fill="#f3efff"/><text x="830" y="225" font-size="24" font-weight="700" fill="#101858">POROS / BRILLO</text><text x="830" y="265" font-size="18" fill="#33364b">sebo · elasticidad · folículo</text><text x="830" y="298" font-size="16" fill="#686b80">Apariencia, no “abrir/cerrar”.</text>
<rect x="70" y="360" width="330" height="150" rx="24" fill="#eef8f4"/><text x="100" y="405" font-size="24" font-weight="700" fill="#101858">TEXTURA</text><text x="100" y="445" font-size="18" fill="#33364b">aspereza · irregularidad</text><text x="100" y="478" font-size="16" fill="#686b80">Puede mejorar con hidratación.</text>
<rect x="435" y="360" width="330" height="150" rx="24" fill="#fff7e9"/><text x="465" y="405" font-size="24" font-weight="700" fill="#101858">LÍNEAS / EDAD</text><text x="465" y="445" font-size="18" fill="#33364b">intrínseco + fotoenvejecimiento</text><text x="465" y="478" font-size="16" fill="#686b80">Prevención UV es central.</text>
<rect x="800" y="360" width="330" height="150" rx="24" fill="#eef8ff"/><text x="830" y="405" font-size="24" font-weight="700" fill="#101858">ROJEZ</text><text x="830" y="445" font-size="18" fill="#33364b">flushing · irritación · inflamación</text><text x="830" y="478" font-size="16" fill="#686b80">Puede tener múltiples causas.</text>
<rect x="255" y="570" width="690" height="120" rx="28" fill="#101858"/>
<text x="305" y="615" font-size="26" font-weight="700" fill="#fff">ORDEN DE DECISIÓN</text>
<text x="305" y="655" font-size="19" fill="#fff">1. seguridad → 2. preocupación principal → 3. estado/tipo → 4. rutina</text>
<text x="70" y="750" font-size="18" font-weight="700" fill="#ed3489">Una persona puede tener varias preocupaciones; la prioridad evita rutinas largas y contradictorias.</text>
</g></svg>