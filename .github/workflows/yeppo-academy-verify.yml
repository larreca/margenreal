name: Yeppo Academy MVP Verify

on:
  push:
    branches: [main]
    paths:
      - "yeppo-academy/**"
      - ".github/workflows/yeppo-academy-verify.yml"
  pull_request:
    branches: [main]
    paths:
      - "yeppo-academy/**"
      - ".github/workflows/yeppo-academy-verify.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yeppo-academy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: yeppo-academy/package.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: node --test tests/*.test.mjs

      - name: Static inventory and asset checks
        run: node scripts/audit-inventory.mjs

      - name: Upload evidence matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academy-evidence-matrix
          path: |
            yeppo-academy/reports/matriz-evidencias-400.csv
            yeppo-academy/reports/auditoria-estatica.json
          if-no-files-found: warn

      - name: Build
        env:
          AUTH_SECRET: build-only-secret-not-used-in-production
          SETUP_TOKEN: build-only-setup-token
        run: npm run build
