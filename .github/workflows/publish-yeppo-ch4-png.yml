name: Publicar 8 PNG aprobados del capítulo 4
on:
  push:
    branches: [codex/academy-production-pilot]
    paths:
      - ".github/workflows/publish-yeppo-ch4-png.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rama de producción
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: codex/academy-production-pilot
      - name: Descargar contenedor PNG de originales completos
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --silent --show-error -H 'Accept: image/png' --output /tmp/yeppo-ch4-original.png 'https://cdn.shopify.com/s/files/1/0638/7348/2901/files/yeppo-academy-ch4-original-png-bytes.png?v=1792151350'
      - name: Restaurar ZIP y ocho PNG byte por byte
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import pathlib,struct,zipfile,io,hashlib
          from PIL import Image
          carrier=Image.open('/tmp/yeppo-ch4-original.png').convert('RGB').tobytes()
          n=struct.unpack('>Q',carrier[:8])[0]
          payload=carrier[8:8+n]
          actual=hashlib.sha256(payload).hexdigest()
          expected='4dbf3fbe108153e56c7cff6e20a18a2da68cbb34156b494f7e6196bbea8808c9'
          if actual!=expected:raise SystemExit("ZIP original no coincide con SHA-256; no se publicará")
          nfiles=0
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              for name in z.namelist():
                  if not name.startswith('yeppo-academy/public/assets/chapter4/') or not name.endswith('.png'):continue
                  p=pathlib.Path(name)
                  if '..' in p.parts:raise SystemExit("Ruta no válida")
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(z.read(name))
                  nfiles+=1
          if nfiles!=8:raise SystemExit(f"Se esperaban 8 PNG, llegaron {nfiles}")
          print(f"Restaurados {nfiles} PNG originales sin modificaciones")
          PY
      - name: Verificar SHA-256 (originales aprobados)
        shell: bash
        run: |
          set -euo pipefail
          {
          echo 'add2cf85d000a6c1db2baba628e163d5d44f418f6ec4420f5533eb12d6b10404  yeppo-academy/public/assets/chapter4/cap4-4.1-capas-piel.png'
          echo '91b284d46a8161f07ce539b320576a2e56514af35aa229eae51406e6886ee1b5  yeppo-academy/public/assets/chapter4/cap4-4.2-epidermis.png'
          echo '4b39c1247377102866a95f68d9ac5afdf30c0a163e056a8b383b7c50b7da7dc0  yeppo-academy/public/assets/chapter4/cap4-4.3-barrera-cutanea.png'
          echo '7f2f136d58c92a3b143d4833c2c3390f18f2bdb41b4981d5d232626752b0a425  yeppo-academy/public/assets/chapter4/cap4-4.4-dermis.png'
          echo 'c1bb18728bb8f765a50c460b8f8289cf76cef863fecd749f452f7fff41fd34d8  yeppo-academy/public/assets/chapter4/cap4-4.5-foliculos.png'
          echo 'aa4c7d4b77ca17e449c10af2bf91e3b9bf863d3fe8a63c35b18e5c813070d20d  yeppo-academy/public/assets/chapter4/cap4-4.6-melanina.png'
          echo 'af4e5f42ae63a7120b5829093f191a8781dfac5dcf72c7c23798a16099588cee  yeppo-academy/public/assets/chapter4/cap4-4.7-microbioma.png'
          echo '8e1efbfe63e7568f62125cf418a33c79abdb2e8390e6f5095703231b72d2448e  yeppo-academy/public/assets/chapter4/cap4-4.8-limites-vendedor.png'
          } | sha256sum --check --status
      - name: Vincular módulos y validar tamaño y resolución
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,struct
          base=pathlib.Path("yeppo-academy")
          f=base/"lib/chapter-visuals.js"
          s=f.read_text(encoding="utf-8")
          names=["cap4-4.1-capas-piel","cap4-4.2-epidermis","cap4-4.3-barrera-cutanea","cap4-4.4-dermis","cap4-4.5-foliculos","cap4-4.6-melanina","cap4-4.7-microbioma","cap4-4.8-limites-vendedor"]
          for name in names:
              binary=(base/"public/assets/chapter4"/(name+".png")).read_bytes()
              if not binary.startswith(bytes([137,80,78,71,13,10,26,10])) or struct.unpack(">II",binary[16:24])!=(1672,941):
                  raise SystemExit("PNG inválido: "+name)
              before='"'+name+'.svg"'
              after='"'+name+'.png"'
              if s.count(before)!=1:
                  raise SystemExit("No se encontró referencia única: "+before)
              s=s.replace(before,after)
          s=s.replace("?v=20261015c","?v=ch4-png-20261016")
          f.write_text(s,encoding="utf-8")
          print("8 ilustraciones PNG originales vinculadas")
          PY
      - name: Confirmar cambios en la rama de producción
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yeppo-academy/lib/chapter-visuals.js yeppo-academy/public/assets/chapter4/*.png
          if git diff --cached --quiet; then
            echo "Sin cambios adicionales"
          else
            git commit -m "Publish eight approved original PNG infographics for Chapter 4"
            git push origin HEAD:refs/heads/codex/academy-production-pilot
          fi
